name: cycle1195-opening-hook-quality
on:
  pull_request:
    paths:
      - 'quality/cycle1195/**'
      - '.github/workflows/cycle1195-hook.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pillow
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1195/tests -v
      - name: Synthetic H264 AAC smoke (no private media)
        run: python quality/cycle1195/tests/ci_smoke.py
