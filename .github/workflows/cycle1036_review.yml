name: cycle1036 review-only kinetic hook
on:
  push:
    paths: ['cycle1036/**', '.github/workflows/cycle1036_review.yml']
  pull_request:
    paths: ['cycle1036/**', '.github/workflows/cycle1036_review.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install offline free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Unit tests across ten genre text presets
        run: python3 -m unittest discover -s cycle1036/tests -p 'test_*.py' -v
      - name: Create synthetic two-second H264 AAC video (no user media)
        run: |
          mkdir -p /tmp/cycle1036
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0x153c55:s=1080x1920:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -preset ultrafast -threads 2 -pix_fmt yuv420p \
            -c:a aac -ar 48000 -shortest /tmp/cycle1036/in.mp4
      - name: Render review-only synthetic MP4 and verify A/V
        run: |
          sha256sum /tmp/cycle1036/in.mp4 | awk '{print $1}' > /tmp/cycle1036/source_sha
          python3 cycle1036/source/kinetic_hook.py \
            --source /tmp/cycle1036/in.mp4 --output /tmp/cycle1036/out.mp4 \
            --report /tmp/cycle1036/qa.json \
            --expected-sha "$(cat /tmp/cycle1036/source_sha)" --review-only --synthetic-ci
          ffmpeg -v error -xerror -i /tmp/cycle1036/out.mp4 -f null -
          python3 -c "import json; q=json.load(open('/tmp/cycle1036/qa.json')); assert q['frames']==60 and q['audio_bitstream_unchanged'] and q['full_av_decode']=='PASS' and q['publication']=='NOT_APPROVED'"
