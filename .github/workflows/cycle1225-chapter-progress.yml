name: cycle1225-chapter-progress-review
on:
  push:
    branches: [quality/cycle1225-chapter-progress]
  pull_request:
    paths:
      - 'quality/cycle1225/**'
      - '.github/workflows/cycle1225-chapter-progress.yml'
  workflow_dispatch:
jobs:
  offline-progress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'Pillow>=10,<12'
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1225/tests -p 'test_*.py' -v
      - name: Synthetic 1080x1920 AV and full decode
        run: python quality/cycle1225/tests/ci_smoke.py
