name: cycle1146-readable-takeaway-review
on:
  push:
    branches: [quality/cycle1146-readable-takeaway]
  pull_request:
    paths:
      - 'quality/cycle1146/**'
      - '.github/workflows/cycle1146-readable-takeaway.yml'
  workflow_dispatch:
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install pillow==11.1.0
      - name: Run ten-genre safety tests
        env:
          PYTHONPATH: quality/cycle1146
        run: python -m unittest discover -s quality/cycle1146/tests -p 'test_*.py' -v
      - name: Synthetic H264/AAC render and decode
        env:
          PYTHONPATH: quality/cycle1146
        run: python quality/cycle1146/tests/ci_smoke.py
