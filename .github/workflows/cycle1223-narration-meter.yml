name: cycle1223-narration-meter-review
on:
  push:
    branches: [quality/cycle1223-audio-meter-sync]
  pull_request:
    paths:
      - 'quality/cycle1223/**'
      - '.github/workflows/cycle1223-narration-meter.yml'
  workflow_dispatch:
jobs:
  offline-meter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'numpy>=1.24,<3' 'Pillow>=10,<12'
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1223/tests -p 'test_*.py' -v
      - name: Synthetic 1080x1920 A/V smoke and full decode
        run: python quality/cycle1223/tests/ci_smoke.py
