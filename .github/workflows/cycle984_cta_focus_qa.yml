name: cycle984 CTA step focus review QA (synthetic only)
on:
  push:
    branches:
      - automation/cycle984-cta-steps-20261030
    paths:
      - 'cycle984/**'
      - '.github/workflows/cycle984_cta_focus_qa.yml'
  pull_request:
    paths:
      - 'cycle984/**'
      - '.github/workflows/cycle984_cta_focus_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Unit tests
        run: PYTHONPATH=cycle984 python -m unittest discover -s cycle984 -p 'test_*.py' -v
      - name: Synthetic 2s A/V render (not private user MP4)
        run: |
          mkdir -p /tmp/cycle984
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x06303a:s=1080x1920:r=30:d=2' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=2' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle984/source.mp4
          python cycle984/cta_focus.py --source /tmp/cycle984/source.mp4 --output /tmp/cycle984/output.mp4 --work /tmp/cycle984/work --synthetic --start 0 --end 60
          ffmpeg -hide_banner -loglevel error -i /tmp/cycle984/output.mp4 -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nw=1:nk=1 /tmp/cycle984/output.mp4)" = "60"
