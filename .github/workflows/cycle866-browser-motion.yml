name: cycle866 browser motion regression
on:
  pull_request:
    paths:
      - 'experiments/cycle866/**'
      - '.github/workflows/cycle866-browser-motion.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run 10-genre cursor motion unit tests (no external services)
        run: python -m unittest discover -s experiments/cycle866 -p 'test_*.py' -v
