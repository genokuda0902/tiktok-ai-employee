name: cycle860 chart story (synthetic review only)
on:
  push:
    paths:
      - 'cycle860/**'
      - '.github/workflows/cycle860-chart-story.yml'
  pull_request:
    paths:
      - 'cycle860/**'
      - '.github/workflows/cycle860-chart-story.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Unit tests (no private media)
        run: PYTHONPATH=cycle860 python -m unittest discover -s cycle860 -p 'test_*.py' -v
      - name: Generate original chart PNGs and synthetic video smoke
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'cycle860')
          from chart_story import frames_to_disk
          frames_to_disk('/tmp/chart_frames')
          PY
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=0x0a2230:s=1080x1920:r=30:d=3' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/source.mp4
          ffmpeg -hide_banner -loglevel error -i /tmp/source.mp4 -framerate 30 -i /tmp/chart_frames/chart_%03d.png -filter_complex '[0:v][1:v]overlay=x=86:y=476:eof_action=pass:repeatlast=0[v]' -map '[v]' -map 0:a:0 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a copy /tmp/chart-smoke.mp4
          ffmpeg -v error -i /tmp/chart-smoke.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,sample_rate -of json /tmp/chart-smoke.mp4