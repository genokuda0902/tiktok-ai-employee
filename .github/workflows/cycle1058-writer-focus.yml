name: cycle1058 Writer UI offline QA
on:
  push:
    branches:
      - 'quality/cycle1058-real-writer-focus-20261031'
    paths:
      - 'quality/cycle1058/**'
      - '.github/workflows/cycle1058-writer-focus.yml'
  pull_request:
    paths:
      - 'quality/cycle1058/**'
      - '.github/workflows/cycle1058-writer-focus.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free QA dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Unit tests (10 genres)
        run: python -m unittest discover -s quality/cycle1058/tests -v
      - name: Synthetic H264/AAC smoke
        run: python quality/cycle1058/real_writer_focus.py --smoke
