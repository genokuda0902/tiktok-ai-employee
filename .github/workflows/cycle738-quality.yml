name: Cycle 738 quality checks
on:
  pull_request:
    paths:
      - 'video_engine/quality_cycle738/**'
      - 'tests/test_cycle738_contract.py'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cycle738_contract.py'
