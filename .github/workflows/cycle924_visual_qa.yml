name: cycle924 clear storyboard QA
on:
  push:
    branches: ['review/cycle924-clear-report-preview-20261028']
    paths:
      - 'cycle924/**'
      - '.github/workflows/cycle924_visual_qa.yml'
  pull_request:
    paths:
      - 'cycle924/**'
      - '.github/workflows/cycle924_visual_qa.yml'
  workflow_dispatch:
jobs:
  safe-storyboard-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Test source and subtitle safe area
        run: PYTHONPATH=cycle924/src python -m unittest discover -s cycle924/tests -p 'test_*.py' -v
      - name: Ensure private media is not committed
        run: |
          if find cycle924 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.mov' \) | grep .; then
            echo 'Private media in public repository'; exit 1
          fi
