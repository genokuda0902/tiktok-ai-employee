name: cycle928 audio-reactive meter review-only QA
on:
  pull_request:
    paths:
      - 'cycle928/**'
      - '.github/workflows/cycle928_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Pillow dependency
        run: python -m pip install Pillow
      - name: Run deterministic renderer tests
        run: python -m unittest discover -s cycle928/tests -p 'test_*.py' -v
      - name: Fail closed - no private media and no auto-post
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle928/src/voice_meter.py
          test ! -e cycle928/output
