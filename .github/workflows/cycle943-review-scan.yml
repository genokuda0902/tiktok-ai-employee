name: cycle943-review-scan-tests
on:
  pull_request:
    paths:
      - 'cycle943/**'
      - '.github/workflows/cycle943-review-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open-source dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Test ten genre configurations and safe-area rendering
        run: python -m unittest discover -s cycle943/tests -v
      - name: Syntax
        run: python -m py_compile cycle943/src/review_scan.py
# No private MP4 is uploaded, posted, or published by this workflow.
