name: cycle534 proof scene regression
on:
  push:
    branches:
      - 'quality/cycle534-verifiable-math-card-20261013'
    paths:
      - 'quality_cycles/cycle534/**'
      - '.github/workflows/quality-cycle534.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s quality_cycles/cycle534 -p 'test_*.py' -v
