name: cycle868 illustrated closer ten-genre QA
on:
  push:
    branches: [automation/cycle868-original-illustrated-closer-20261026]
    paths:
      - 'cycle868/**'
      - '.github/workflows/cycle868-illustrated-closer.yml'
  pull_request:
    paths:
      - 'cycle868/**'
      - '.github/workflows/cycle868-illustrated-closer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free libraries and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy imageio-ffmpeg
      - name: Test all ten genres, image rendering and fail-closed safety
        run: PYTHONPATH=cycle868 python -m unittest discover -s cycle868 -p 'test_*.py' -v
      - name: Smoke-test H264 AAC synthetic AV (not private Japanese MP4)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x08283e:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle868_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle868_synthetic.mp4 -f null -
