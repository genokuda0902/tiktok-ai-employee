name: cycle1173-clean-rail-review
on:
  push:
    branches: [quality/cycle1173-clean-audio-rail]
  pull_request:
    paths:
      - 'quality/cycle1173/**'
      - '.github/workflows/cycle1173-clean-rail.yml'
  workflow_dispatch:
jobs:
  offline-rail-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free FFmpeg and Noto CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1173/tests -p 'test_*.py' -v
      - name: Synthetic 60-frame A/V smoke
        run: python quality/cycle1173/tests/ci_smoke.py
