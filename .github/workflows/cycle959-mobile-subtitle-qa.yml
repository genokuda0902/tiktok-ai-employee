name: cycle959 mobile subtitle QA (review only)
on:
  pull_request:
    paths:
      - 'quality/cycle959/**'
      - '.github/workflows/cycle959-mobile-subtitle-qa.yml'
  push:
    paths:
      - 'quality/cycle959/**'
      - '.github/workflows/cycle959-mobile-subtitle-qa.yml'
permissions:
  contents: read
jobs:
  mobile-subtitle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install pillow
      - run: python -m unittest discover -s quality/cycle959/tests -v
