name: cycle1176 readable review disclosure (synthetic QA)
on:
  push:
    branches: ['quality/cycle1176-readable-review-disclosure']
    paths: ['quality/cycle1176/**', '.github/workflows/cycle1176-review-disclosure.yml']
  pull_request:
    paths: ['quality/cycle1176/**', '.github/workflows/cycle1176-review-disclosure.yml']
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1176/tests -p 'test_*.py' -v
      - name: Render and decode synthetic test video (no private assets)
        run: |
          mkdir -p /tmp/c1176
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=navy:s=1080x1920:r=30:d=1.6' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=1.6' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/c1176/source.mp4
          python - <<'PY'
          import hashlib,json
          p='/tmp/c1176/source.mp4'
          m={'policy':'HUMAN_REVIEW/PUBLICATION_NOT_APPROVED','asset_approval':'review_only_no_publication','manual_post_only':True,'disclosure_roi_reviewed':True,'genre':'ai','source_sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'start':0.2,'end':1.2}
          open('/tmp/c1176/manifest.json','w').write(json.dumps(m))
          PY
          python quality/cycle1176/review_disclosure.py --source /tmp/c1176/source.mp4 --output /tmp/c1176/result.mp4 --manifest /tmp/c1176/manifest.json --report /tmp/c1176/qa.json --overlay /tmp/c1176/panel.png
          python - <<'PY'
          import json
          r=json.load(open('/tmp/c1176/qa.json'))
          assert r['technical_pass'] and r['aac_adts_bit_identical']
          assert r['text_contrast_ratio']>=7 and not r['publication_approved']
          PY
