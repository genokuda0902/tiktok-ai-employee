name: cycle1423 quality gate
on:
  pull_request:
    paths:
      - 'quality/**'
      - '.github/workflows/cycle1423-quality.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s quality -p 'test_media_gate.py'
