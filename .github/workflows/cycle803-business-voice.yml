name: cycle804 free Japanese business voice recovery
on:
  pull_request:
    paths:
      - 'quality/cycle803/**'
      - 'quality/cycle804/**'
      - '.github/workflows/cycle803-business-voice.yml'
  workflow_dispatch:
jobs:
  generate-business-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free Open JTalk without apt index refresh
        run: |
          set -euxo pipefail
          apt-cache policy open-jtalk hts-voice-nitech-jp-atr503-m001
          timeout 360s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001 ffmpeg
          command -v ffmpeg
          command -v open_jtalk
          find /usr/share -name '*.htsvoice' -print
      - name: Test narration and 10 genre contract
        run: cd quality/cycle803 && python -m unittest -v test_contract.py
      - name: Test cycle804 video assembly contract
        run: python -m unittest discover -s quality/cycle804 -p 'test_*.py' -v
      - name: Generate fresh Japanese narration
        run: python quality/cycle803/tts_ci.py
      - name: Verify audio decode
        run: |
          test -s quality/cycle803/out/cycle803_business_japanese.m4a
          ffmpeg -v error -xerror -i quality/cycle803/out/cycle803_business_japanese.m4a -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: cycle804-business-japanese-voice-review
          path: |
            quality/cycle803/out/cycle803_business_japanese.m4a
            quality/cycle803/out/voice_timing.json
          retention-days: 7
