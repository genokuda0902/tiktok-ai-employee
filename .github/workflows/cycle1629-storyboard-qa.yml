name: Cycle1629 review-only storyboard QA
on:
  pull_request:
    paths:
      - 'quality/cycle1629/**'
      - '.github/workflows/cycle1629-storyboard-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: python -m unittest discover -s quality/cycle1629 -p 'test_*.py' -v
