name: cycle811 opaque action-card review QA
on:
  push:
    branches: ['quality/cycle811-*']
    paths:
      - 'quality/cycle811/**'
      - '.github/workflows/cycle811-review.yml'
  pull_request:
    paths:
      - 'quality/cycle811/**'
      - '.github/workflows/cycle811-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free dependencies and Japanese font
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0
          curl --fail --location --retry 3 --max-time 120 --output "$RUNNER_TEMP/NotoSansJP-Bold.otf" "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP/NotoSansJP-Bold.otf"
          test -s "$RUNNER_TEMP/NotoSansJP-Bold.otf"
          echo "CYCLE811_FONT=$RUNNER_TEMP/NotoSansJP-Bold.otf" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cycle811-bin"
          ln -s "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/cycle811-bin/ffmpeg"
          echo "$RUNNER_TEMP/cycle811-bin" >> "$GITHUB_PATH"
          if ! command -v ffprobe; then timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg; fi
          command -v ffprobe
      - name: Ten-genre and opaque-card regression tests
        run: PYTHONPATH=quality/cycle811 python -m unittest discover -s quality/cycle811 -p 'test_*.py' -v
      - name: Generate synthetic source only (no inherited user audio)
        run: |
          set -euxo pipefail
          mkdir -p review_output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x10243b:s=1080x1920:r=30:d=23.933333' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=23.933333' \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 34 \
            -frames:v 718 -pix_fmt yuv420p -c:a aac -ar 48000 \
            "$RUNNER_TEMP/cycle811_source.mp4"
      - name: Render, decode and check no publication
        run: |
          set -euxo pipefail
          python quality/cycle811/action_panel.py --source "$RUNNER_TEMP/cycle811_source.mp4" --output review_output/cycle811_SYNTHETIC_REVIEW_ONLY.mp4
          ffmpeg -v error -xerror -i review_output/cycle811_SYNTHETIC_REVIEW_ONLY.mp4 -f null -
          python -c "import json; q=json.load(open('review_output/cycle811_qa.json')); assert q['publication_approved'] is False and q['auto_post'] is False and q['frames']==718"
      - name: Upload synthetic-only QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle811-synthetic-only-video-and-qa
          path: |
            review_output/cycle811_SYNTHETIC_REVIEW_ONLY.mp4
            review_output/cycle811_qa.json
          retention-days: 7
