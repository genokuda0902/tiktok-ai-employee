name: Cycle1598 review render
on:
  pull_request:
    paths:
      - 'review_cycles/cycle1598/**'
      - '.github/workflows/cycle1598-review.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install Pillow==12.0.0
      - run: cd review_cycles/cycle1598 && python -m unittest -v test_render && python render.py
      - run: ffmpeg -v error -i review_cycles/cycle1598/cycle1598_REVIEW_ONLY.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: cycle1598-review-mp4
          path: review_cycles/cycle1598/cycle1598_REVIEW_ONLY.mp4
