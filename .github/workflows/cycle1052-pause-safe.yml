name: cycle1052 pause-safe synthetic QA
on:
  pull_request:
    paths:
      - 'quality/cycle1052/**'
      - '.github/workflows/cycle1052-pause-safe.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests for 10 genres and no-speech-masking guard
        run: python -m unittest discover -s quality/cycle1052/tests -v
      - name: Synthetic H264/AAC video render and decode
        run: |
          ffmpeg -version
          python quality/cycle1052/ci_smoke.py
