name: cycle907 narrative rail and ASR fail-closed QA
on:
  push:
    paths:
      - 'review_cycles/cycle907/**'
      - '.github/workflows/cycle907_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle907/**'
      - '.github/workflows/cycle907_review_qa.yml'
permissions:
  contents: read
jobs:
  review-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image dependency and Japanese font
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Test ten genres, three acts and independent-ASR fail-closed policy
        run: PYTHONPATH=review_cycles/cycle907 python -m unittest discover -s review_cycles/cycle907 -p 'test_*.py' -v
      - name: Prevent media inclusion in this review PR
        run: |
          ! find review_cycles/cycle907 -type f \( -name '*.mp4' -o -name '*.m4a' \) | grep .
