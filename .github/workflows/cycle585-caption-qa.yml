name: cycle585 isolated caption QA
on:
  pull_request:
    paths:
      - 'quality/cycle585/**'
      - '.github/workflows/cycle585-caption-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy pytest
      - name: Run cycle585 regression tests
        run: |
          cd quality/cycle585
          python -m pytest -q tests/test_cycle585.py
