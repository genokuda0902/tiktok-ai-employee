name: cycle851 immersive photo offline checks

on:
  pull_request:
    paths:
      - 'experiments/cycle851/**'
      - '.github/workflows/cycle851_immersive_photo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-layout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Run synthetic-only tests (no user assets)
        run: python -m unittest discover -s experiments/cycle851 -p 'test_immersive_photo.py' -v
