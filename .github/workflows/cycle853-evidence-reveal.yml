name: cycle853 offline evidence reveal review-only CI
on:
  push:
    branches:
      - 'automation/cycle853-*'
  pull_request:
    paths:
      - 'cycle853/**'
      - '.github/workflows/cycle853-evidence-reveal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free offline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5' 'Pillow>=10,<12'
      - name: Unit tests (10 genres, safe region, policy)
        run: |
          python -m compileall -q cycle853
          PYTHONPATH=cycle853 python -m unittest discover -s cycle853 -p 'test_*.py' -v
      - name: Synthetic MP4 and bit-exact AAC-copy smoke
        run: |
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1080x1920:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -c:a aac -shortest /tmp/c853_src.mp4
          PYTHONPATH=cycle853 python - <<'PY'
          from pathlib import Path
          from scene8_evidence_reveal import render,sha256,POLICY
          s=Path('/tmp/c853_src.mp4')
          r=render(s,'/tmp/c853_out.mp4',{**POLICY,'source_sha256':sha256(s)},'ai_work',(40,60),(10,20))
          assert r['frames']==60 and r['changed_frames']==20 and r['full_av_decode']
          assert not r['publication_approved']
          print('CYCLE853_SYNTHETIC_RENDER_PASS',r['output_sha256'])
          PY
          ffmpeg -v error -y -i /tmp/c853_src.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c853_before.aac
          ffmpeg -v error -y -i /tmp/c853_out.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c853_after.aac
          cmp /tmp/c853_before.aac /tmp/c853_after.aac