name: cycle1431 isolated audio QA
on:
  pull_request:
    paths:
      - 'quality/cycle1431/**'
      - '.github/workflows/cycle1431-audio-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated tests
        run: python -m unittest discover -s quality/cycle1431 -p 'test_*.py' -v
