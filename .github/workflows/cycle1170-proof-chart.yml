name: cycle1170-fictional-proof-chart-review
on:
  push:
    branches: [quality/cycle1170-proportional-chart]
  pull_request:
    paths:
      - 'quality/cycle1170/**'
      - '.github/workflows/cycle1170-proof-chart.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free FFmpeg and CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1170/tests -p 'test_*.py' -v
      - name: Synthetic MP4 QA only
        run: python quality/cycle1170/tests/ci_smoke.py
