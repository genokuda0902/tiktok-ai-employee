name: cycle911 offline review-only policy checks
on:
  push:
    paths:
      - 'review_cycles/cycle911/**'
      - '.github/workflows/cycle911_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle911/**'
      - '.github/workflows/cycle911_review_qa.yml'
  workflow_dispatch:
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run offline stdlib policy tests (no private media)
        run: python3 -m unittest discover -s review_cycles/cycle911 -p 'test_cycle911.py' -v
      - name: Verify no completed MP4 or local screenshots were committed
        run: |
          if find review_cycles/cycle911 -type f \( -iname '*.mp4' -o -iname '*.png' -o -iname '*.xlsx' \) | grep -q .; then
            echo 'Private or local media must not be committed' >&2
            exit 1
          fi
