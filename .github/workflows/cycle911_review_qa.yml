name: cycle911 UI-safe CTA offline QA
on:
  push:
    branches:
      - automation/cycle911-ui-safe-cta-20261028
    paths:
      - 'review_cycles/cycle911/**'
      - '.github/workflows/cycle911_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle911/**'
      - '.github/workflows/cycle911_review_qa.yml'
permissions:
  contents: read
jobs:
  offline-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile renderer
        run: python -m py_compile review_cycles/cycle911/safe_cta.py
      - name: Run dependency-free review policy tests
        run: python -m unittest discover -s review_cycles/cycle911 -p 'test_cycle911_policy.py' -v
      - name: Ensure no private media is committed
        run: |
          ! find review_cycles/cycle911 -type f \( -name '*.mp4' -o -name '*.aac' -o -name '*.wav' -o -name '*.m4a' \) | grep .
      - name: Publication remains blocked
        run: echo 'HUMAN_REVIEW / PUBLICATION_NOT_APPROVED'
