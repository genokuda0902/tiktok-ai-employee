name: cycle1299 isolated QA
on:
  pull_request:
    paths:
      - 'review/cycle1299/**'
      - '.github/workflows/cycle1299-review.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s review/cycle1299 -p 'test_*.py' -v
