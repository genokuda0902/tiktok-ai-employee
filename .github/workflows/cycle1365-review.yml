name: Review-only MP4 regression
on:
  pull_request:
    paths:
      - 'review/cycle1365/**'
      - '.github/workflows/cycle1365-review.yml'
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install Pillow==11.3.0
      - run: cd review/cycle1365 && python -m unittest -v test_render.py
      - run: cd review/cycle1365 && python render.py --output cycle1365_REVIEW_ONLY.mp4
      - run: ffmpeg -v error -i review/cycle1365/cycle1365_REVIEW_ONLY.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: cycle1365-review-mp4
          path: review/cycle1365/cycle1365_REVIEW_ONLY.mp4
