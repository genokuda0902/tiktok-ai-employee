name: cycle814-editorial-contract
on:
  pull_request:
    paths:
      - 'quality/cycle814/**'
      - '.github/workflows/cycle814-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run stdlib-only tests
        run: |
          cd quality/cycle814
          python -m unittest -v test_editorial_contract.py
