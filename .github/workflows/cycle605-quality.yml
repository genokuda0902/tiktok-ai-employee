name: cycle605 original audio QA
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle605/**'
      - '.github/workflows/cycle605-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free audio test dependencies
        run: python -m pip install numpy
      - name: Test deterministic original audio
        run: python -m unittest quality_cycles.cycle605.test_sound_core -v
