name: cycle1197-audio-reactive-meter
on:
  pull_request:
    paths:
      - 'quality/cycle1197/**'
      - '.github/workflows/cycle1197-audio-meter.yml'
  workflow_dispatch:
jobs:
  quality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy pillow
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1197/tests -p 'test_*.py' -v
      - name: Synthetic H264/AAC render and full decode
        run: python quality/cycle1197/tests/ci_smoke.py
