name: cycle846 offline centered SFX QA
on:
  pull_request:
    paths:
      - 'cycle846/**'
      - '.github/workflows/cycle846-voice-aware-sfx.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-purchase offline tools
        run: |
          python -m pip install 'numpy>=1.26,<3'
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run centered SFX tests
        run: |
          python -m compileall -q cycle845 cycle846
          PYTHONPATH=. python -m unittest discover -s cycle846 -p 'test_*.py' -v
      - name: Synthetic MP4 end-to-end with fake audio only
        run: |
          ffmpeg -v error -y -f lavfi -i color=c=navy:s=320x568:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/c846_source.mp4
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from cycle845.transition_audio import GATE,sha256
          from cycle846.voice_aware_sfx import render
          src=Path('/tmp/c846_source.mp4')
          out=Path('/tmp/c846_rendered.mp4')
          q=render(src,out,{**GATE,'source_sha256':sha256(src)},cuts=(10,30),strict=False)
          assert q['full_av_decode'] and q['video_stream_sha256_unchanged']
          assert len(q['cut_details'])==2 and not q['publication_approved']
          print('SYNTHETIC PASS:',q['output_sha256'])
          PY
