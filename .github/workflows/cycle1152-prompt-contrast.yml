name: cycle1152-prompt-contrast-review
on:
  push:
    branches: [quality/cycle1152-prompt-contrast]
  pull_request:
    paths:
      - 'quality/cycle1152/**'
      - '.github/workflows/cycle1152-prompt-contrast.yml'
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free local tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install pillow==11.1.0
      - name: Ten-genre policy and overlay tests
        env:
          PYTHONPATH: quality/cycle1152
        run: python -m unittest discover -s quality/cycle1152/tests -p 'test_*.py' -v
      - name: Synthetic two-second H264/AAC render and decode
        env:
          PYTHONPATH: quality/cycle1152
        run: python quality/cycle1152/tests/ci_smoke.py
