name: cycle867 audit focus ten-genre QA
on:
  push:
    branches: [automation/cycle867-audit-focus-20261026]
    paths:
      - 'cycle867/**'
      - '.github/workflows/cycle867-audit-focus.yml'
  pull_request:
    paths:
      - 'cycle867/**'
      - '.github/workflows/cycle867-audit-focus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source fonts and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Test all ten genres and fail-closed review-only policy
        run: PYTHONPATH=cycle867 python -m unittest discover -s cycle867 -p 'test_*.py' -v
      - name: Synthetic H264 AAC decode smoke test (NOT private Japanese video)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x0c263a:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle867_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle867_synthetic.mp4 -f null -