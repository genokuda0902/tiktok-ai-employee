name: cycle1143 illustration clarity synthetic QA
on:
  push:
    branches: ['quality/cycle1143-illustration-clarity-20261101']
  pull_request:
    paths:
      - 'quality/cycle1143/**'
      - '.github/workflows/cycle1143-illustration-clarity.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v ffprobe
      - name: 10-genre compositor unit tests
        run: python -m unittest discover -s quality/cycle1143/tests -p 'test_*.py' -v
      - name: Synthetic-only 1080x1920 full-decode AAC-integrity test
        run: python quality/cycle1143/code/ci_synthetic.py
