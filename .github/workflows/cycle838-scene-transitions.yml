name: cycle838 scene transition review-only CI
on:
  push:
    branches:
      - 'automation/cycle838-*'
  pull_request:
    paths:
      - 'cycle838/**'
      - '.github/workflows/cycle838-scene-transitions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install free FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test shared 10-genre transitions and provenance
        run: PYTHONPATH=. python -m unittest discover -s cycle838 -p 'test_*.py' -v
      - name: Synthetic-only audiovisual integration
        run: bash cycle838/ci_smoke.sh
      - name: Upload synthetic technical fixture ONLY
        uses: actions/upload-artifact@v4
        with:
          name: cycle838-SYNTHETIC-NOT-JAPANESE-NOT-PUBLISHABLE
          path: cycle838/ci_out/cycle838_SYNTHETIC_TECHNICAL_ONLY.mp4
          retention-days: 1
      - name: Publication gate
        run: echo 'HUMAN_REVIEW / PUBLICATION_NOT_APPROVED'
