name: cycle862 actionable outro synthetic-only CI
on:
  push:
    paths:
      - 'cycle862/**'
      - '.github/workflows/cycle862-actionable-outro.yml'
  pull_request:
    paths:
      - 'cycle862/**'
      - '.github/workflows/cycle862-actionable-outro.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Run ten-genre policy, rendering and regression tests
        run: PYTHONPATH=cycle862 python -m unittest discover -s cycle862 -p 'test_*.py' -v
      - name: Synthetic video/audio decode smoke (no private footage)
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=0x092030:s=1080x1920:r=30:d=1' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=1' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/synthetic.mp4
          ffmpeg -hide_banner -loglevel error -i /tmp/synthetic.mp4 -f null -