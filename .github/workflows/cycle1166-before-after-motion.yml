name: cycle1166-before-after-review
on:
  push:
    branches: [quality/cycle1166-before-after-motion]
  pull_request:
    paths:
      - 'quality/cycle1166/**'
      - '.github/workflows/cycle1166-before-after-motion.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Unit tests
        env:
          PYTHONPATH: quality/cycle1166
        run: python -m unittest discover -s quality/cycle1166/tests -p 'test_*.py' -v
      - name: Synthetic-only full-length MP4 and AAC QA
        env:
          PYTHONPATH: quality/cycle1166
        run: python quality/cycle1166/tests/ci_smoke.py
