name: cycle1048 before-after synthetic QA
on:
  push:
    branches:
      - automation/cycle1048-before-after-evidence-20261031
  pull_request:
    paths:
      - 'cycle1048/**'
      - '.github/workflows/cycle1048-before-after-qa.yml'
permissions:
  contents: read
jobs:
  offline-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free offline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Test 10 genre layouts and rights fail-closed gates
        run: python -m unittest discover -s cycle1048/tests -p 'test_*.py' -v
      - name: Synthetic 1-second H264/AAC playback smoke test (no private media)
        run: |
          mkdir -p /tmp/cycle1048frames
          python - <<'PY'
          import sys
          from PIL import Image
          sys.path.insert(0,'cycle1048/source')
          from before_after import frame,crop_evidence
          still=crop_evidence(Image.new('RGB',(1080,1920),'#335577'))
          for n in range(15):
              frame(n,'ai_work',still,still,still).save(f'/tmp/cycle1048frames/{n:03d}.png')
          PY
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x061426:s=1080x1920:r=15:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -t 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/cycle1048_base.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/cycle1048_base.mp4 -framerate 15 -i /tmp/cycle1048frames/%03d.png -filter_complex '[0:v][1:v]overlay=0:0:shortest=1[v]' -map '[v]' -map '0:a:0' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a copy /tmp/cycle1048_smoke.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1048_smoke.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,sample_rate -show_entries format=duration -of json /tmp/cycle1048_smoke.mp4
