name: cycle865 mobile readability offline tests
on:
  pull_request:
    paths:
      - "automation/cycle865/**"
      - ".github/workflows/cycle865-mobile-readability.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline regression tests
        run: python -m unittest discover -s automation/cycle865 -p "test_*.py" -v
