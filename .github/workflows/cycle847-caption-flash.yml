name: cycle847 caption flash guard offline QA
on:
  pull_request:
    paths:
      - 'cycle847/**'
      - '.github/workflows/cycle847-caption-flash.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline zero-purchase dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
          ffmpeg -version | head -1
      - name: Nine unit tests
        run: |
          python -m compileall -q cycle847
          PYTHONPATH=cycle847 python -m unittest discover -s cycle847 -p 'test_*.py' -v
      - name: Synthetic end-to-end H264 AAC review only
        run: |
          ffmpeg -v error -y -f lavfi -i color=c=navy:s=1080x1920:r=30:d=1 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 \
            -vf "drawbox=x=350:y=1640:w=380:h=90:color=white:t=fill:enable='not(eq(n,15))'" \
            -c:v libx264 -preset ultrafast -crf 26 -pix_fmt yuv420p -c:a aac -shortest /tmp/c847_source.mp4
          PYTHONPATH=cycle847 python - <<'PY'
          from pathlib import Path
          from cycle847.subtitle_flash_guard import POLICY,sha256,render
          s=Path('/tmp/c847_source.mp4');o=Path('/tmp/c847_out.mp4')
          q=render(s,o,{**POLICY,'source_sha256':sha256(s)})
          assert q['frames']==30 and q['repaired_frames']==[15] and q['full_av_decode']
          assert q['publication_approved'] is False
          print('SYNTHETIC PASS',q['output_sha256'])
          PY
