name: cycle991 speech-aware cues (offline synthetic CI)
on:
  pull_request:
    paths:
      - "quality/cycle991/**"
      - ".github/workflows/cycle991-speech-aware-cues.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Unit tests
        run: python quality/cycle991/test_speech_aware_cues.py -v
      - name: Generate synthetic 1080x1920 source (no third-party assets)
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=navy:s=1080x1920:r=30:d=1.5" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1.5" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest source.mp4
      - name: Render and validate
        run: |
          python quality/cycle991/speech_aware_cues.py source.mp4 result.mp4 --boundaries 15,30 --report result.json
          ffmpeg -v error -xerror -i result.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 result.mp4 | grep -F '1080,1920,30/1'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of csv=p=0 result.mp4 | grep -F 'aac,48000'
          ffmpeg -v error -i source.mp4 -map 0:v:0 -c copy -f streamhash -hash sha256 - > before.hash
          ffmpeg -v error -i result.mp4 -map 0:v:0 -c copy -f streamhash -hash sha256 - > after.hash
          diff before.hash after.hash
          python -c "import json; r=json.load(open('result.json')); assert len(r['cues'])==2 and all(c['adaptive_gain']<1 for c in r['cues'])"
