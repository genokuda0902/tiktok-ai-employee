name: cycle998 ghost-free cut synthetic QA
on:
  push:
    branches:
      - 'automation/cycle998-*'
    paths:
      - 'cycle998/**'
      - '.github/workflows/cycle998_ghost_free_qa.yml'
  pull_request:
    paths:
      - 'cycle998/**'
      - '.github/workflows/cycle998_ghost_free_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5'
      - name: Unit tests
        run: python -m unittest discover -s cycle998 -p 'test_*.py' -v
      - name: Render and verify synthetic-only 2-second MP4
        run: python cycle998/ci_synthetic.py
