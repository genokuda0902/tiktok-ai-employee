name: cycle1141 caption island synthetic QA
on:
  push:
    branches: ['quality/cycle1141-caption-island-20261101']
  pull_request:
    paths:
      - 'quality/cycle1141/**'
      - '.github/workflows/cycle1141-caption-island.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v ffprobe
      - name: Ten-genre reusable subtitle-island unit tests
        run: python -m unittest discover -s quality/cycle1141/tests -p 'test_*.py' -v
      - name: Synthetic-only H264 AAC full decode and audio integrity
        run: python quality/cycle1141/code/ci_synthetic.py
