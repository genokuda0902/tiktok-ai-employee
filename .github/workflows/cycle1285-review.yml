name: cycle1285-review-contract
on:
  pull_request:
    paths:
      - 'experiments/cycle1285/**'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s experiments/cycle1285 -p 'test_*.py'
