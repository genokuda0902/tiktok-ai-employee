name: cycle1038 three-shot recap synthetic QA
on:
  push:
    branches:
      - automation/cycle1038-three-shot-recap-20261031
  pull_request:
    paths:
      - 'cycle1038/**'
      - '.github/workflows/cycle1038-recap-qa.yml'
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install free video tools and Japanese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Install image library
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Test ten genre presets and recap safety
        run: python -m unittest discover -s cycle1038/tests -p 'test_*.py' -v
      - name: Synthetic two-second H264 AAC full decode
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x08172c:s=1080x1920:r=30:d=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/cycle1038_synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1038_synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json /tmp/cycle1038_synthetic.mp4
