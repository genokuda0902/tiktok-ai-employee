name: cycle1211-scene-focus-review
on:
  push:
    branches: [quality/cycle1211-scene-focus]
  pull_request:
    paths:
      - 'quality/cycle1211/**'
      - '.github/workflows/cycle1211-scene-focus.yml'
  workflow_dispatch:
jobs:
  tests-and-synthetic-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost runtime dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Install FFmpeg for synthetic media smoke
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run unit tests
        run: python -m unittest discover -s quality/cycle1211/tests -p 'test_*.py' -v
      - name: Synthetic 2-second video render and decode
        run: python quality/cycle1211/tests/ci_smoke.py
