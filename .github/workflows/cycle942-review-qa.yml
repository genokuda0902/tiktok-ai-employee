name: cycle942 review-only cinematic CTA QA
on:
  push:
    branches: ['automation/cycle942-*']
  pull_request:
    paths: ['cycle942/**', '.github/workflows/cycle942-review-qa.yml']
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy pytest
      - name: Test 10 genres, release gate, 3 shots
        run: python -m pytest -q cycle942/tests/test_closing_cta.py
      - name: Block confidential media and publishing code
        run: |
          if find cycle942 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.png' -o -iname '*.jpg' \) | grep -q .; then
            echo 'Private media must not be committed'; exit 1
          fi
          if grep -R -E 'tiktok\.upload|publish_video\(' cycle942/src/; then
            echo 'Posting code forbidden'; exit 1
          fi
