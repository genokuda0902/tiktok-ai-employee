name: cycle948 hook readability QA (review only)
on:
  push:
    branches: ['automation/cycle948-*']
  pull_request:
    paths:
      - 'cycle948/**'
      - '.github/workflows/cycle948-hook-qa.yml'
permissions:
  contents: read
jobs:
  hook-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline QA dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest
      - name: Run fail-closed ten-genre and caption-safety tests
        run: python -m pytest -q cycle948/tests/test_hook_reveal_repair.py
      - name: Block private media, confidential manifests and publishing code
        run: |
          if find cycle948 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*private*' \) | grep -q .; then
            echo 'Private media or manifest cannot be committed'; exit 1
          fi
          if grep -R -Ei 'tiktok.*(upload|publish)|publish_video\(' cycle948/src/; then
            echo 'Posting code forbidden'; exit 1
          fi
