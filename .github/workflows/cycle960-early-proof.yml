name: cycle960 early proof (review only)
on:
  push:
    paths:
      - 'cycle960/**'
      - '.github/workflows/cycle960-early-proof.yml'
  pull_request:
    paths:
      - 'cycle960/**'
      - '.github/workflows/cycle960-early-proof.yml'
  workflow_dispatch:
jobs:
  review-only-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow pytest
      - name: Fail closed if private media entered the PR
        run: |
          if find cycle960 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.png' -o -iname '*.jpg' \) | grep .; then
            echo 'Private media must never be committed'; exit 1
          fi
      - name: Run 19 isolated tests
        run: python -m pytest -q cycle960/test_hook_proof_preview.py
