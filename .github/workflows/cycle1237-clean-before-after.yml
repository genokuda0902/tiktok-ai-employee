name: cycle1237-clean-before-after-review
on:
  push:
    branches: [quality/cycle1237-clean-before-after]
  pull_request:
    paths:
      - 'quality/cycle1237/**'
      - '.github/workflows/cycle1237-clean-before-after.yml'
  workflow_dispatch:
jobs:
  offline-comparison-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg, Noto CJK and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13'
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1237/tests -p 'test_*.py' -v
      - name: Synthetic 36-frame video smoke
        run: python quality/cycle1237/tests/ci_smoke.py
