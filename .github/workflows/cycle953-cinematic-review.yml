name: cycle953 cinematic scene private-review QA
on:
  push:
    paths:
      - 'cycle953/**'
      - '.github/workflows/cycle953-cinematic-review.yml'
  pull_request:
    paths:
      - 'cycle953/**'
      - '.github/workflows/cycle953-cinematic-review.yml'
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline test dependencies
        run: python -m pip install pytest numpy pillow opencv-python-headless
      - name: Install open-source Japanese font for pixel-level tests
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Run 24 synthetic scene and approval-gate tests
        run: python -m pytest -q cycle953/test_cinematic_scene.py
      - name: Fail if any private media or manifest is committed
        run: |
          if git ls-files cycle953 | grep -E '\.(mp4|wav|m4a|png|jpg|jpeg)$|private_manifest\.json'; then
            echo 'Private media/manifest committed; refusing'; exit 1
          fi
          echo 'Only code, tests and documentation present'
