name: cycle1054 three-part prompt synthetic QA
on:
  pull_request:
    paths:
      - 'quality/cycle1054/**'
      - '.github/workflows/cycle1054-prompt-story.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Unit tests for ten genres
        run: python -m unittest discover -s quality/cycle1054/tests -v
      - name: Synthetic H264 AAC render and full decode
        run: python quality/cycle1054/ci_smoke.py
