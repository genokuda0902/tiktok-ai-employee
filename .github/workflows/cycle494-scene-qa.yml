name: Cycle494 scene QA
on:
  pull_request:
    paths:
      - 'quality/cycle494/**'
jobs:
  scene-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python quality/cycle494/scene_contract.py
