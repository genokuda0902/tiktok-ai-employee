name: cycle853-depth-core
on:
  pull_request:
    paths:
      - 'quality/cycle853/**'
      - '.github/workflows/cycle853-depth.yml'
  push:
    branches:
      - 'feat/cycle853-layered-parallax-20261026'
jobs:
  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source-safe two-plane motion core
        run: PYTHONPATH=quality/cycle853 python -m unittest discover -s quality/cycle853 -p 'test_*.py' -v
