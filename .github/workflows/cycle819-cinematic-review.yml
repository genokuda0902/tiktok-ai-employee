name: cycle819 cinematic review synthetic QA
on:
  push:
    branches:
      - 'quality/cycle819-*'
  pull_request:
    branches:
      - 'quality/cycle818-japanese-editorial-20261024'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Test ten genres, scene safety, deterministic motion
        run: PYTHONPATH=quality/cycle819 python -m unittest discover -s quality/cycle819 -p 'test_*.py' -v
      - name: Build synthetic-only video and run real 18-21s overlay
        run: |
          mkdir -p review_output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x071729:s=1080x1920:r=30' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 22 -c:v libx264 -preset ultrafast -crf 38 \
            -pix_fmt yuv420p -c:a aac -b:a 64k \
            review_output/source_SYNTHETIC.mp4
          python quality/cycle819/cinematic_review.py \
            --source review_output/source_SYNTHETIC.mp4 \
            --output review_output/cycle819_SYNTHETIC_NOT_FOR_PUBLICATION.mp4 \
            --genre sales_business --synthetic
          ffmpeg -hide_banner -loglevel error -xerror \
            -i review_output/cycle819_SYNTHETIC_NOT_FOR_PUBLICATION.mp4 -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('review_output/qa819.json').read_text())
          assert x['cycle']==819 and x['genre_count']==10
          assert x['width']==1080 and x['height']==1920 and x['fps']=='30/1'
          assert x['insert_frames']==90 and x['synthetic_source'] is True
          assert x['japanese_speech_semantic_alignment_verified'] is False
          assert x['publication_approved'] is False and x['auto_post'] is False
          print('PASS: synthetic video decoded; Japanese voice NOT tested')
          PY
      - name: Upload review-only synthetic MP4
        uses: actions/upload-artifact@v4
        with:
          name: cycle819-SYNTHETIC-NOT-FOR-PUBLICATION
          path: |
            review_output/cycle819_SYNTHETIC_NOT_FOR_PUBLICATION.mp4
            review_output/qa819.json
          if-no-files-found: error
          retention-days: 7
