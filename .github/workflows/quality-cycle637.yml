name: Quality cycle637 offline tests
on:
  pull_request:
    paths:
      - 'quality/cycle637/**'
      - '.github/workflows/quality-cycle637.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run safe zone tests
        working-directory: quality/cycle637
        run: python -m unittest -v test_safe_layout.py
