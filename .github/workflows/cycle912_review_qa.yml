name: cycle912 review-only repetition calendar QA
on:
  push:
    branches:
      - automation/cycle912-repetition-calendar-20261028
    paths:
      - 'review_cycles/cycle912/**'
      - '.github/workflows/cycle912_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle912/**'
      - '.github/workflows/cycle912_review_qa.yml'
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile renderer
        run: python -m py_compile review_cycles/cycle912/repetition_calendar.py
      - name: Run dependency-free safety tests
        run: python -m unittest discover -s review_cycles/cycle912 -p 'test_cycle912_policy.py' -v
      - name: Ensure private audio/video are absent
        run: |
          ! find review_cycles/cycle912 -type f \( -name '*.mp4' -o -name '*.wav' -o -name '*.aac' -o -name '*.m4a' \) | grep .
      - name: Publication gate remains closed
        run: echo 'HUMAN_REVIEW / PUBLICATION_NOT_APPROVED'
