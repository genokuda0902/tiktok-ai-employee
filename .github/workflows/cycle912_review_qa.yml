name: cycle912 offline review-only magnifier QA
on:
  push:
    paths:
      - 'review_cycles/cycle912/**'
      - '.github/workflows/cycle912_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle912/**'
      - '.github/workflows/cycle912_review_qa.yml'
  workflow_dispatch:
jobs:
  review-only-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Offline stdlib policy and geometry tests
        run: python3 -m unittest discover -s review_cycles/cycle912 -p 'test_cycle912.py' -v
      - name: Prevent confidential media and generated output in public source
        run: |
          if find review_cycles/cycle912 -type f \( -iname '*.mp4' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.wav' -o -iname '*.xlsx' \) | grep -q .; then
            echo 'Private media must not be committed' >&2
            exit 1
          fi
