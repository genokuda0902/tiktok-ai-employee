name: cycle1608 review render
on:
  pull_request:
    paths:
      - 'quality/cycle1608/**'
      - '.github/workflows/cycle1608-review.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s quality/cycle1608 -p 'test_*.py'
      - run: python quality/cycle1608/render.py --out cycle1608_REVIEW_ONLY.mp4
      - run: ffmpeg -v error -i cycle1608_REVIEW_ONLY.mp4 -f null -
      - run: ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -of json cycle1608_REVIEW_ONLY.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cycle1608-review-only
          path: cycle1608_REVIEW_ONLY.mp4
          retention-days: 7
