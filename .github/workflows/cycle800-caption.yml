name: cycle800 Japanese subtitle readability CI
on:
  pull_request:
    paths:
      - 'quality/cycle800/**'
      - '.github/workflows/cycle800-caption.yml'
  workflow_dispatch:
jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local zero-cost rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless imageio-ffmpeg
          python - <<'PY'
          import imageio_ffmpeg,os
          os.symlink(imageio_ffmpeg.get_ffmpeg_exe(),'/tmp/ffmpeg')
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write('/tmp\n')
          PY
      - name: Validate 10-genre Japanese subtitle renderer
        run: cd quality/cycle800 && python -m unittest -v test_caption_rebuild.py
      - name: Generate synthetic 429-frame input (electronic tone, NOT Japanese)
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x103047:s=1080x1920:r=30:d=14.3 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=14.3 -frames:v 429 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/cycle800_source_SYNTHETIC.mp4
      - name: End-to-end render and decode
        run: |
          python quality/cycle800/caption_rebuild.py --source /tmp/cycle800_source_SYNTHETIC.mp4 --output /tmp/cycle800_CI_SYNTHETIC_NOT_JAPANESE.mp4 --captions quality/cycle800/captions_science_review.json --genre science
          ffmpeg -v error -xerror -i /tmp/cycle800_CI_SYNTHETIC_NOT_JAPANESE.mp4 -f null -
          test -s /tmp/cycle800_CI_SYNTHETIC_NOT_JAPANESE.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cycle800-synthetic-tone-not-japanese
          path: /tmp/cycle800_CI_SYNTHETIC_NOT_JAPANESE.mp4
          retention-days: 7
