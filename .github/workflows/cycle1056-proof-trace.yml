name: cycle1056 fictional proof trace QA
on:
  push:
    branches:
      - 'quality/cycle1056-fictional-proof-trace-20261031'
    paths:
      - 'quality/cycle1056/**'
      - '.github/workflows/cycle1056-proof-trace.yml'
  pull_request:
    paths:
      - 'quality/cycle1056/**'
      - '.github/workflows/cycle1056-proof-trace.yml'
  workflow_dispatch:
jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Test arithmetic and ten genres
        run: python -m unittest discover -s quality/cycle1056/tests -v
      - name: Synthetic H264 AAC encode and full decode
        run: python quality/cycle1056/ci_smoke.py
