name: cycle1564 audio readiness tests
on:
  pull_request:
    paths:
      - 'quality/cycle1564/**'
      - '.github/workflows/cycle1564-audio-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s quality/cycle1564 -p 'test_*.py' -v
