name: cycle894 Before-After review-only QA

on:
  push:
    paths:
      - 'quality/cycle894/**'
      - '.github/workflows/cycle894-before-after-qa.yml'
  pull_request:
    paths:
      - 'quality/cycle894/**'
      - '.github/workflows/cycle894-before-after-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          python -m pip install --disable-pip-version-check Pillow
      - name: Run 12 offline unit tests
        run: |
          cd quality/cycle894
          python -m unittest -v test_before_after_comparison.py
      - name: Verify synthetic 2-second H264 AAC encode and full decode
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=360x640:rate=30:duration=2 -f lavfi -i sine=frequency=500:sample_rate=48000:duration=2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 /tmp/cycle894-synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle894-synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/cycle894-synthetic.mp4
      - name: Verify release policy stays closed
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'quality/cycle894')
          from before_after_comparison import POLICY
          assert POLICY['review_only'] is True
          assert POLICY['publication_approved'] is False
          assert POLICY['external_upload'] is False
          assert POLICY['automatic_posting'] is False
          assert POLICY['source_rights_reviewed'] is False
          assert POLICY['time_saving_measured'] is False
          print('HUMAN_REVIEW / PUBLICATION_NOT_APPROVED')
          PY
