name: cycle948 offline document clarity QA
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle948/**'
      - '.github/workflows/cycle948-document-clarity.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test 10 genres and safe crop
        run: python -m pytest -q quality_cycles/cycle948/tests/test_document_clarity.py
      - name: Check no publish/upload API
        run: |
          ! grep -Ein 'requests\.post|tiktok.*(upload|publish)|auto.?post' quality_cycles/cycle948/document_clarity.py
