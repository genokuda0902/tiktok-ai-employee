name: cycle835 image slide unit tests
on:
  pull_request:
    paths:
      - "automation/cycle835/**"
      - ".github/workflows/cycle835-review.yml"
  workflow_dispatch:
jobs:
  local-asset-independent-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free dependencies and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow pytest
      - name: Run renderer unit tests (no MP4 artifact)
        working-directory: automation/cycle835
        run: python -m pytest -q test_cycle835.py
