name: Cycle733 CTA quality tests
on:
  push:
    branches: [quality/cycle733-japanese-cta-20261021]
    paths:
      - 'video_engine/cycle733/**'
      - '.github/workflows/cycle733-qa.yml'
  pull_request:
    paths:
      - 'video_engine/cycle733/**'
      - '.github/workflows/cycle733-qa.yml'
  workflow_dispatch:
jobs:
  cta-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow
      - name: Check CTA and artwork
        run: python -m unittest discover -s video_engine/cycle733 -p 'test_*.py' -v
