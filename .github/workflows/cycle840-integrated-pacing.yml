name: cycle840 integrated pacing review-only
on:
  pull_request:
    paths:
      - 'cycle840/**'
      - '.github/workflows/cycle840-integrated-pacing.yml'
  workflow_dispatch:
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax and ten-genre QA gates
        run: |
          python3 -m compileall -q cycle839/pacing.py cycle840/
          PYTHONPATH=. python3 -m unittest discover -s cycle840 -p 'test_*.py' -v
      - name: Synthetic audiovisual integration (not a Japanese review video)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bash cycle839/ci_synthetic.sh
