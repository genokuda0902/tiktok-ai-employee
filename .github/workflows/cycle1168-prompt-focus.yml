name: cycle1168-prompt-reading-focus-review
on:
  push:
    branches: [quality/cycle1168-prompt-reading-focus]
  pull_request:
    paths:
      - 'quality/cycle1168/**'
      - '.github/workflows/cycle1168-prompt-focus.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        env:
          PYTHONPATH: quality/cycle1168
        run: python -m unittest discover -s quality/cycle1168/tests -p 'test_*.py' -v
      - name: Synthetic-only MP4 and AAC QA
        env:
          PYTHONPATH: quality/cycle1168
        run: python quality/cycle1168/tests/ci_smoke.py
