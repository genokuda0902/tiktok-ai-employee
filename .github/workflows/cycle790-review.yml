name: cycle790 opaque-wipe review-only CI
on:
  push:
    branches:
      - 'quality/cycle790-*'
    paths:
      - 'quality/cycle790/**'
      - '.github/workflows/cycle790-review.yml'
  pull_request:
    paths:
      - 'quality/cycle790/**'
      - '.github/workflows/cycle790-review.yml'
permissions:
  contents: read
jobs:
  opaque-wipe-tests-and-synthetic-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free wheels only (no apt or speech engine)
        run: python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Provide bundled FFmpeg and narrow FFprobe metadata adapter
        run: |
          python - <<'PY'
          import imageio_ffmpeg, os
          from pathlib import Path
          d=Path('/tmp/cycle790-tools');d.mkdir(exist_ok=True)
          (d/'ffmpeg').symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          shim=d/'ffprobe'
          shim.write_text('#!/bin/sh\nexec python "$GITHUB_WORKSPACE/quality/cycle790/ffprobe_shim.py" "$@"\n')
          shim.chmod(0o755)
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(d)+'\n')
          PY
      - name: Unit tests for opaque wipe and review-only gates
        run: python -m unittest discover -s quality/cycle790 -p 'test_*.py' -v
      - name: Build 3-second synthetic-tone source (NOT Japanese production video)
        run: python quality/cycle789/ci_fixture.py --output review_output/cycle790/base.mp4
      - name: Exercise real opaque-wipe renderer on synthetic source
        run: python quality/cycle790/ci_smoke.py --input review_output/cycle790/base.mp4 --output review_output/cycle790/cycle790_SYNTHETIC_TONE_ONLY.mp4
      - name: Validate synthetic fixture codecs and full decode
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 review_output/cycle790/cycle790_SYNTHETIC_TONE_ONLY.mp4 | grep -Fx '1080,1920,30/1'
          ffmpeg -v error -xerror -i review_output/cycle790/cycle790_SYNTHETIC_TONE_ONLY.mp4 -f null -
      - name: Upload review-only synthetic fixture (NOT full user video)
        uses: actions/upload-artifact@v4
        with:
          name: cycle790-synthetic-tone-not-full-video
          path: |
            review_output/cycle790/cycle790_SYNTHETIC_TONE_ONLY.mp4
            review_output/cycle790/cycle790_SYNTHETIC_TONE_ONLY.json
          retention-days: 7
          if-no-files-found: error
