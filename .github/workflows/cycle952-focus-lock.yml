name: cycle952 scene focus / review only
on:
  push:
    paths:
      - 'cycle952/**'
      - '.github/workflows/cycle952-focus-lock.yml'
  pull_request:
    paths:
      - 'cycle952/**'
      - '.github/workflows/cycle952-focus-lock.yml'
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source dependencies
        run: python -m pip install pytest numpy opencv-python-headless
      - name: Run 19 fail-closed tests (synthetic frames only)
        run: python -m pytest -q cycle952/tests/test_scene_focus_lock.py
      - name: Ensure no private MP4 or confidential source committed
        run: |
          if git ls-files cycle952 | grep -E '\.(mp4|wav|m4a|png|jpg)$'; then
            echo 'Private media committed; refusing'; exit 1
          fi
          echo 'No media in code branch'
