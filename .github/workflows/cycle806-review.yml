name: cycle806 speech-safe pacing review (not approved)
on:
  push:
    branches: ['quality/cycle806-*']
    paths:
      - 'quality/cycle806/**'
      - '.github/workflows/cycle806-review.yml'
  pull_request:
    paths:
      - 'quality/cycle806/**'
      - '.github/workflows/cycle806-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-and-render-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free FFmpeg + FFprobe environment
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/cycle806-bin"
          ln -s "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/cycle806-bin/ffmpeg"
          echo "$RUNNER_TEMP/cycle806-bin" >> "$GITHUB_PATH"
          if ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffprobe
      - name: Test pacing and ten-genre contract
        run: python -m unittest discover -s quality/cycle806 -p 'test_*.py' -v
      - name: Retrieve existing review-only MP4 and matching narration manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/cycle806-input" "$RUNNER_TEMP/cycle806-timing"
          gh run download 40048007154 --repo genokuda0902/tiktok-ai-employee --name cycle805-NEW-JAPANESE-VOICE-REVIEW-ONLY-NOT-APPROVED --dir "$RUNNER_TEMP/cycle806-input"
          gh run download 40047591409 --repo genokuda0902/tiktok-ai-employee --name cycle804-business-japanese-voice-review --dir "$RUNNER_TEMP/cycle806-timing"
          find "$RUNNER_TEMP/cycle806-input" -type f
          test -s "$RUNNER_TEMP/cycle806-timing/voice_timing.json"
          test -s "$RUNNER_TEMP/cycle806-input/cycle805_BUSINESS_NEW_VOICE_REVIEW_ONLY.mp4"
          echo "CYCLE806_INPUT=$RUNNER_TEMP/cycle806-input/cycle805_BUSINESS_NEW_VOICE_REVIEW_ONLY.mp4" >> "$GITHUB_ENV"
          echo "CYCLE806_TIMING=$RUNNER_TEMP/cycle806-timing/voice_timing.json" >> "$GITHUB_ENV"
      - name: Render full Japanese-narrated review MP4 with shorter dead air
        run: |
          set -euxo pipefail
          python quality/cycle806/tighten_pacing.py --source "$CYCLE806_INPUT" --timing "$CYCLE806_TIMING" --output review_output/cycle806_BUSINESS_PACING_REVIEW_ONLY.mp4
          ffmpeg -v error -xerror -i review_output/cycle806_BUSINESS_PACING_REVIEW_ONLY.mp4 -f null -
          test -s review_output/qa.json
      - name: Upload private review-only artifact (not for posting)
        uses: actions/upload-artifact@v4
        with:
          name: cycle806-JAPANESE-PACING-REVIEW-ONLY-NOT-APPROVED
          path: |
            review_output/cycle806_BUSINESS_PACING_REVIEW_ONLY.mp4
            review_output/qa.json
          retention-days: 7
