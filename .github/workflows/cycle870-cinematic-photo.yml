name: cycle870 cinematic photo insert ten-genre QA
on:
  push:
    branches: [automation/cycle870-cinematic-generated-photo-20261026]
    paths:
      - 'cycle870/**'
      - '.github/workflows/cycle870-cinematic-photo.yml'
  pull_request:
    paths:
      - 'cycle870/**'
      - '.github/workflows/cycle870-cinematic-photo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Validate all ten genres and review-only gates
        run: PYTHONPATH=cycle870 python -m unittest discover -s cycle870 -p 'test_*.py' -v
      - name: Synthetic H264 AAC encode and full decode (not private MP4)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x071e34:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle870_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle870_synthetic.mp4 -f null -
