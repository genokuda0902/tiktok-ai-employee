name: cycle933 scene clarity QA
on:
  pull_request:
    paths:
      - 'cycle933/**'
      - '.github/workflows/cycle933-scene-clarity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-scene-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Run ten-genre safe-area unit tests
        run: python -m unittest discover -s cycle933/tests -v
      - name: Confirm no publishing commands
        run: |
          ! grep -R -Ei 'tiktok.*upload|auto.?post|requests.post\(' cycle933/src cycle933/tests
