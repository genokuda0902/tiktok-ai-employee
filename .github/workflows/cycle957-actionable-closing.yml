name: cycle957 actionable closing synthetic QA
on:
  push:
    paths:
      - 'cycle957/**'
      - '.github/workflows/cycle957-actionable-closing.yml'
  pull_request:
    paths:
      - 'cycle957/**'
      - '.github/workflows/cycle957-actionable-closing.yml'
permissions:
  contents: read
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy<3' pillow opencv-python-headless pytest
      - name: Install Noto CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Run 17 synthetic tests
        run: python -m pytest -q cycle957/test_closing_actions.py
      - name: Reject private media in public repository
        run: |
          if git ls-files cycle957 | grep -E '\.(mp4|m4a|wav|png|jpg|jpeg)$|private_manifest'; then
            echo 'Private media in repository: rejected'; exit 1
          fi
          echo 'Source and tests only'
