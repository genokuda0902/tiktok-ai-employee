name: cycle902 storyboard review-only QA
on:
  pull_request:
    paths:
      - 'experiments/cycle902/**'
      - '.github/workflows/cycle902-storyboard-qa.yml'
  workflow_dispatch:
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          python -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Unit tests and 10-genre policies
        run: python -m unittest discover -s experiments/cycle902 -p 'test_*.py' -v
      - name: Render three synthetic Japanese panels
        run: |
          python experiments/cycle902/task_storyboard.py /tmp/cycle902-panels --genre ai
          test "$(find /tmp/cycle902-panels -name 'stage_*.png' | wc -l)" -eq 3
      - name: Synthetic A/V render and full decode
        run: |
          ffmpeg -v error -y -f lavfi -i "color=c=0x0A2040:s=1080x1920:r=30:d=6" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=6" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle902-synthetic.mp4
          bash experiments/cycle902/render.sh /tmp/cycle902-synthetic.mp4 /tmp/cycle902-synthetic-out.mp4 /tmp/cycle902-panels
          ffmpeg -v error -xerror -i /tmp/cycle902-synthetic-out.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 /tmp/cycle902-synthetic-out.mp4 | grep -q '1080,1920,30/1'
