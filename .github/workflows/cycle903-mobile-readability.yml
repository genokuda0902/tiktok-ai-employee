name: cycle903-mobile-readability
on:
  pull_request:
    paths:
      - 'automation/cycle903/**'
      - '.github/workflows/cycle903-mobile-readability.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 10 genre configurations and review safety
        run: python -m unittest discover -s automation/cycle903 -p 'test_*.py' -v
