name: cycle533 proof hook regression
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle533/**'
      - '.github/workflows/quality-cycle533.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-cost contract tests
        working-directory: quality_cycles/cycle533
        run: python -m unittest discover -p 'test_*.py' -v
