name: cycle1060 Writer text-safe QA
on:
  push:
    branches:
      - 'quality/cycle1060-writer-text-safe-20261031'
    paths:
      - 'quality/cycle1060/**'
      - '.github/workflows/cycle1060-safe-writer.yml'
  pull_request:
    paths:
      - 'quality/cycle1060/**'
      - '.github/workflows/cycle1060-safe-writer.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline free QA dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Text-safe unit tests (10 genres)
        run: python -m unittest quality.cycle1060.test_safe_focus -v
      - name: Synthetic H264/AAC smoke (not the private MP4)
        run: python quality/cycle1060/safe_focus.py --smoke
