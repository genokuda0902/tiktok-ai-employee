name: cycle1322-review
on:
  pull_request:
    paths:
      - 'quality/cycle1322/**'
      - '.github/workflows/cycle1322-review.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s quality/cycle1322 -p 'test_*.py'
