name: cycle851 real Calc correction review-only CI
on:
  push:
    branches:
      - 'automation/cycle851-*'
  pull_request:
    paths:
      - 'cycle851/**'
      - '.github/workflows/cycle851-real-calc-correction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5' 'Pillow>=10,<12'
      - name: Unit tests and syntax
        run: |
          python -m compileall -q cycle851
          PYTHONPATH=cycle851 python -m unittest discover -s cycle851 -p 'test_*.py' -v
      - name: Synthetic-only MP4 generation and AAC copy verification
        run: |
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1080x1920:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -c:a aac -shortest /tmp/c851_src.mp4
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1440x900:r=30:d=2 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p /tmp/c851_capture.mp4
          PYTHONPATH=cycle851 python - <<'PY'
          from pathlib import Path
          from real_calc_correction import render, sha256, POLICY
          s=Path('/tmp/c851_src.mp4');c=Path('/tmp/c851_capture.mp4');o=Path('/tmp/c851_out.mp4')
          r=render(s,c,o,{**POLICY,'source_sha256':sha256(s),'capture_sha256':sha256(c)},'ai_work',(10,50))
          assert r['frames']==60 and r['edited_frames']==40
          assert r['full_av_decode'] and not r['publication_approved']
          print('SYNTHETIC_REAL_CALC_CORRECTION_PASS',r['output_sha256'])
          PY
          ffmpeg -v error -y -i /tmp/c851_src.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c851_before.aac
          ffmpeg -v error -y -i /tmp/c851_out.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c851_after.aac
          cmp /tmp/c851_before.aac /tmp/c851_after.aac