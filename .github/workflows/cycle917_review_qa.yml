name: cycle917 prompt template review-only QA
on:
  push:
    paths:
      - 'review_cycles/cycle917/**'
      - '.github/workflows/cycle917_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle917/**'
      - '.github/workflows/cycle917_review_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 10 genres, safe zone, review-only policy
        run: python3 -m unittest discover -s review_cycles/cycle917 -p 'test_policy.py' -v
      - name: Reject private media and secrets
        run: |
          if find review_cycles/cycle917 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.png' -o -iname '*.jpg' \) | grep -q .; then
            echo "Private media must not enter public repository" >&2
            exit 1
          fi
