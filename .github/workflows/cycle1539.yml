name: cycle1539 caption contract
on:
  pull_request:
    paths:
      - 'experiments/cycle1539/**'
      - '.github/workflows/cycle1539.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd experiments/cycle1539 && python -m unittest discover -v
