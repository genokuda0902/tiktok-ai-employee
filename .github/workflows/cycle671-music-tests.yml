name: Cycle671 original music tests
on:
  push:
    branches:
      - 'quality/cycle671-*'
    paths:
      - 'quality/cycle671/**'
      - 'tests/test_cycle671_music.py'
      - '.github/workflows/cycle671-music-tests.yml'
  pull_request:
    paths:
      - 'quality/cycle671/**'
      - 'tests/test_cycle671_music.py'
      - '.github/workflows/cycle671-music-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  music-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: python -m pip install numpy scipy
      - name: Test all 10 genre presets
        run: python -m unittest discover -s tests -p 'test_cycle671_music.py' -v
