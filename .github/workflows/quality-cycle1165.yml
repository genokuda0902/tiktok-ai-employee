name: Quality cycle1165 chapter-divider sweep (synthetic)
on:
  pull_request:
    paths:
      - 'quality/cycle1165/**'
      - '.github/workflows/quality-cycle1165.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install zero-cost test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy pillow
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1165/tests -p 'test_*.py' -v
      - name: Generate synthetic H264/AAC test video (no private media)
        run: |
          mkdir -p /tmp/cycle1165
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x081e2b:s=1080x1920:r=30:d=22.5' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=22.5' \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k -frames:v 675 -t 22.5 /tmp/cycle1165/input.mp4
      - name: Render synthetic transition effect
        run: |
          python quality/cycle1165/code/scene_transition_sweep.py \
            --source /tmp/cycle1165/input.mp4 \
            --output /tmp/cycle1165/output.mp4 \
            --workdir /tmp/cycle1165/work --preset ultrafast
      - name: Verify synthetic full decode and exact frame count
        run: |
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nw=1:nk=1 /tmp/cycle1165/output.mp4)" = 675
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x /tmp/cycle1165/output.mp4)" = '1080x1920'
          ffmpeg -v error -xerror -i /tmp/cycle1165/output.mp4 -map 0:v:0 -f null - -map 0:a:0 -f null -
          echo 'Synthetic A/V PASS; actual Japanese review MP4 is not uploaded'
