name: cycle882 Chromium DOM proof safety (no private assets)
on:
  push:
    branches:
      - feature/cycle882-chromium-dom-proof
    paths:
      - 'video_engine/cycle882/**'
      - '.github/workflows/cycle882-browser-proof-tests.yml'
  pull_request:
    paths:
      - 'video_engine/cycle882/**'
      - '.github/workflows/cycle882-browser-proof-tests.yml'
  workflow_dispatch:
jobs:
  safe-browser-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test frame-exact 10-genre layout and local-only policy
        run: PYTHONPATH=video_engine/cycle882 python3 -m unittest discover -s video_engine/cycle882 -p 'test_*.py' -v
      - name: Synthetic H264 AAC smoke test (NOT private final MP4)
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=1080x1920:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -c:v libx264 -threads 2 -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle882_synthetic_ci.mp4
          python3 - <<'PY'
          import json, subprocess
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json','/tmp/cycle882_synthetic_ci.mp4']))
          v=next(s for s in info['streams'] if s['codec_type']=='video')
          a=next(s for s in info['streams'] if s['codec_type']=='audio')
          assert (v['width'],v['height'])==(1080,1920) and v['codec_name']=='h264'
          assert a['codec_name']=='aac' and a['sample_rate']=='48000'
          print('Synthetic-only CI smoke passed. This is NOT the reviewed Japanese MP4.')
          PY
