name: cycle1604 quality checks
on:
  pull_request:
    paths:
      - 'quality/cycle1604_preflight.py'
      - 'quality/test_cycle1604_preflight.py'
      - '.github/workflows/cycle1604-quality.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s quality -p 'test_cycle1604_preflight.py' -v
