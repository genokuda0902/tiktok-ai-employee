name: cycle969 story focus review-only synthetic CI
on:
  push:
    branches:
      - feature/cycle969-story-focus-review
  pull_request:
    paths:
      - 'cycle969/**'
      - '.github/workflows/cycle969-story-focus.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3-pil
      - name: Unit tests
        run: python3 -m unittest discover -s cycle969/tests -v
      - name: Synthetic MP4 render only (no private assets)
        run: |
          mkdir -p /tmp/cycle969
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x081b32:s=1080x1920:r=30:d=3' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle969/synthetic.mp4
          python3 cycle969/code/story_focus.py /tmp/cycle969/synthetic.mp4 /tmp/cycle969/render.mp4 /tmp/cycle969/render.json --synthetic
          ffmpeg -v error -i /tmp/cycle969/render.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=nw=1 /tmp/cycle969/render.mp4
      - name: Upload synthetic QA only
        uses: actions/upload-artifact@v4
        with:
          name: cycle969-synthetic-qa-only
          path: /tmp/cycle969/render.json
          retention-days: 7
