name: Cycle1225 review unit tests
on:
  push:
    branches: [quality/cycle1225-checkpoint-rail]
  pull_request:
    paths:
      - 'src/review_checkpoint_rail.py'
      - 'tests/test_review_checkpoint_rail.py'
      - '.github/workflows/cycle1225-review-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_review_checkpoint_rail.py' -v
