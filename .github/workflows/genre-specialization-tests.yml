name: Genre specialization isolated tests
on:
  pull_request:
    paths:
      - 'config/genre_profiles.v1.json'
      - 'src/genre_profiles.py'
      - 'src/genre_scene_planner.py'
      - 'src/genre_video_renderer.py'
      - 'src/review_ui_assets.py'
      - 'tests/test_genre_profiles.py'
      - 'tests/test_genre_scene_planner.py'
      - 'tests/test_genre_video_renderer.py'
      - 'tests/test_review_ui_assets.py'
      - '.github/workflows/genre-specialization-tests.yml'
  push:
    branches: [feature/genre-specialization-v1-20260921]
permissions:
  contents: read
jobs:
  genre-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-budget media and Japanese TTS runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          ffmpeg -version | head -1
          ffprobe -version | head -1
          open_jtalk -h 2>&1 | head -2 || true
      - name: Run genre and UI fixture tests without credentials or publishing
        run: |
          python -m unittest discover -s tests -p 'test_genre*.py' -v
          python -m unittest -v tests.test_review_ui_assets
      - name: Create deterministic structured review UI images
        run: |
          set -euxo pipefail
          mkdir -p review_assets review_output
          PYTHONPATH=src python - <<'PY'
          from review_ui_assets import make_sanitized_ui_frame
          beats=['result','problem','demonstration','conditions','takeaway']
          for i, beat in enumerate(beats):
              make_sanitized_ui_frame(f'review_assets/{beat}.png', i)
          PY
          file review_assets/*.png
      - name: Create zero-budget Japanese review narration
        run: |
          set -euxo pipefail
          VOICE=$(dpkg -L hts-voice-nitech-jp-atr503-m001 | grep '\.htsvoice$' | head -1)
          SYS_DIC=$(dpkg -L open-jtalk-mecab-naist-jdic | grep '/sys.dic$' | head -1)
          DIC=$(dirname "$SYS_DIC")
          test -f "$VOICE"
          test -f "$SYS_DIC"
          printf '%s\n' '結論を先に見せます。' > review_assets/result.txt
          printf '%s\n' 'その作業、まだ手入力ですか。' > review_assets/problem.txt
          printf '%s\n' '三つのステップで時短します。' > review_assets/demonstration.txt
          printf '%s\n' '条件を確認して使います。' > review_assets/conditions.txt
          printf '%s\n' '保存して、あとで試してください。' > review_assets/takeaway.txt
          for beat in result problem demonstration conditions takeaway; do
            open_jtalk -x "$DIC" -m "$VOICE" -ow review_assets/${beat}_mono.wav review_assets/${beat}.txt
            ffmpeg -hide_banner -loglevel error -y -i review_assets/${beat}_mono.wav -ar 48000 -ac 2 review_assets/${beat}.wav
          done
      - name: Create review manifest
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          beats=['result','problem','demonstration','conditions','takeaway']
          captions=['結論を先に見せる','その作業、まだ手入力？','3ステップで時短','条件を確認して使う','保存してあとで試す']
          narrations=['結論を先に見せます。','その作業、まだ手入力ですか。','三つのステップで時短します。','条件を確認して使います。','保存して、あとで試してください。']
          scenes=[{'index':i,'beat':beat,'asset_id':'ci-sanitized-ui-'+beat,'visual_kind':'approved_demo','asset_approved':True,'audio_approved':True,'narration':narration,'caption':caption,'duration_seconds':4,'image_path':beat+'.png','audio_path':beat+'.wav'} for i,(beat,caption,narration) in enumerate(zip(beats,captions,narrations))]
          manifest={'schema_version':1,'status':'draft_review_only','genre_id':'ai_productivity','genre_label':'AI・業務時短','topic':'ゼロ予算動画品質改善','hook_strategy':'show_concrete_before_after','scenes':scenes,'qa_requirements':['no_confidential_screen','no_unverified_time_saved'],'primary_metric':'follows_per_1000_views','evidence':[],'quality_approved':False,'delivery_approved':False,'publish_mode':'employee_manual_only','render_ready':False}
          Path('review_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Render review MP4
        run: |
          set -euxo pipefail
          PYTHONPATH=src python - <<'PY'
          from genre_video_renderer import render_review_video
          print(render_review_video('review_manifest.json','review_assets','review_output/ai_productivity_review.mp4'))
          PY
      - name: Validate review MP4
        run: |
          set -euxo pipefail
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration -of default=nw=1 review_output/ai_productivity_review.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,duration -of default=nw=1 review_output/ai_productivity_review.mp4
          ffmpeg -v error -i review_output/ai_productivity_review.mp4 -f null -
          sha256sum review_output/ai_productivity_review.mp4 | tee review_output/ai_productivity_review.mp4.sha256
          test -s review_output/ai_productivity_review.mp4
      - name: Upload review MP4 artifact
        id: upload_review_mp4
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zero-budget-ai-productivity-review
          path: |
            review_output/ai_productivity_review.mp4
            review_output/ai_productivity_review.mp4.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Report artifact upload fallback
        if: steps.upload_review_mp4.outcome == 'failure'
        run: |
          echo 'Artifact upload failed after MP4 validation. The validated MP4 existed on the runner, but GitHub artifact storage did not accept it.'
          echo 'Keeping CI green for render/validation while external sharing is handled separately; do not claim a GitHub artifact exists.'
          cat review_output/ai_productivity_review.mp4.sha256
