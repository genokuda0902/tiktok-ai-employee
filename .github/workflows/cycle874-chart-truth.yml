name: cycle874 data-consistent chart (review only)
on:
  push:
    branches: [automation/cycle874-chart-truth-20261027]
    paths:
      - 'cycle874/**'
      - '.github/workflows/cycle874-chart-truth.yml'
  pull_request:
    paths:
      - 'cycle874/**'
      - '.github/workflows/cycle874-chart-truth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-chart-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Run chart-data and 10-genre tests
        run: PYTHONPATH=cycle874 python -m unittest discover -s cycle874 -p 'test_*.py' -v
      - name: Synthetic 1s H264/AAC decode (not Japanese private media)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x123456:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle874_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle874_synthetic.mp4 -f null -
