name: cycle813-cinematic-motion-qa
on:
  pull_request:
    paths:
      - 'quality/cycle813/**'
      - '.github/workflows/cycle813-cinematic-motion.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Run synthetic 1080x1920 MP4 and AAC integrity tests
        run: python quality/cycle813/test_motion_filter.py -v
