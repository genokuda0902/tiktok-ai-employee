name: cycle836 photo-first layout tests
on:
  push:
    branches: [cycle836-photo-first-layout]
  pull_request:
    paths:
      - 'experiments/cycle836/**'
      - '.github/workflows/cycle836-photo-first.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s experiments/cycle836 -p 'test_*.py' -v
