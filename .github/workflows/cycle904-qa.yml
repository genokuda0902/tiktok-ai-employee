name: cycle904 review-only microcamera and audio-signal QA
on:
  push:
    paths:
      - "cycle904/**"
      - ".github/workflows/cycle904-qa.yml"
  pull_request:
    paths:
      - "cycle904/**"
      - ".github/workflows/cycle904-qa.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
          python - <<'PY'
          import imageio_ffmpeg, pathlib, os
          d=pathlib.Path.home()/'.local'/'bin'
          d.mkdir(parents=True,exist_ok=True)
          (d/'ffmpeg').symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ['GITHUB_PATH'],'a') as f: f.write(str(d)+'\n')
          PY
      - name: Verify syntax and 14 fail-closed tests
        run: |
          python -m py_compile cycle904/cinematic_motion_audit.py cycle904/test_cinematic_motion_audit.py
          python -m unittest discover -s cycle904 -p 'test_*.py' -v
      - name: Review-only release gate
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'cycle904')
          from cinematic_motion_audit import release_gate
          try:
              release_gate({'employee_approval':True})
          except PermissionError as e:
              assert 'PUBLICATION_NOT_APPROVED' in str(e)
          else:
              raise SystemExit('Unsafe publication gate')
          print('PASS: no publication without independent ASR, rights, employee approval, device playback')
          PY
