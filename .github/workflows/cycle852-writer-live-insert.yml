name: cycle852 Writer live insert review-only CI
on:
  push:
    branches:
      - 'automation/cycle852-*'
  pull_request:
    paths:
      - 'cycle852/**'
      - '.github/workflows/cycle852-writer-live-insert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5' 'Pillow>=10,<12'
      - name: Tests
        run: |
          python -m compileall -q cycle852
          PYTHONPATH=cycle852 python -m unittest discover -s cycle852 -p 'test_*.py' -v
      - name: Synthetic MP4 render and unchanged AAC verification
        run: |
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1080x1920:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -c:a aac -shortest /tmp/c852_src.mp4
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1440x900:r=30:d=2 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p /tmp/c852_cap.mp4
          PYTHONPATH=cycle852 python - <<'PY'
          from pathlib import Path
          from writer_live_insert import render,sha256,POLICY
          s=Path('/tmp/c852_src.mp4');c=Path('/tmp/c852_cap.mp4');o=Path('/tmp/c852_out.mp4')
          r=render(s,c,o,{**POLICY,'source_sha256':sha256(s),'capture_sha256':sha256(c)},'ai_work',(10,50))
          assert r['frames']==60 and r['edited_frames']==40 and r['full_av_decode']
          assert not r['publication_approved']
          print('CYCLE852_SYNTHETIC_RENDER_PASS',r['output_sha256'])
          PY
          ffmpeg -v error -y -i /tmp/c852_src.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c852_before.aac
          ffmpeg -v error -y -i /tmp/c852_out.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c852_after.aac
          cmp /tmp/c852_before.aac /tmp/c852_after.aac