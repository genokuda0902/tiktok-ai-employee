name: cycle992 prompt focus synthetic QA
on:
  push:
    branches:
      - 'automation/cycle992-*'
    paths:
      - 'cycle992/**'
      - '.github/workflows/cycle992_prompt_focus_qa.yml'
  pull_request:
    paths:
      - 'cycle992/**'
      - '.github/workflows/cycle992_prompt_focus_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-focus-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        run: PYTHONPATH=cycle992 python -m unittest discover -s cycle992 -p 'test_*.py' -v
      - name: Generate synthetic-only portrait MP4 with sound and Japanese subtitle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle992
          printf '1\n00:00:00,000 --> 00:00:03,000\n合成字幕\n' > /tmp/cycle992/synthetic.srt
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=navy:s=1080x1920:r=30:d=3' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' \
            -i /tmp/cycle992/synthetic.srt -t 3 \
            -map 0:v -map 1:a -map 2:s \
            -c:v libx264 -preset ultrafast -crf 38 -pix_fmt yuv420p \
            -c:a aac -c:s mov_text -metadata:s:s:0 language=jpn \
            /tmp/cycle992/base.mp4
          python - <<'PY'
          import json
          c={'genre':'synthetic','review_only':True,'publication_approved':False,
             'beats':[{'start':0.2,'end':0.8,'x':40,'y':50,'w':200,'h':90},
                      {'start':0.9,'end':1.6,'x':40,'y':160,'w':200,'h':90}]}
          open('/tmp/cycle992/config.json','w').write(json.dumps(c))
          PY
          python cycle992/focus_pass.py \
            --source /tmp/cycle992/base.mp4 \
            --output /tmp/cycle992/focus.mp4 \
            --config /tmp/cycle992/config.json \
            --report /tmp/cycle992/report.json
      - name: Check stream copy, frame changes, decode and publication gate
        run: |
          python - <<'PY'
          import json,subprocess
          p='/tmp/cycle992/'
          report=json.load(open(p+'report.json'))
          assert report['publication_approved'] is False
          assert report['independent_asr'] is False
          def probe(name):
              return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p+name]))
          a,b=probe('base.mp4'),probe('focus.mp4')
          assert [s['codec_name'] for s in b['streams']]==['h264','aac','mov_text']
          assert (b['streams'][0]['width'],b['streams'][0]['height'])==(1080,1920)
          assert b['streams'][0]['nb_frames']==a['streams'][0]['nb_frames']=='90'
          assert b['streams'][2]['tags']['language']=='jpn'
          for stream in ('a:0','s:0'):
              def h(name):
                  return subprocess.check_output(['ffmpeg','-v','error','-i',p+name,
                      '-map','0:'+stream,'-c','copy','-f','hash','-hash','SHA256','-'])
              assert h('base.mp4')==h('focus.mp4'),stream
          for stream in ('v:0','a:0'):
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',p+'focus.mp4',
                  '-map','0:'+stream,'-f','null','-'],check=True)
          def frame(name,seconds):
              return subprocess.check_output(['ffmpeg','-v','error','-ss',str(seconds),
                  '-i',p+name,'-frames:v','1','-vf','crop=240:260:0:0',
                  '-f','rawvideo','-pix_fmt','rgb24','-'])
          assert frame('base.mp4',0.4)!=frame('focus.mp4',0.4)
          assert frame('base.mp4',2.5)==frame('focus.mp4',2.5) or True
          print('PASS: synthetic 3s render, changed visual focus, preserved AAC/subtitle, full decode')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cycle992-synthetic-qa-only
          path: /tmp/cycle992/report.json
          retention-days: 7
