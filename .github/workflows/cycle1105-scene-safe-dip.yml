name: cycle1105 scene-safe dip offline QA
on:
  push:
    branches:
      - quality/cycle1105-scene-safe-dip-20261031
  pull_request:
    paths:
      - 'cycle1105/**'
      - '.github/workflows/cycle1105-scene-safe-dip.yml'
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Japanese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Python image dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'Pillow>=10,<13' 'opencv-python-headless>=4.8,<5'
      - name: Test ten genre presets and ghost-free transitions
        run: python -m unittest discover -s cycle1105/tests -p 'test_*.py' -v
      - name: Synthetic two-second H264 AAC smoke (not user video)
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'cycle1105')
          from scene_safe_dip import caption_plate
          caption_plate(0,'ai_work').save('/tmp/cycle1105_caption.png')
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0x08172c:s=1080x1920:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -loop 1 -framerate 30 -i /tmp/cycle1105_caption.png \
            -filter_complex '[0:v][2:v]overlay=0:1370:shortest=1[v]' \
            -map '[v]' -map 1:a -t 2 -c:v libx264 -preset ultrafast \
            -crf 28 -pix_fmt yuv420p -c:a aac /tmp/cycle1105_smoke.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1105_smoke.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height \
            -show_entries format=duration -of json /tmp/cycle1105_smoke.mp4
