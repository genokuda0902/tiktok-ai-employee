name: cycle1308 review renderer tests
on:
  pull_request:
    paths:
      - 'quality/cycle1308/**'
      - '.github/workflows/cycle1308.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd quality/cycle1308 && python -m unittest discover -p 'test_*.py'
