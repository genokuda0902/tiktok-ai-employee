name: v20 verified human posting package
on:
  workflow_dispatch:
jobs:
  render-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install production stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-noto-cjk curl
      - name: Prepare AivisSpeech
        run: |
          mkdir -p "$HOME/.local/share/AivisSpeech-Engine/Models"
          curl -L --fail --retry 3 "https://api.aivis-project.com/v1/aivm-models/76a774e4-cc4d-4d8c-879e-8d2be3d30dad/download?model_type=AIVMX" -o "$HOME/.local/share/AivisSpeech-Engine/Models/flow.aivmx"
          sudo chown -R 1000:1000 "$HOME/.local/share/AivisSpeech-Engine"
          docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          docker run -d --name aivis -p 10101:10101 -v "$HOME/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev" ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:10101/speakers > speakers.json && break; sleep 5; done
          test -s speakers.json
      - name: Generate matching narration
        env:
          AIVIS_SPEAKER_NAME: Flow
          AIVIS_STYLE_NAME: 04_FUN
          AIVIS_SPEED: '1.13'
          AIVIS_INTONATION: '1.12'
          NARRATION_OUT: output/narration.wav
        run: python3 src/synthesize.py
      - name: Render matching v20 video
        run: python3 src/v20_zero_cost_motion.py
      - name: Stage correct account and caption
        run: python3 src/stage_v20_post.py
      - name: Verify actual video and audio
        run: python3 src/verify_video.py output/okuda_v20_01.mp4
      - name: Prepare manual posting manifest
        run: python3 src/build_post_packages.py
      - name: Upload only verified posting package
        uses: actions/upload-artifact@v4
        with:
          name: okuda-v20-human-post-package
          path: |
            output/okuda_v20_01.mp4
            output/okuda_v20_01_post.json
            output/video_verification.json
            output/posting_packages.json
          if-no-files-found: error
          retention-days: 14
