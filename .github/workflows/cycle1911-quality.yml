name: cycle1911-quality
on:
  pull_request:
    paths:
      - 'quality/edge_fade.py'
      - 'quality/test_edge_fade.py'
      - '.github/workflows/cycle1911-quality.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run edge fade unit tests
        run: cd quality && python -m unittest -v test_edge_fade.py
