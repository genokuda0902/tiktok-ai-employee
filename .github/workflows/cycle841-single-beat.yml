name: cycle841 single-beat caption safety tests
on:
  push:
    branches:
      - 'automation/cycle841-*'
    paths:
      - 'cycle841/**'
      - '.github/workflows/cycle841-single-beat.yml'
  pull_request:
    paths:
      - 'cycle841/**'
      - '.github/workflows/cycle841-single-beat.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test runner
        run: python -m pip install pytest
      - name: Validate ten-genre fail-closed caption engine
        run: python -m pytest -q cycle841/test_caption_engine.py
