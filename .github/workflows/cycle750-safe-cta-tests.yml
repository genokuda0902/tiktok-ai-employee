name: Cycle750 safe CTA QA
on:
  pull_request:
    paths:
      - 'quality/cycle750/**'
      - '.github/workflows/cycle750-safe-cta-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-zone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate safe CTA geometry
        run: python -m unittest quality/cycle750/test_safe_zone.py -v
