name: cycle1603 review-only contract
on:
  pull_request:
    paths:
      - 'quality/cycle1603_scene_contract.py'
      - 'tests/test_cycle1603.py'
      - '.github/workflows/cycle1603-review.yml'
  workflow_dispatch:
jobs:
  scene-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cycle1603.py' -v
