name: cycle874 Japanese caption pacing
on:
  push:
    branches:
      - feature/cycle874-sentence-paced-captions
  pull_request:
    paths:
      - "cycle874/**"
      - ".github/workflows/cycle874-caption-pacing.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify ten-genre caption logic and exact Japanese text
        run: python -m unittest discover -s cycle874 -p 'test_*.py' -v
