name: cycle857 review-only coherent Calc preview
on:
  push:
    branches:
      - 'automation/cycle857-*'
  pull_request:
    paths:
      - 'cycle857/**'
      - '.github/workflows/cycle857-coherent-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5' 'Pillow>=10,<13'
      - name: Ten-genre unit tests
        run: |
          python -m compileall -q cycle857
          PYTHONPATH=cycle857 python -m unittest discover -s cycle857 -p 'test_*.py' -v
      - name: Synthetic H264/AAC render smoke (no private media)
        run: |
          mkdir -p /tmp/cycle857
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x273c4b:s=1080x1920:r=30 \
            -f lavfi -i sine=frequency=500:sample_rate=48000 -t 2 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle857/source.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          from cycle857.coherent_preview import POLICY,sha256
          Path('/tmp/cycle857/manifest.json').write_text(json.dumps({**POLICY,'source_sha256':sha256('/tmp/cycle857/source.mp4')}))
          PY
          python cycle857/coherent_preview.py \
            --source /tmp/cycle857/source.mp4 --output /tmp/cycle857/review.mp4 \
            --manifest /tmp/cycle857/manifest.json --report /tmp/cycle857/qa.json \
            --window 10 40 --preview-index 45
          ffmpeg -v error -xerror -i /tmp/cycle857/review.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,nb_frames -of compact /tmp/cycle857/review.mp4
      - name: Safety status
        run: |
          echo 'SYNTHETIC REVIEW ONLY — NO PRODUCTION VIDEO IN CI — NO POSTING'