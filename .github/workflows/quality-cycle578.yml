name: Cycle578 Tests
on:
  push:
    branches: [quality/cycle578-cta-hook-loop-20261015]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s quality/cycle578 -p 'test_*.py' -v
