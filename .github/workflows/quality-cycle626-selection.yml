name: Cycle626 checks
on:
  push:
    branches: [quality/cycle626-range-selection-20261017]
  pull_request:
    paths: ['quality_cycles/cycle626/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s quality_cycles/cycle626 -p 'test_*.py'
