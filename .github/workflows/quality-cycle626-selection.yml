name: Quality cycle626 selection QA
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle626/**'
      - '.github/workflows/quality-cycle626-selection.yml'
  workflow_dispatch:
jobs:
  selection-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install 'Pillow==11.3.0'
      - run: cd quality_cycles/cycle626 && python -m unittest discover -p 'test_*.py' -v
