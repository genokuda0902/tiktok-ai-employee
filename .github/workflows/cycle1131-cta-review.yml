name: cycle1131-cta-review
on:
  push:
    branches:
      - quality/cycle1131-one-action-cta-20261031
  pull_request:
    paths:
      - 'quality/cycle1131/**'
      - '.github/workflows/cycle1131-cta-review.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check Pillow
      - name: Ten genre CTA tests
        run: python -m unittest discover -s quality/cycle1131 -p 'test_*.py' -v
      - name: Synthetic 1-second codec and decode smoke test
        run: |
          ffmpeg -v error -y -f lavfi -i color=c=0x092036:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 /tmp/cycle1131_synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1131_synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height -of json /tmp/cycle1131_synthetic.mp4
