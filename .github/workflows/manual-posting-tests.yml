name: Manual posting registry tests
on:
  pull_request:
    paths:
      - 'src/manual_posting.py'
      - 'tests/test_manual_posting.py'
      - '.github/workflows/manual-posting-tests.yml'
  workflow_dispatch:
jobs:
  posting-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test posting registry (mocked TikTok only)
        run: python -m unittest discover -s tests -p 'test_manual_posting.py' -v
