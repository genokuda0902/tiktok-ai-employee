name: cycle889 arithmetic correction QA (synthetic only)
on:
  push:
    branches:
      - automation/cycle889-arithmetic-correction-20261027
  pull_request:
    paths:
      - 'video_engine/cycle889/**'
      - '.github/workflows/cycle889-qa.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source render/test dependencies
        run: |
          python -m pip install 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Ten-genre arithmetic and safety unit tests
        env:
          PYTHONPATH: video_engine/cycle889
        run: python -m unittest discover -s video_engine/cycle889 -p 'test_*.py' -v
      - name: Synthetic H264 AAC encode and decode (NOT private Japanese MP4)
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=navy:s=540x960:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/cycle889_synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle889_synthetic.mp4 -f null -
      - name: Block inherited or private media in PR source
        run: |
          if find video_engine/cycle889 -type f \( -iname '*.mp4' -o -iname '*.m4a' -o -iname '*.wav' -o -iname '*.png' -o -iname '*.jpg' \) | grep .; then echo 'Private media must never be committed'; exit 1; fi
