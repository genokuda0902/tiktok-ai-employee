name: Cycle 1310 quality gate
on:
  pull_request:
    paths:
      - 'quality/cycle1310/**'
      - '.github/workflows/cycle1310-quality.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python quality/cycle1310/quality_gate.py
