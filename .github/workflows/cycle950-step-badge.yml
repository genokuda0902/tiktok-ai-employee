name: cycle950 chapter badge offline QA
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle950/**'
      - '.github/workflows/cycle950-step-badge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline dependencies
        run: python -m pip install --disable-pip-version-check pytest pillow
      - name: Test 10 genres, frame boundaries and safe region
        run: python -m pytest -q quality_cycles/cycle950/tests/test_step_badge.py
      - name: Fail if publishing API is present
        run: |
          ! grep -Ein 'requests\.post|tiktok.*(upload|publish)|auto.?post' quality_cycles/cycle950/step_badge.py
