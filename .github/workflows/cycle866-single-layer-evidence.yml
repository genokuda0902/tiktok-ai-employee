name: cycle866 single-layer evidence quality gates
on:
  push:
    branches: [automation/cycle866-single-layer-evidence-20261026]
    paths:
      - 'cycle866/**'
      - '.github/workflows/cycle866-single-layer-evidence.yml'
  pull_request:
    paths:
      - 'cycle866/**'
      - '.github/workflows/cycle866-single-layer-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-synthetic-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CJK font and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Test all ten genre scenes and fail-closed rights policy
        run: PYTHONPATH=cycle866 python -m unittest discover -s cycle866 -p 'test_*.py' -v
      - name: Synthetic H264/AAC decode smoke test (NOT private Japanese MP4)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x152f4e:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle866_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle866_synthetic.mp4 -f null -