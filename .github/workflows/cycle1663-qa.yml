name: Cycle1663 narration readiness QA
on:
  pull_request:
    paths:
      - 'quality/cycle1663/**'
      - '.github/workflows/cycle1663-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd quality/cycle1663 && python -m unittest -v test_audio_readiness
