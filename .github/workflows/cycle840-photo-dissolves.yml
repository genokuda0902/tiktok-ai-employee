name: cycle840 photo-only dissolve safety tests
on:
  push:
    branches:
      - 'automation/cycle840-*'
    paths:
      - 'cycle840/**'
      - '.github/workflows/cycle840-photo-dissolves.yml'
  pull_request:
    paths:
      - 'cycle840/**'
      - '.github/workflows/cycle840-photo-dissolves.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test runner
        run: python -m pip install pytest
      - name: Run fail-closed 10-genre tests
        env:
          PYTHONPATH: cycle840
        run: python -m pytest -q cycle840/test_cycle840_dissolve.py
