name: cycle1088 chart-to-proof total bridge
on:
  push:
    paths: ['quality/cycle1088/**', '.github/workflows/cycle1088-chart-total-bridge.yml']
  pull_request:
    paths: ['quality/cycle1088/**', '.github/workflows/cycle1088-chart-total-bridge.yml']
jobs:
  synthetic-review-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk python3-pil
      - run: PYTHONPATH=. /usr/bin/python3 -m unittest quality.cycle1088.test_chart_total_bridge -v
      - run: PYTHONPATH=. /usr/bin/python3 -m quality.cycle1088.chart_total_bridge --smoke
