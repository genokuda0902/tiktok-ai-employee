name: cycle843 mobile spreadsheet focus review-only QA
on:
  push:
    branches:
      - 'automation/cycle843-*'
    paths:
      - 'cycle843/**'
      - '.github/workflows/cycle843-mobile-focus.yml'
  pull_request:
    paths:
      - 'cycle843/**'
      - '.github/workflows/cycle843-mobile-focus.yml'
  workflow_dispatch:
jobs:
  synthetic-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'opencv-python-headless>=4.8,<5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Test ten-genre safety and mobile focus
        run: |
          python -m compileall -q cycle843
          PYTHONPATH=. python -m unittest discover -s cycle843 -p 'test_*.py' -v
      - name: Synthetic-only A/V decoder smoke
        run: |
          ffmpeg -v error -y -f lavfi -i color=c=navy:s=320x568:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/c843_synth.mp4
          ffmpeg -v error -xerror -i /tmp/c843_synth.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/c843_synth.mp4
