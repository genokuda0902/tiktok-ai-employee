name: cycle1502 review quality tests
on:
  pull_request:
    paths:
      - 'quality/cycle1502_motion.py'
      - 'tests/test_cycle1502_motion.py'
      - '.github/workflows/cycle1502-review.yml'
  workflow_dispatch:
jobs:
  review-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cycle1502_motion.py' -v
