name: cycle858 review-only beat-aligned detail shots
on:
  push:
    branches:
      - 'automation/cycle858-*'
  pull_request:
    paths:
      - 'cycle858/**'
      - '.github/workflows/cycle858-beat-focus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg (free, offline renderer)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Ten-genre tests and syntax
        run: |
          python -m compileall -q cycle858
          PYTHONPATH=cycle858 python -m unittest discover -s cycle858 -p 'test_*.py' -v
      - name: Synthetic two-second H264/AAC smoke, no private media
        run: |
          mkdir -p /tmp/cycle858
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x204050:s=1080x1920:r=30 \
            -f lavfi -i sine=frequency=550:sample_rate=48000 -t 2 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle858/source.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          from cycle858.beat_focus import POLICY,sha256
          Path('/tmp/cycle858/manifest.json').write_text(json.dumps({**POLICY,'source_sha256':sha256('/tmp/cycle858/source.mp4')}))
          PY
          python cycle858/beat_focus.py --synthetic \
            --source /tmp/cycle858/source.mp4 --output /tmp/cycle858/review.mp4 \
            --manifest /tmp/cycle858/manifest.json --report /tmp/cycle858/qa.json
          ffmpeg -v error -xerror -i /tmp/cycle858/review.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,nb_frames -of compact /tmp/cycle858/review.mp4
      - name: Publication safety
        run: echo 'REVIEW ONLY; CI USES SYNTHETIC MEDIA; NO AUTOMATIC POSTING'
