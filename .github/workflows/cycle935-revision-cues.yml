name: cycle935 revision cues QA
on:
  pull_request:
    paths:
      - 'cycle935/**'
      - '.github/workflows/cycle935-revision-cues.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-cue-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow==11.3.0
      - name: Test ten-genre renderer and safe zones
        run: python -m unittest discover -s cycle935/tests -v
      - name: Render synthetic overlays
        run: |
          python cycle935/src/revision_cues.py --outdir /tmp/cycle935-overlays --genre ai_productivity
          test "$(find /tmp/cycle935-overlays -name '*.png' | wc -l)" -eq 87
