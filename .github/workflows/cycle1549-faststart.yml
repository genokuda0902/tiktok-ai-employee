name: Cycle1549 faststart smoke
on:
  push:
    branches: [automation/cycle1549-faststart]
  pull_request:
    paths: ['tools/video_faststart.sh', 'tools/test_faststart.py', '.github/workflows/cycle1549-faststart.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic Japanese caption fixture
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          printf '1\n00:00:00,000 --> 00:00:01,500\n字幕テスト\n' > /tmp/caption.srt
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=navy:s=1080x1920:r=10:d=2 -f lavfi -i sine=frequency=440:duration=2 -i /tmp/caption.srt -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -c:s mov_text -shortest /tmp/input.mp4
      - name: Run remux and test
        run: bash tools/video_faststart.sh /tmp/input.mp4 /tmp/output.mp4
