name: cycle1018 review-only complete prompt QA
on:
  push:
    branches:
      - 'automation/cycle1018-complete-prompt-*'
  pull_request:
    paths:
      - 'cycle1018/**'
      - '.github/workflows/cycle1018_review.yml'
permissions:
  contents: read
jobs:
  synthetic-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install 'Pillow==11.3.0'
      - name: Unit tests including text clipping and fail-closed gates
        run: python -m unittest discover -s cycle1018/tests -p 'test_*.py' -v
      - name: Generate 2-second synthetic video and Japanese-tagged AAC
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=1080x1920:rate=30:duration=2' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=2' \
            -map 0:v -map 1:a -t 2 -c:v libx264 -preset ultrafast -crf 37 \
            -pix_fmt yuv420p -c:a aac -ar 48000 \
            -metadata:s:a:0 language=jpn -movflags +faststart /tmp/synthetic_input.mp4
      - name: Render, decode, and audit synthetic A/V
        run: |
          python cycle1018/source/prompt_completeness.py \
            --source /tmp/synthetic_input.mp4 --output /tmp/synthetic_output.mp4 \
            --report /tmp/cycle1018_qa.json --review-only --synthetic-ci
          python - <<'PY'
          import json
          q=json.load(open('/tmp/cycle1018_qa.json'))
          assert q['resolution']==[1080,1920] and q['frames']==60
          assert q['full_decode']=='PASS' and q['audio_unchanged']
          assert q['publication']=='NOT_APPROVED' and q['japanese_asr']=='NOT_VERIFIED'
          print('SYNTHETIC QA PASS; real Japanese video is NOT in CI.')
          PY
      - name: Assert no private media committed
        run: |
          test ! -e cycle1018/output/cycle1018_COMPLETE_PROMPT_JP_REVIEW_ONLY.mp4
          echo 'No private video, soundtrack, or storyboard uploaded.'
