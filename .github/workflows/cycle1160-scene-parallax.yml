name: cycle1160-scene-parallax-review
on:
  push:
    branches: [quality/cycle1160-scene-parallax]
  pull_request:
    paths:
      - 'quality/cycle1160/**'
      - '.github/workflows/cycle1160-scene-parallax.yml'
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Unit tests for all 10 genres
        env:
          PYTHONPATH: quality/cycle1160
        run: python -m unittest discover -s quality/cycle1160/tests -p 'test_*.py' -v
      - name: Render and decode synthetic 1080x1920 H264/AAC MP4
        env:
          PYTHONPATH: quality/cycle1160
        run: python quality/cycle1160/tests/ci_smoke.py
