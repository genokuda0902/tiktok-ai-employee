name: cycle756 visual-safe-zone tests
on:
  push:
    branches:
      - 'quality/cycle756-connection-focus-20261022'
  pull_request:
    paths:
      - 'experiments/cycle756/**'
      - '.github/workflows/cycle756.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow pytest
      - run: python -m pytest -q experiments/cycle756/tests
