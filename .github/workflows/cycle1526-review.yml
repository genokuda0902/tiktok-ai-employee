name: cycle1526 review QA
on:
  pull_request:
    paths:
      - 'experiments/cycle1526/**'
      - '.github/workflows/cycle1526-review.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Run unit tests
        run: cd experiments/cycle1526 && python -m unittest -v test_qa
