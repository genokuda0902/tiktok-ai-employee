name: cycle863 review-only proof comparison
on:
  pull_request:
    paths:
      - 'cycle863/**'
      - '.github/workflows/cycle863-proof-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-synthetic-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free local renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-pil
      - name: Run 10-genre review-policy tests
        run: |
          PYTHONPATH=cycle863 python3 -m unittest discover -s cycle863 -p 'test_*.py' -v
      - name: Smoke test synthetic H264/AAC file (not real Japanese output)
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x10243a:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle863_synthetic.mp4
          ffmpeg -v error -i /tmp/cycle863_synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/cycle863_synthetic.mp4 | grep -q h264