name: cycle764-render
on:
  push:
    branches:
      - 'quality/cycle764-*'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install pillow
      - run: python -m unittest discover -s quality_cycles/cycle764/tests -p 'test_*.py' -v
      - run: python quality_cycles/cycle764/ci/ci_smoke.py
