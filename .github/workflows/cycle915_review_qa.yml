name: cycle915 evidence review offline QA
on:
  push:
    paths:
      - 'review_cycles/cycle915/**'
      - '.github/workflows/cycle915_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle915/**'
      - '.github/workflows/cycle915_review_qa.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify original 10-genre renderer and policy gates
        run: python3 -m unittest discover -s review_cycles/cycle915 -p 'test_policy.py' -v
      - name: Block review MP4 and private media from public repository
        run: |
          if find review_cycles/cycle915 -type f \( -iname '*.mp4' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.wav' -o -iname '*.aac' \) | grep -q .; then
            echo 'Private media must not be committed' >&2
            exit 1
          fi
