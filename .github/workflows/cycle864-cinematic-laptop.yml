name: cycle864 image-first review-only quality tests
on:
  push:
    branches: [automation/cycle864-cinematic-image-first-20261026]
    paths:
      - 'cycle864/**'
      - '.github/workflows/cycle864-cinematic-laptop.yml'
  pull_request:
    paths:
      - 'cycle864/**'
      - '.github/workflows/cycle864-cinematic-laptop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-synthetic-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Python dependencies and bundled FFmpeg
        run: python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Test ten genres, caption-safe geometry, fail-closed policy
        run: PYTHONPATH=cycle864 python -m unittest discover -s cycle864 -p 'test_*.py' -v
      - name: Smoke test synthetic H264/AAC file (NOT private Japanese MP4)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x17314c:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle864_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle864_synthetic.mp4 -f null -