name: cycle802 optical centering review CI
on:
  push:
    branches: ['quality/cycle802-*']
    paths:
      - 'quality/cycle802/**'
      - '.github/workflows/cycle802-review.yml'
  pull_request:
    paths:
      - 'quality/cycle802/**'
      - '.github/workflows/cycle802-review.yml'
permissions:
  contents: read
jobs:
  synthetic-reframe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s quality/cycle802 -p 'test_*.py' -v
      - name: Create synthetic video and synthetic sine audio
        run: |
          mkdir -p review_output/cycle802
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x06182b:s=1080x1920:r=30:d=2' -f lavfi -i 'sine=frequency=440:duration=2:sample_rate=48000' -filter_complex '[0:v]drawbox=x=60:y=400:w=710:h=800:color=0x31bad7:t=8[v]' -map '[v]' -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest review_output/cycle802/BEFORE_SYNTHETIC.mp4
      - name: Reframe and decode synthetic media
        run: |
          python quality/cycle802/reframe.py --config quality/cycle802/config.json --source-video review_output/cycle802/BEFORE_SYNTHETIC.mp4 --output review_output/cycle802/AFTER_SYNTHETIC_TONE_NOT_JAPANESE.mp4 --review-only
          ffmpeg -hide_banner -v error -i review_output/cycle802/AFTER_SYNTHETIC_TONE_NOT_JAPANESE.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -of json review_output/cycle802/AFTER_SYNTHETIC_TONE_NOT_JAPANESE.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cycle802-optical-center-SYNTHETIC-TONE-NOT-JAPANESE
          path: review_output/cycle802/AFTER_SYNTHETIC_TONE_NOT_JAPANESE.mp4
          retention-days: 7
