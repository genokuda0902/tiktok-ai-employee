name: cycle967 audio-reactive voice meter (synthetic only)
on:
  push:
    branches:
      - feature/cycle967-audio-reactive-meter-review
    paths:
      - cycle967/**
      - .github/workflows/cycle967-voice-meter.yml
  pull_request:
    paths:
      - cycle967/**
      - .github/workflows/cycle967-voice-meter.yml
permissions:
  contents: read
jobs:
  synthetic-voice-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user numpy Pillow
      - name: Test actual audio-driven meter logic and fail-closed 10-genre gate
        run: python3 -m unittest discover -s cycle967/tests -p 'test_*.py' -v
      - name: Render and decode synthetic 1080x1920 MP4
        run: |
          mkdir -p /tmp/cycle967
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x071628:s=1080x1920:r=30:d=3' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 36 \
            -pix_fmt yuv420p -c:a aac -ar 48000 -metadata:s:a:0 language=jpn \
            -t 3 /tmp/cycle967/synthetic.mp4
          python3 cycle967/code/voice_reactive.py \
            --input /tmp/cycle967/synthetic.mp4 \
            --output /tmp/cycle967/review.mp4 \
            --report /tmp/cycle967/report.json --synthetic-test
          ffmpeg -v error -xerror -i /tmp/cycle967/review.mp4 -f null -
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open('/tmp/cycle967/report.json'))
          assert p['publish_approved'] is False
          assert p['meter_bbox']==[565,70,715,111]
          j=json.loads(subprocess.check_output(['ffprobe','-v','error','-count_frames','-show_streams','-of','json','/tmp/cycle967/review.mp4']))
          v=next(x for x in j['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'],v['r_frame_rate'])==(1080,1920,'30/1')
          assert int(v['nb_read_frames'])==90
          print('Synthetic vertical MP4 render and full decode PASS')
          PY
      - name: Prevent publishing private media
        run: |
          if find cycle967 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.jpg' -o -iname '*.png' \) | grep .; then
            echo 'Generated and user media must remain outside public GitHub'
            exit 1
          fi
