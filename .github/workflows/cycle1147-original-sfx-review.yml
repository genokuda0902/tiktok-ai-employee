name: cycle1147 original transition SFX (synthetic review)
on:
  pull_request:
    paths:
      - 'quality/cycle1147/**'
      - '.github/workflows/cycle1147-original-sfx-review.yml'
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1147/tests -v
      - name: Synthetic A/V smoke test
        run: python quality/cycle1147/code/ci_synthetic.py
