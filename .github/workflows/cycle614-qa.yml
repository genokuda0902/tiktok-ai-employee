name: cycle614 focus QA
on:
  pull_request:
    paths:
      - 'quality/cycle614/**'
      - '.github/workflows/cycle614-qa.yml'
  workflow_dispatch:
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow pytest
      - run: python -m pytest -q quality/cycle614/tests/test_cycle614.py
