name: cycle1422 caption QA (review only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'quality/cycle1422/**'
      - '.github/workflows/cycle1422-caption-qa.yml'
jobs:
  caption-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk python3-pil
      - run: python3 -m unittest discover -s quality/cycle1422 -p 'test_*.py' -v
