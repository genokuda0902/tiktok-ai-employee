name: Cycle 1610 quality gate
on:
  pull_request:
    paths:
      - 'quality/cycle1610_media_evidence.py'
      - 'tests/test_cycle1610_media_evidence.py'
      - '.github/workflows/cycle1610-quality.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cycle1610_media_evidence.py' -v
