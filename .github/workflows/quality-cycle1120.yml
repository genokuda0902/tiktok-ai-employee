name: Quality cycle1120 single-caption compatibility (synthetic only)
on:
  push:
    paths:
      - 'quality/cycle1120/**'
      - '.github/workflows/quality-cycle1120.yml'
  pull_request:
    paths:
      - 'quality/cycle1120/**'
      - '.github/workflows/quality-cycle1120.yml'
  workflow_dispatch:
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run ten-genre guard and synthetic subtitle compatibility tests
        run: python -m unittest discover -s quality/cycle1120 -p 'test_*.py' -v
