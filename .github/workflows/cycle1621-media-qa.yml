name: cycle1621-media-qa
on:
  pull_request:
    paths:
      - 'quality/**'
      - '.github/workflows/cycle1621-media-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s quality -p 'test_cycle1621_media_qa.py' -v
