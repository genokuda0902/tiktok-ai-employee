name: AI Jitan v20 Zero Cost Motion
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render fast motion clips from hero stills
        run: python3 src/v20_zero_cost_motion.py
      - name: Upload proof clips
        uses: actions/upload-artifact@v4
        with:
          name: ai-jitan-v20-zero-cost-motion
          path: output/v20_motion/
          retention-days: 7
