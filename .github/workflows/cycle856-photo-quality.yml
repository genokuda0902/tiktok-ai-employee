name: cycle856 photo quality gate
on:
  pull_request:
    paths:
      - 'quality/cycle856/**'
      - '.github/workflows/cycle856-photo-quality.yml'
  workflow_dispatch:
jobs:
  photo-geometry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate ten-genre photo quality gate
        run: |
          cd quality/cycle856
          python -m unittest -v test_highres_photo_core
