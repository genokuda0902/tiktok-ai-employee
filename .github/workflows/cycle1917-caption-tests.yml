name: Caption stabilization tests
on:
  push:
    branches: [automation/cycle1917-caption-stabilization]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd quality/cycle1917 && python -m unittest -v test_stabilize_caption.py
