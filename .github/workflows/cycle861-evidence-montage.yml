name: cycle861 evidence montage synthetic-only CI
on:
  push:
    paths:
      - 'cycle861/**'
      - '.github/workflows/cycle861-evidence-montage.yml'
  pull_request:
    paths:
      - 'cycle861/**'
      - '.github/workflows/cycle861-evidence-montage.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Run unit tests
        run: PYTHONPATH=cycle861 python -m unittest discover -s cycle861 -p 'test_*.py' -v
      - name: Synthetic 2-second H264 AAC smoke (no private footage)
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=0x0a2030:s=1080x1920:r=30:d=2' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=2' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/synthetic.mp4
          ffmpeg -hide_banner -loglevel error -i /tmp/synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,sample_rate -of json /tmp/synthetic.mp4