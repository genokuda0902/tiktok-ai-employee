name: Cycle787 artwork tests
on:
  push:
    branches:
      - 'quality/cycle787-*'
  pull_request:
    paths:
      - 'cycles/cycle787/**'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run quality unit tests
        run: python -m unittest discover -s cycles/cycle787/tests -v
