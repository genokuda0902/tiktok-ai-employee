name: cycle1614 review render
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle1614/**'
      - '.github/workflows/cycle1614-review.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install pillow pytest
      - run: python -m pytest quality_cycles/cycle1614/test_render.py
      - run: python quality_cycles/cycle1614/render.py
      - run: ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json quality_cycles/cycle1614/cycle1614_REVIEW_ONLY.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cycle1614-review-only
          path: quality_cycles/cycle1614/cycle1614_REVIEW_ONLY.mp4
