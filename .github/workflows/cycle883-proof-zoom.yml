name: cycle883 proof-zoom safety tests
on:
  push:
    paths:
      - 'quality/cycle883/**'
      - '.github/workflows/cycle883-proof-zoom.yml'
  pull_request:
    paths:
      - 'quality/cycle883/**'
      - '.github/workflows/cycle883-proof-zoom.yml'
jobs:
  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 10-genre core and privacy gates
        run: python -m unittest discover -s quality/cycle883 -p 'test_*.py' -v
