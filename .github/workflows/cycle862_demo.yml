name: Cycle862 Animated Workflow Demo Tests
on:
  pull_request:
    paths:
      - 'tools/cycle862_demo.py'
      - 'tests/test_cycle862_demo.py'
      - '.github/workflows/cycle862_demo.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free runtime dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Run 10-genre and timing tests
        run: python -m unittest discover -s tests -p 'test_cycle862_demo.py' -v
