name: cycle820 complete action plan review QA
on:
  push:
    branches:
      - 'quality/cycle820-*'
  pull_request:
    branches:
      - 'quality/cycle819-cinematic-review-20261025'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action-plan-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Unit tests for 10 genres and complete deadline
        run: PYTHONPATH=quality/cycle820 python -m unittest discover -s quality/cycle820 -p 'test_*.py' -v
      - name: Generate and decode synthetic review MP4 (NOT Japanese speech)
        run: |
          mkdir -p review_output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x081928:s=1080x1920:r=30' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 19 -c:v libx264 -preset ultrafast -crf 39 \
            -pix_fmt yuv420p -c:a aac -b:a 64k \
            review_output/source_SYNTHETIC.mp4
          python quality/cycle820/action_story.py \
            --source review_output/source_SYNTHETIC.mp4 \
            --output review_output/cycle820_SYNTHETIC_NOT_FOR_PUBLICATION.mp4 \
            --genre sales_business --synthetic
          ffmpeg -hide_banner -loglevel error -xerror \
            -i review_output/cycle820_SYNTHETIC_NOT_FOR_PUBLICATION.mp4 -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('review_output/qa820.json').read_text())
          assert x['cycle']==820 and x['genre_count']==10
          assert (x['width'],x['height'],x['fps'])==(1080,1920,'30/1')
          assert x['frames']==90 and x['all_action_fields_completed']
          assert x['synthetic_source'] is True
          assert x['japanese_speech_semantics_verified'] is False
          assert x['publication_approved'] is False and x['auto_post'] is False
          print('PASS: synthetic video decoded; NOT Japanese narration')
          PY
      - name: Upload synthetic QA-only MP4
        uses: actions/upload-artifact@v4
        with:
          name: cycle820-SYNTHETIC-NOT-FOR-PUBLICATION
          path: |
            review_output/cycle820_SYNTHETIC_NOT_FOR_PUBLICATION.mp4
            review_output/qa820.json
          if-no-files-found: error
          retention-days: 7
