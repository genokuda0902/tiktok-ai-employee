name: cycle1108 hook clarity (synthetic CI only)
on:
  push:
    branches:
      - 'quality/cycle1108-hook-clarity-20261101'
  pull_request:
    paths:
      - 'quality/cycle1108/**'
      - '.github/workflows/cycle1108-hook-clarity.yml'
  workflow_dispatch:
jobs:
  synthetic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free offline test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install --user 'Pillow>=10,<13'
      - name: Ten-genre unit tests
        run: python3 -m unittest discover -s quality/cycle1108 -p 'test_*.py' -v
      - name: Generate synthetic 3s AV and verify audio-preserving hook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle1108
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x092b3b:s=1080x1920:r=30:d=3' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle1108/input.mp4
          HASH=$(sha256sum /tmp/cycle1108/input.mp4 | cut -d' ' -f1)
          python3 quality/cycle1108/hook_clarity.py --source /tmp/cycle1108/input.mp4 --source-sha "$HASH" --manifest quality/cycle1108/manifest.json --out /tmp/cycle1108/output.mp4 --report /tmp/cycle1108/qa.json
          ffmpeg -v error -i /tmp/cycle1108/output.mp4 -f null -
          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/cycle1108/qa.json'))
          assert q['audio_bitstream_identical'] and q['frames']==90
          assert q['size']==[1080,1920] and q['publication']=='NOT_APPROVED'
          PY
