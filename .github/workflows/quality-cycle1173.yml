name: Quality cycle1173 caption clarity (synthetic only)
on:
  pull_request:
    paths:
      - 'quality/cycle1173/**'
      - '.github/workflows/quality-cycle1173.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source FFmpeg and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1173/tests -v
      - name: Synthetic Japanese caption + AAC 1080x1920 end-to-end
        run: python quality/cycle1173/code/synthetic_ci.py
