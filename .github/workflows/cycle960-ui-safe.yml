name: cycle960 UI-safe caption (synthetic only)
on:
  pull_request:
    paths:
      - 'quality/cycle960/**'
      - '.github/workflows/cycle960-ui-safe.yml'
  workflow_dispatch:
jobs:
  safe-caption-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s quality/cycle960 -p 'test_*.py' -v
