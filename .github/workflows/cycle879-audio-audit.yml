name: cycle879 synthetic audio/caption audit (review only)
on:
  push:
    branches: ['automation/cycle879-audio-caption-audit-20261027']
  pull_request:
    paths:
      - 'cycle879/**'
      - '.github/workflows/cycle879-audio-audit.yml'
  workflow_dispatch:
jobs:
  audio-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ffmpeg -version
      - run: python -m pip install Pillow==11.3.0
      - run: PYTHONPATH=cycle879 python -m unittest discover -s cycle879 -p 'test_*.py' -v
      - run: PYTHONPATH=cycle879 python cycle879/ci_smoke.py
