name: cycle937 narration clarity synthetic QA
on:
  pull_request:
    paths:
      - 'cycle937/**'
      - '.github/workflows/cycle937-narration-clarity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-audio-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate free 10-genre audio profiles and no-post safeguards
        run: python -m unittest discover -s cycle937/tests -v
