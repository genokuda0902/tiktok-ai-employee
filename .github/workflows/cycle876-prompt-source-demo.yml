name: cycle876 source-to-prompt demo (review only)
on:
  push:
    branches: [automation/cycle876-source-prompt-20261027]
    paths:
      - 'cycle876/**'
      - '.github/workflows/cycle876-prompt-source-demo.yml'
  pull_request:
    paths:
      - 'cycle876/**'
      - '.github/workflows/cycle876-prompt-source-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ten-genre-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy imageio-ffmpeg
      - name: Ten-genre data provenance and layout tests
        run: PYTHONPATH=.:cycle876 python -m unittest discover -s cycle876 -p 'test_*.py' -v
      - name: Synthetic H264/AAC smoke only (no private source)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x123456:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle876_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle876_synthetic.mp4 -f null -