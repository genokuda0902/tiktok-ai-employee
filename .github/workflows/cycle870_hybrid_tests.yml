name: cycle870 hybrid compositor tests

on:
  pull_request:
    paths:
      - "quality_cycles/cycle870/**"
      - ".github/workflows/cycle870_hybrid_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run standard-library-only tests (no API calls or media uploads)
        working-directory: quality_cycles/cycle870
        run: python3 -m unittest -v test_hybrid_core.py
