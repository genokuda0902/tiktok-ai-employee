name: cycle837-photo-preservation
on:
  pull_request:
    paths:
      - 'cycle837/**'
      - '.github/workflows/cycle837-photo-preservation.yml'
  workflow_dispatch:
jobs:
  offline-layout-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate ten-genre crop-free layout
        run: python -m unittest discover -s cycle837 -p 'test_*.py' -v
