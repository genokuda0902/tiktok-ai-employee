name: cycle812 kinetic hook synthetic QA
on:
  push:
    branches: ['quality/cycle812-*']
    paths:
      - 'quality/cycle812/**'
      - '.github/workflows/cycle812-review.yml'
  pull_request:
    paths:
      - 'quality/cycle812/**'
      - '.github/workflows/cycle812-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free image renderer and Japanese font
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0
          curl --fail --location --retry 3 --max-time 120 --output "$RUNNER_TEMP/NotoSansJP-Bold.otf" "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP/NotoSansJP-Bold.otf"
          test -s "$RUNNER_TEMP/NotoSansJP-Bold.otf"
          echo "CYCLE812_FONT=$RUNNER_TEMP/NotoSansJP-Bold.otf" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cycle812-bin"
          ln -s "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/cycle812-bin/ffmpeg"
          echo "$RUNNER_TEMP/cycle812-bin" >> "$GITHUB_PATH"
          if ! command -v ffprobe; then timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg; fi
          command -v ffprobe
      - name: Ten genre, frame animation, safe-area and publication tests
        run: PYTHONPATH=quality/cycle812 python -m unittest discover -s quality/cycle812 -p 'test_*.py' -v
      - name: Generate original synthetic color and tone (no private media)
        run: |
          set -euxo pipefail
          mkdir -p review_output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x0b2538:s=1080x1920:r=30:d=23.933333' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=23.933333' \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 34 \
            -frames:v 718 -pix_fmt yuv420p -c:a aac -ar 48000 \
            "$RUNNER_TEMP/cycle812_source.mp4"
      - name: Render, decode and enforce human review
        run: |
          set -euxo pipefail
          python quality/cycle812/kinetic_hook.py --source "$RUNNER_TEMP/cycle812_source.mp4" --output review_output/cycle812_SYNTHETIC_REVIEW_ONLY.mp4
          ffmpeg -hide_banner -loglevel error -xerror -i review_output/cycle812_SYNTHETIC_REVIEW_ONLY.mp4 -f null -
          python -c "import json; q=json.load(open('review_output/cycle812_qa.json')); assert q['publication_approved'] is False and q['auto_post'] is False and q['aac_bitstream_identical'] is True and q['frames']==718"
      - name: Upload synthetic review QA (not user footage or voice)
        uses: actions/upload-artifact@v4
        with:
          name: cycle812-synthetic-review-mp4-and-qa
          path: |
            review_output/cycle812_SYNTHETIC_REVIEW_ONLY.mp4
            review_output/cycle812_qa.json
          retention-days: 7