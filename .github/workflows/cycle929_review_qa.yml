name: cycle929 integrated human-review visual QA
on:
  pull_request:
    paths:
      - 'cycle929/**'
      - '.github/workflows/cycle929_review_qa.yml'
  workflow_dispatch:
jobs:
  review-only-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Pillow and Japanese fonts
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Test ten genre-safe, review-only renderers
        run: python -m unittest discover -s cycle929/tests -p 'test_*.py' -v
      - name: Prevent committing media and automatic publishing
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle929/src/integrated_review_story.py
          grep -q 'EMPLOYEE REVIEW REQUIRED' cycle929/src/integrated_review_story.py
          test ! -e cycle929/output
          test ! -e cycle929/private
