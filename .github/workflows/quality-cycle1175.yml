name: Quality cycle1175 Before After focus (synthetic only)
on:
  pull_request:
    paths:
      - 'quality/cycle1175/**'
      - '.github/workflows/quality-cycle1175.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --user pillow
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1175/tests -v
      - name: Synthetic vertical H264 + AAC render and decode
        run: python quality/cycle1175/code/synthetic_ci.py
