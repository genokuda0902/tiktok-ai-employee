name: cycle1456-review-gate
on:
  pull_request:
    paths:
      - 'quality/cycle1456/**'
      - '.github/workflows/cycle1456-review-gate.yml'
  workflow_dispatch:
jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests
        run: cd quality/cycle1456 && python -m unittest discover -p 'test_*.py' -v
