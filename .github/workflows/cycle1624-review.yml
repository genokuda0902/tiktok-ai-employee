name: Cycle1624 caption QA
on:
  pull_request:
    paths:
      - 'quality/cycle1624_review.py'
      - 'tests/test_cycle1624_review.py'
      - '.github/workflows/cycle1624-review.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cycle1624_review.py' -v
