name: cycle972 source chart (synthetic review-only CI)
on:
  push:
    branches:
      - automation/cycle972-animated-source-chart-20261030
    paths:
      - 'cycle972/**'
      - '.github/workflows/cycle972-source-chart.yml'
  pull_request:
    paths:
      - 'cycle972/**'
      - '.github/workflows/cycle972-source-chart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'Pillow>=10,<13' 'opencv-python-headless>=4.9,<5'
      - name: Arithmetic, animation and ten-genre fail-closed unit tests
        run: python -m unittest discover -s cycle972 -p 'test_*.py' -v
      - name: Render synthetic review sample only
        run: |
          mkdir -p /tmp/cycle972
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x061929:s=1080x1920:r=30:d=3' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle972/synthetic.mp4
          python cycle972/chart_reveal.py --source /tmp/cycle972/synthetic.mp4 --output /tmp/cycle972/preview.mp4 --report /tmp/cycle972/report.json --synthetic
          ffmpeg -v error -i /tmp/cycle972/preview.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 /tmp/cycle972/preview.mp4
      - name: Upload synthetic QA report only
        uses: actions/upload-artifact@v4
        with:
          name: cycle972-synthetic-review-qa
          path: /tmp/cycle972/report.json
          retention-days: 7
