name: cycle843-kinetic-action-cards
on:
  pull_request:
    paths:
      - 'automation/cycle843/**'
      - '.github/workflows/cycle843-kinetic-action-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no paid API, no media upload, no posting)
        working-directory: automation/cycle843
        run: python -m unittest -v test_kinetic_action_cards.py
