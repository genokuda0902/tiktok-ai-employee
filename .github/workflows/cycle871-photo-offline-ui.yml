name: cycle871 photo + offline browser proof (review only)
on:
  push:
    branches: [automation/cycle871-photo-offline-ui-proof-20261026]
    paths:
      - 'cycle871/**'
      - '.github/workflows/cycle871-photo-offline-ui.yml'
  pull_request:
    paths:
      - 'cycle871/**'
      - '.github/workflows/cycle871-photo-offline-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Test ten genre presets and fail-closed review gates
        run: PYTHONPATH=cycle871 python -m unittest discover -s cycle871 -p 'test_*.py' -v
      - name: Synthetic one-second H264 AAC decode (not the private Japanese MP4)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x123456:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle871_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle871_synthetic.mp4 -f null -
