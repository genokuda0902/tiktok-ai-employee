name: cycle1022 review-only step rail and audio signal audit
on:
  push:
    branches:
      - 'automation/cycle1022-step-rail-audio-audit-*'
  pull_request:
    paths:
      - 'cycle1022/**'
      - '.github/workflows/cycle1022_review.yml'
permissions:
  contents: read
jobs:
  synthetic-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg from Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run unit tests
        run: python -m unittest discover -s cycle1022/tests -v
      - name: Generate synthetic two-second A/V only
        run: |
          mkdir -p cycle1022/tmp
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x07131f:s=1080x1920:r=30:d=2' \
            -f lavfi -i 'sine=frequency=420:sample_rate=48000:duration=2' \
            -map 0:v -map 1:a -c:v libx264 -preset ultrafast -threads 2 \
            -pix_fmt yuv420p -c:a aac -b:a 96k -metadata:s:a:0 language=jpn \
            -t 2 cycle1022/tmp/input.mp4
          printf '1\n00:00:00,000 --> 00:00:01,000\n架空の検証音声。\n\n2\n00:00:01,000 --> 00:00:02,000\n承認前の動画。\n' > cycle1022/tmp/cues.srt
      - name: Render, decode, verify signal-only audit
        run: |
          python cycle1022/source/step_rail_audio_audit.py \
            --source cycle1022/tmp/input.mp4 --srt cycle1022/tmp/cues.srt \
            --output cycle1022/tmp/output.mp4 --report cycle1022/tmp/qa.json \
            --genre ai_work --review-only --synthetic-ci
          ffmpeg -v error -xerror -i cycle1022/tmp/output.mp4 -f null -
          python -c "import json; x=json.load(open('cycle1022/tmp/qa.json')); assert x['audio_bitstream_unchanged'] and x['cue_count']==2 and x['publication']=='NOT_APPROVED' and x['full_av_decode']=='PASS'"
