name: cycle897 editorial beat review-only QA
on:
  pull_request:
    paths:
      - 'quality/cycle897/**'
      - '.github/workflows/cycle897-editorial-beats.yml'
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ten-genre safe-zone and fail-closed tests
        run: python -m unittest discover -s quality/cycle897 -p 'test_*.py' -v
      - name: Install free FFmpeg package
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Synthetic 2-second H264 AAC full decode (not private review video)
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=360x640:rate=30:duration=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 /tmp/cycle897-synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle897-synthetic.mp4 -f null -
