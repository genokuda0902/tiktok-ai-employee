name: cycle913 offline review-only QA
on:
  push:
    paths:
      - 'review_cycles/cycle913/**'
      - '.github/workflows/cycle913_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle913/**'
      - '.github/workflows/cycle913_review_qa.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review-only policy, source SHA and geometry tests
        run: python3 -m unittest discover -s review_cycles/cycle913 -p 'test_cycle913.py' -v
      - name: Prevent private media in public source
        run: |
          if find review_cycles/cycle913 -type f \( -iname '*.mp4' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.xlsx' \) | grep -q .; then
            echo 'Private media must not be committed' >&2
            exit 1
          fi
