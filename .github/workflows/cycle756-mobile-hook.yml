name: cycle756 mobile hook tests
on:
  push:
    branches:
      - 'quality/cycle756-mobile-readable-hook-20261022'
    paths:
      - 'quality/cycle756/**'
      - '.github/workflows/cycle756-mobile-hook.yml'
  pull_request:
    paths:
      - 'quality/cycle756/**'
      - '.github/workflows/cycle756-mobile-hook.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install --disable-pip-version-check pillow pytest
      - run: python -m pytest -q quality/cycle756/tests/test_mobile_hero.py
