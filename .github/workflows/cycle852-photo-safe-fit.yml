name: cycle852-photo-safe-fit
on:
  pull_request:
    paths:
      - 'cycle852/**'
      - '.github/workflows/cycle852-photo-safe-fit.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: PYTHONPATH=cycle852 python -m unittest discover -s cycle852 -p 'test_tiktok_photo_safe_fit.py' -v
