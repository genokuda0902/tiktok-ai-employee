name: cycle944-caption-voice-guard-tests
on:
  pull_request:
    paths:
      - 'cycle944/**'
      - '.github/workflows/cycle944-caption-voice-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Run unit tests including ten genre configurations
        run: python -m unittest discover -s cycle944/tests -v
      - name: Syntax check
        run: python -m py_compile cycle944/src/caption_voice_guard.py
# Private MP4 is not uploaded or rendered in CI.
