name: cycle535 synthetic comparison regression
on:
  push:
    branches:
      - 'quality/cycle535-*'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install pillow
      - name: Verify 10 genres and safety gates
        run: |
          cd quality/cycle535
          python -m unittest -v test_contrast_scene.py
      - name: No publication
        run: echo "QA=HUMAN_REVIEW; PUBLICATION=NOT_APPROVED; voice unverified"
