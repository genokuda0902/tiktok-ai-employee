name: Cycle486 Review-Only Quality Gates
on:
  pull_request:
    paths:
      - 'quality/cycle486/**'
      - 'tests/test_cycle486_*.py'
  workflow_dispatch:
jobs:
  review-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install pillow
      - name: Run genre-neutral gates and renderer regression tests
        run: |
          python -m unittest discover -s tests -p 'test_cycle486_storyboard.py' -v
          python -m unittest discover -s tests -p 'test_cycle486_renderer.py' -v
