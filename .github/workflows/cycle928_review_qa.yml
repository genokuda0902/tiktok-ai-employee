name: cycle928 review-only animated hook QA
on:
  pull_request:
    paths:
      - 'cycle928/**'
      - '.github/workflows/cycle928_review_qa.yml'
  workflow_dispatch:
jobs:
  review-only-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Ten-genre review-only visual tests
        run: python -m unittest discover -s cycle928/tests -p 'test_*.py' -v
      - name: Fail closed on private media and publication
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle928/src/hero_hook.py
          test ! -e cycle928/output
          test ! -e cycle928/private
