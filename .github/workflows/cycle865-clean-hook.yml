name: cycle865 clean hook quality gates
on:
  push:
    branches: [automation/cycle865-clean-hook-20261026]
    paths:
      - 'cycle865/**'
      - '.github/workflows/cycle865-clean-hook.yml'
  pull_request:
    paths:
      - 'cycle865/**'
      - '.github/workflows/cycle865-clean-hook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-synthetic-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies and bundled FFmpeg
        run: python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Test ten genre hooks, nonoverlap, safe captions and fail-closed policy
        run: PYTHONPATH=cycle865 python -m unittest discover -s cycle865 -p 'test_*.py' -v
      - name: Smoke test synthetic H264/AAC (NOT private Japanese video)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x152f4e:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle865_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle865_synthetic.mp4 -f null -
