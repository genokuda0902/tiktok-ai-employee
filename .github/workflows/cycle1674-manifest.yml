name: cycle1674 manifest quality
on:
  pull_request:
    paths:
      - 'quality/cycle1674_manifest_gate.py'
      - 'tests/test_cycle1674_manifest_gate.py'
      - '.github/workflows/cycle1674-manifest.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cycle1674_manifest_gate.py' -v
