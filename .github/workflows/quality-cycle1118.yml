name: Quality cycle1118 optional Japanese captions (synthetic only)
on:
  push:
    paths:
      - 'quality/cycle1118/**'
      - '.github/workflows/quality-cycle1118.yml'
  pull_request:
    paths:
      - 'quality/cycle1118/**'
      - '.github/workflows/quality-cycle1118.yml'
  workflow_dispatch:
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free offline ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Ten genre caption rules and synthetic MP4 mux
        run: python -m unittest discover -s quality/cycle1118 -p 'test_*.py' -v
