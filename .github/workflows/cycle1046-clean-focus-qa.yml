name: cycle1046 clean focus synthetic QA
on:
  push:
    branches:
      - automation/cycle1046-clean-task-focus-20261031
  pull_request:
    paths:
      - 'cycle1046/**'
      - '.github/workflows/cycle1046-clean-focus-qa.yml'
permissions:
  contents: read
jobs:
  offline-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free tools and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Test 10 genres and fail-closed gates
        run: python -m unittest discover -s cycle1046/tests -p 'test_*.py' -v
      - name: Synthetic 1-second video overlay and A/V decode (no private media)
        run: |
          mkdir -p /tmp/cycle1046frames
          python - <<'PY'
          import sys
          sys.path.insert(0,'cycle1046/source')
          from focus_cards import make_frame
          for n in range(15):
              make_frame(n, width=540, height=800).save(f'/tmp/cycle1046frames/{n:03d}.png')
          PY
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x071322:s=540x960:r=15:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -t 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/cycle1046_base.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/cycle1046_base.mp4 -framerate 15 -i /tmp/cycle1046frames/%03d.png -filter_complex '[0:v][1:v]overlay=0:0:shortest=1[v]' -map '[v]' -map '0:a:0' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a copy /tmp/cycle1046_smoke.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1046_smoke.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json /tmp/cycle1046_smoke.mp4
