name: cycle890 offline UI cues QA
on:
  pull_request:
    paths:
      - 'cycle890/**'
      - '.github/workflows/cycle890-offline-cues.yml'
  workflow_dispatch:
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ten-genre common cue engine
        run: python -m unittest discover -s cycle890/tests -v
      - name: Generate deterministic 2-second test WAV
        run: python cycle890/src/sfx_generator.py --out /tmp/cycle890.wav --duration 2 --cuts 0.7,1.4 --clicks 0.9
      - name: Verify audio file with ffprobe
        run: |
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 /tmp/cycle890.wav
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 /tmp/cycle890.wav)" = "48000"
      - name: Encode and decode synthetic video with cues (not final MP4)
        run: |
          ffmpeg -hide_banner -loglevel error -xerror -f lavfi -i color=c=0x132a48:s=1080x1920:r=30:d=2 -i /tmp/cycle890.wav -map 0:v -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle890_ci.mp4
          ffmpeg -hide_banner -loglevel error -xerror -i /tmp/cycle890_ci.mp4 -f null -
