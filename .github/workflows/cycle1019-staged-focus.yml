name: cycle1019-staged-focus
on:
  pull_request:
    paths:
      - "quality/cycle1019/**"
      - ".github/workflows/cycle1019-staged-focus.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-synthetic-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source image dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run safety and genre tests
        run: python -m unittest discover -s quality/cycle1019 -p 'test_*.py' -v
      - name: Render synthetic two-second 1080x1920 MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle1019
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=0x111827:s=1080x1920:r=30:d=2" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=2" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -r 30 \
            -c:a aac -ar 48000 -t 2 /tmp/cycle1019/input.mp4
          python quality/cycle1019/scene_focus.py \
            /tmp/cycle1019/input.mp4 /tmp/cycle1019/output.mp4 \
            --start 0.3 --end 1.6 --genre ai_work
          ffmpeg -hide_banner -loglevel error -i /tmp/cycle1019/output.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,nb_read_frames \
            -of csv=p=0 /tmp/cycle1019/output.mp4 | grep -Fx '1080,1920,60'
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/cycle1019/output.mp4)" = "aac"
