name: cycle1219-silence-tail-pacing-review
on:
  push:
    branches: [quality/cycle1219-silence-tail-pacing]
  pull_request:
    paths:
      - 'quality/cycle1219/**'
      - '.github/workflows/cycle1219-silence-tail-pacing.yml'
  workflow_dispatch:
jobs:
  synthetic-silence-pacing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1219/tests -p 'test_*.py' -v
      - name: Synthetic 3-second A/V pacing and full decode
        run: python quality/cycle1219/tests/ci_smoke.py
