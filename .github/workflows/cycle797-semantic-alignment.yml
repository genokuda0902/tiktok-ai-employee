name: cycle797 semantic alignment and technical smoke
on:
  pull_request:
    paths:
      - 'quality/cycle797/**'
      - '.github/workflows/cycle797-semantic-alignment.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scene/subtitle/genre tests
        run: cd quality/cycle797 && python -m unittest -v test_semantic_contract.py
      - name: Install free bundled FFmpeg
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
          python - <<'PY'
          import imageio_ffmpeg, os
          os.symlink(imageio_ffmpeg.get_ffmpeg_exe(), '/tmp/ffmpeg')
          with open(os.environ['GITHUB_PATH'], 'a') as f:
              f.write('/tmp\n')
          PY
      - name: Create synthetic 1080x1920 smoke MP4 (not finished Japanese video)
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x081c2e:s=1080x1920:r=30:d=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/cycle797_technical_only.mp4
          ffmpeg -v error -xerror -i /tmp/cycle797_technical_only.mp4 -f null -
          test -s /tmp/cycle797_technical_only.mp4
      - name: Upload synthetic technical video only
        uses: actions/upload-artifact@v4
        with:
          name: cycle797-synthetic-technical-only
          path: /tmp/cycle797_technical_only.mp4
          retention-days: 7
