name: cycle873 clean workflow scene (review only)
on:
  push:
    branches: [automation/cycle873-clean-workflow-20261027]
    paths:
      - 'cycle873/**'
      - '.github/workflows/cycle873-clean-workflow.yml'
  pull_request:
    paths:
      - 'cycle873/**'
      - '.github/workflows/cycle873-clean-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Run 11 offline layout and safety tests
        run: PYTHONPATH=cycle873 python -m unittest discover -s cycle873 -p 'test_*.py' -v
      - name: Synthetic one-second video/audio decode (NOT the private Japanese MP4)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x123456:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle873_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle873_synthetic.mp4 -f null -
