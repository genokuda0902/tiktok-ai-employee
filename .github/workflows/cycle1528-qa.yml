name: Cycle 1528 QA tests
on:
  pull_request:
    paths:
      - 'quality/cycle1528/**'
      - '.github/workflows/cycle1528-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1528 -p 'test_*.py' -v
