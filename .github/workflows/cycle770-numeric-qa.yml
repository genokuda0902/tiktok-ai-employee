name: cycle770 verified numeric QA
on:
  push:
    branches: [quality/cycle770-ci-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install Pillow
      - run: python quality/cycle770/test_numeric_contract.py
