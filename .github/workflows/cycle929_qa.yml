name: cycle929 keyword ribbon review-only QA
on:
  pull_request:
    paths:
      - 'cycle929/**'
      - '.github/workflows/cycle929_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Pillow dependency
        run: python -m pip install Pillow
      - name: Run renderer tests
        run: python -m unittest discover -s cycle929/tests -p 'test_*.py' -v
      - name: Fail closed - no private video or auto-post
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle929/src/keyword_ribbon.py
          test ! -e cycle929/output
