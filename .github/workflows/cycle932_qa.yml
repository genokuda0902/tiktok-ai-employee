name: cycle932 real Calc scene QA (review only)
on:
  pull_request:
    paths:
      - 'cycle932/**'
      - '.github/workflows/cycle932_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Pillow and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13'
      - name: Unit tests on synthetic images only
        run: python -m unittest discover -s cycle932/tests -p 'test_*.py' -v
      - name: Guard publication and private media
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle932/src/calc_live_insert.py
          test ! -e cycle932/output
          test ! -e cycle932/private
          ! find cycle932 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.xlsx' \) | grep .
