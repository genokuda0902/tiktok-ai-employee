name: Cycle719 Review QA and Japanese TTS
on:
  push:
    branches:
      - quality/cycle719-visual-proof-tts-recovery-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_cycle719.py -v
  japanese-tts-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost local Kokoro TTS
        run: |
          python -m pip install "kokoro>=0.9.4" "misaki[ja]" soundfile numpy unidic
          python -m unidic download
      - name: Generate Japanese review audio
        run: python src/cycle719_tts.py
      - name: Upload review-only audio
        uses: actions/upload-artifact@v4
        with:
          name: cycle719-japanese-voice-review
          path: output/cycle719_tts/
          if-no-files-found: error
          retention-days: 7
