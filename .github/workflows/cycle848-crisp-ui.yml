name: cycle848 crisp UI cuts review-only CI
on:
  pull_request:
    paths:
      - 'cycle848/**'
      - '.github/workflows/cycle848-crisp-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-purchase dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Ten offline unit tests
        run: |
          python -m compileall -q cycle848
          PYTHONPATH=cycle848 python -m unittest discover -s cycle848 -p 'test_*.py' -v
      - name: Synthetic H264 AAC end-to-end review only
        run: |
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1080x1920:r=30:d=1.5 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1.5 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -c:a aac -shortest /tmp/c848_source.mp4
          PYTHONPATH=cycle848 python - <<'PY'
          from pathlib import Path
          from ui_transition_clarity import render,sha256,POLICY
          src=Path('/tmp/c848_source.mp4')
          out=Path('/tmp/c848_review.mp4')
          q=render(src,out,{**POLICY,'source_sha256':sha256(src)},'ai_work',(22,),10)
          assert q['frames']==45 and len(q['modified_frames'])==21
          assert q['full_av_decode'] and q['publication_approved'] is False
          print('SYNTHETIC_REVIEW_PASS',q['output_sha256'])
          PY
          ffmpeg -v error -y -i /tmp/c848_source.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c848_before.aac
          ffmpeg -v error -y -i /tmp/c848_review.mp4 -map 0:a:0 -c:a copy -f adts /tmp/c848_after.aac
          cmp /tmp/c848_before.aac /tmp/c848_after.aac
