name: Automation Engine Unit Tests
on:
  push:
    branches: [feature/automation-engine-isolated]
  pull_request:
    paths:
      - 'src/automation_engine.py'
      - 'tests/test_automation_engine.py'
      - '.github/workflows/automation-engine-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run isolated tests
        run: python -m unittest discover -s tests -p 'test_automation_engine.py' -v
