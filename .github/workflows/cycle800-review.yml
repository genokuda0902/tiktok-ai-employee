name: cycle800 storyboard chart review CI
on:
  push:
    branches: ['quality/cycle800-*']
    paths:
      - 'quality/cycle800/**'
      - '.github/workflows/cycle800-review.yml'
  pull_request:
    paths:
      - 'quality/cycle800/**'
      - '.github/workflows/cycle800-review.yml'
permissions:
  contents: read
jobs:
  synthetic-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg >/dev/null
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle800 -p 'test_*.py' -v
      - name: Original synthetic-tone MP4 (NOT Japanese narration)
        run: |
          mkdir -p review_output/cycle800
          python quality/cycle800/chart_scene.py --config quality/cycle800/config.json --segment review_output/cycle800/chart_VIDEO_ONLY.mp4
          ffmpeg -hide_banner -loglevel error -y -i review_output/cycle800/chart_VIDEO_ONLY.mp4 -f lavfi -i 'sine=frequency=440:duration=3.2:sample_rate=48000' -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 96k -shortest review_output/cycle800/chart_SYNTHETIC_TONE_NOT_JAPANESE.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -of json review_output/cycle800/chart_SYNTHETIC_TONE_NOT_JAPANESE.mp4
          ffmpeg -v error -i review_output/cycle800/chart_SYNTHETIC_TONE_NOT_JAPANESE.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: cycle800-chart-SYNTHETIC-TONE-NOT-JAPANESE
          path: review_output/cycle800/chart_SYNTHETIC_TONE_NOT_JAPANESE.mp4
          retention-days: 7
