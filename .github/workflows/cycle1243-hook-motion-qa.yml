name: cycle1243 opening hook synthetic QA
on:
  push:
    branches:
      - quality/cycle1243-opening-hook-motion
  pull_request:
    paths:
      - 'cycle1243/**'
      - '.github/workflows/cycle1243-hook-motion-qa.yml'
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free CJK font and FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Unit tests
        run: python3 -m unittest discover -s cycle1243/tests -p 'test_*.py' -v
      - name: Synthetic 2-second render and full decode
        run: python3 cycle1243/tests/ci_smoke.py
