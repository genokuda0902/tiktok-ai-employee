name: Cycle1634 caption timing gate
on:
  pull_request:
    paths:
      - 'quality/cycle1634/**'
      - '.github/workflows/cycle1634-caption-qa.yml'
  workflow_dispatch:
jobs:
  captions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: cd quality/cycle1634 && python -m unittest discover -p 'test_*.py' -v
