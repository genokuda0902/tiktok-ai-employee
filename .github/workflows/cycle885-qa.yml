name: cycle885-kinetic-task-cards-review-qa
on:
  push:
    paths:
      - 'video_engine/cycle885/**'
      - '.github/workflows/cycle885-qa.yml'
  pull_request:
    paths:
      - 'video_engine/cycle885/**'
      - '.github/workflows/cycle885-qa.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test dependencies
        run: python -m pip install 'pillow==11.3.0' 'imageio-ffmpeg==0.6.0'
      - name: Unit tests
        run: python -m unittest discover -s video_engine/cycle885 -p 'test_*.py' -v
      - name: Synthetic A/V render and decode
        run: |
          mkdir -p .ci_bin
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" .ci_bin/ffmpeg
          export PATH="$PWD/.ci_bin:$PATH"
          python video_engine/cycle885/ci_smoke.py
      - name: Reject private media and review manifests in repository
        run: |
          if find video_engine/cycle885 -type f \( -name '*.mp4' -o -name '*.wav' -o -name '*.png' -o -name '*.json' \) | grep .; then
            echo 'Private media/manifest forbidden'
            exit 1
          fi
