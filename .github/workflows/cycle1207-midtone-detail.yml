name: cycle1207-midtone-detail
on:
  pull_request:
    paths:
      - 'quality/cycle1207/**'
      - '.github/workflows/cycle1207-midtone-detail.yml'
  workflow_dispatch:
jobs:
  quality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1207/tests -p 'test_*.py' -v
      - name: Synthetic H264/AAC render and decode
        run: python quality/cycle1207/tests/ci_smoke.py
