name: cycle1227-slide-detail-review
on:
  push:
    branches: [quality/cycle1227-slide-detail]
  pull_request:
    paths:
      - 'quality/cycle1227/**'
      - '.github/workflows/cycle1227-slide-detail.yml'
  workflow_dispatch:
jobs:
  offline-detail-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg (free system package)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1227/tests -p 'test_*.py' -v
      - name: Synthetic 1080x1920 A/V smoke
        run: python quality/cycle1227/tests/ci_smoke.py
