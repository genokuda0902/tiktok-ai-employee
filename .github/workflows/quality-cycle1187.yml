name: quality-cycle1187-jp-voice-presence
on:
  pull_request:
    paths:
      - "tools/quality_cycle1187/**"
      - ".github/workflows/quality-cycle1187.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-voice-eq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Unit tests
        run: python -m unittest discover -s tools/quality_cycle1187 -p "test_*.py" -v
      - name: Synthetic render and full decode (no private voice/video)
        run: python tools/quality_cycle1187/ci_smoke.py
