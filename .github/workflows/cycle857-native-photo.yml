name: cycle857 native photo and voice-beat tests
on:
  pull_request:
    paths:
      - 'quality/cycle857/**'
      - '.github/workflows/cycle857-native-photo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-photo-beat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image dependency
        run: python -m pip install Pillow
      - name: Run native-photo and narration-timing regression tests
        run: |
          cd quality/cycle857
          python -m unittest -v test_scene_timing_core
