name: Cycle 1388 caption gate
on:
  pull_request:
    paths:
      - 'experiments/cycle1388/**'
      - '.github/workflows/cycle1388-caption-gate.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s experiments/cycle1388 -p 'test_*.py' -v
