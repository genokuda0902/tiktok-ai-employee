name: cycle920 audio-camera review-only QA
on:
  push:
    paths:
      - 'review_cycles/cycle920/**'
      - '.github/workflows/cycle920_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle920/**'
      - '.github/workflows/cycle920_review_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline camera and policy tests (no paid dependencies)
        run: python3 -m unittest discover -s review_cycles/cycle920 -p 'test_*.py' -v
      - name: Reject inherited/private media and secrets
        run: |
          if find review_cycles/cycle920 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.env' \) | grep -q .; then
            echo "Private media or credentials prohibited" >&2
            exit 1
          fi
