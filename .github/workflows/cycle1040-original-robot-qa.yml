name: cycle1040 original robot intro synthetic QA
on:
  push:
    branches:
      - automation/cycle1040-original-robot-intro-20261031
  pull_request:
    paths:
      - 'cycle1040/**'
      - '.github/workflows/cycle1040-original-robot-qa.yml'
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install free video tools and Japanese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Unit tests for original art, ten genre palettes, and fail-closed input
        run: python -m unittest discover -s cycle1040/tests -p 'test_*.py' -v
      - name: Synthetic 2s H264/AAC full decode (not user media)
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x08172c:s=270x480:r=30:d=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/cycle1040_synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1040_synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json /tmp/cycle1040_synthetic.mp4
