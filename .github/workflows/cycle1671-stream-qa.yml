name: cycle1671-stream-qa
on:
  pull_request:
    paths:
      - 'quality/cycle1671_stream_qa.py'
      - 'tests/test_cycle1671_stream_qa.py'
      - '.github/workflows/cycle1671-stream-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_cycle1671_stream_qa.py' -v
