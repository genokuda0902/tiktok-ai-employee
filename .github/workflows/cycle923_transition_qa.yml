name: cycle923 review-only scene transition tests
on:
  push:
    paths:
      - 'cycle923/**'
      - '.github/workflows/cycle923_transition_qa.yml'
  pull_request:
    paths:
      - 'cycle923/**'
      - '.github/workflows/cycle923_transition_qa.yml'
  workflow_dispatch:
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no private media or network)
        run: python -m unittest discover -s cycle923/tests -p 'test_*.py' -v
      - name: Confirm review-only safety
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle923/src/scene_wipe.py
          test ! -e cycle923/output
