name: Cycle618 Tests
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pillow opencv-python-headless
      - run: python -m unittest discover -s quality/cycle618 -p 'test_*.py' -v
