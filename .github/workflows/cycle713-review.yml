name: Cycle713 prompt QA (review only)
on:
  push:
    branches:
      - quality/cycle713-typed-prompt-review-20261020
  workflow_dispatch:
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free test dependencies
        run: python -m pip install Pillow pytest
      - name: Verify prompt typing and send gate
        run: python -m pytest quality/cycle713/test_prompt.py -q
