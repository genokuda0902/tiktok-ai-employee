name: cycle1111 safe-area Japanese caption offline QA
on:
  push:
    branches:
      - quality/cycle1111-safe-caption-zone-20261031
  pull_request:
    paths:
      - 'cycle1111/**'
      - '.github/workflows/cycle1111-safe-caption.yml'
permissions:
  contents: read
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install offline free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Unit tests / ten genre configurations
        run: python -m unittest discover -s cycle1111/tests -v
      - name: Synthetic 2-second H264 AAC render (NOT user media)
        run: |
          ffmpeg -v error -y -f lavfi -i color=c=0x06172a:s=1080x1920:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/input.mp4
          python cycle1111/code/safe_caption.py /tmp/input.mp4 /tmp/output.mp4 --duration 2
          ffmpeg -v error -xerror -i /tmp/output.mp4 -f null -
          python - <<'PY'
          import json,subprocess
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-count_frames',
            '-show_entries','stream=codec_type,codec_name,width,height,nb_read_frames',
            '-of','json','/tmp/output.mp4']))
          v=next(x for x in p['streams'] if x['codec_type']=='video')
          a=next(x for x in p['streams'] if x['codec_type']=='audio')
          assert v['codec_name']=='h264' and (v['width'],v['height'])==(1080,1920)
          assert int(v['nb_read_frames'])==60 and a['codec_name']=='aac'
          print('PASS synthetic 1080x1920 / 60 frames / H264 AAC / full decode')
          PY
