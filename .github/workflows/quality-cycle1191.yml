name: quality-cycle1191-soft-cuts
on:
  pull_request:
    paths:
      - 'tools/quality_cycle1191/**'
      - '.github/workflows/quality-cycle1191.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-soft-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5'
      - name: Unit tests
        run: python -m unittest discover -s tools/quality_cycle1191/tests -p 'test_*.py' -v
      - name: Synthetic full render/decode
        run: python tools/quality_cycle1191/tests/ci_smoke.py
