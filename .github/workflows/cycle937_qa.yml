name: cycle937 caption-synced template microcuts QA (review only)
on:
  pull_request:
    paths:
      - 'cycle937/**'
      - '.github/workflows/cycle937_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-microcut-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Japanese fonts and Python libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Run 20 synthetic tests (no private media)
        run: PYTHONPATH=cycle937/src python -m unittest discover -s cycle937/tests -p 'test_*.py' -v
      - name: Fail closed on private media and publication
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle937/src/template_detail_microcuts.py
          test ! -e cycle937/output
          test ! -e cycle937/private
          ! find cycle937 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.xlsx' \) | grep .
