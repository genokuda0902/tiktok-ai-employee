name: cycle752 tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy opencv-python-headless pytest
      - run: pytest -q experiments/cycle752/test_cycle752.py
