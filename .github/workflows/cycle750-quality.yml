name: cycle750 image-slide quality
on:
  push:
    branches:
      - 'quality/cycle750-*'
  pull_request:
    paths:
      - 'experiments/cycle750/**'
      - '.github/workflows/cycle750-quality.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s experiments/cycle750/tests -v
