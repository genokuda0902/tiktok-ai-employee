name: cycle1535-chapter-cues
on:
  pull_request:
    paths:
      - 'quality/cycle1535/**'
      - '.github/workflows/cycle1535-chapter-cues.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd quality/cycle1535 && python -m unittest -v test_chapter_overlay.py
