name: cycle919 emotional before-after review-only QA
on:
  push:
    paths:
      - 'review_cycles/cycle919/**'
      - '.github/workflows/cycle919_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle919/**'
      - '.github/workflows/cycle919_review_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline syntax and safety checks
        run: python3 -m unittest discover -s review_cycles/cycle919 -p 'test_policy.py' -v
      - name: Reject private media
        run: |
          if find review_cycles/cycle919 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | grep -q .; then
            echo "Private media prohibited" >&2
            exit 1
          fi
