name: cycle625-audio-headroom
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle625/**'
      - '.github/workflows/cycle625-audio-headroom.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: cd quality_cycles/cycle625 && python -m pytest -q test_master_audio.py
