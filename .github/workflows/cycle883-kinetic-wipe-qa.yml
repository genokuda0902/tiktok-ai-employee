name: cycle883 kinetic transition QA (synthetic only)
on:
  push:
    paths:
      - "video_engine/cycle883/**"
      - ".github/workflows/cycle883-kinetic-wipe-qa.yml"
  pull_request:
    paths:
      - "video_engine/cycle883/**"
      - ".github/workflows/cycle883-kinetic-wipe-qa.yml"
permissions:
  contents: read
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free offline dependencies
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test ten genres and fail-closed safety
        run: python -m unittest discover -s video_engine/cycle883 -p "test_*.py" -v
      - name: Synthetic 90-frame H264/AAC render and decode
        run: python video_engine/cycle883/ci_smoke.py
      - name: No review media in git
        run: |
          if git ls-files video_engine/cycle883 | grep -Ei '\.(mp4|aac|wav|png|jpg|zip)$'; then
            echo "Private media must not be committed"
            exit 1
          fi
