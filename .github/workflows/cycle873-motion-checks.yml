name: cycle873 motion checks
on:
  pull_request:
    paths:
      - 'experiments/cycle873/**'
      - '.github/workflows/cycle873-motion-checks.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run cycle873 tests
        run: python -m pytest -q experiments/cycle873/test_motion_core.py
