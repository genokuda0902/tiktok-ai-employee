name: cycle1156-source-proof-review
on:
  push:
    branches: [quality/cycle1156-source-proof]
  pull_request:
    paths:
      - 'quality/cycle1156/**'
      - '.github/workflows/cycle1156-proof-story.yml'
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open source dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install pillow==11.1.0
      - name: Unit tests for ten genres, arithmetic and fail-closed policy
        env:
          PYTHONPATH: quality/cycle1156
        run: python -m unittest discover -s quality/cycle1156/tests -p 'test_*.py' -v
      - name: Render and full decode synthetic 1080x1920 H264/AAC MP4
        env:
          PYTHONPATH: quality/cycle1156
        run: python quality/cycle1156/tests/ci_smoke.py
