name: cycle916 source-diff review-only QA
on:
  push:
    paths:
      - 'review_cycles/cycle916/**'
      - '.github/workflows/cycle916_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle916/**'
      - '.github/workflows/cycle916_review_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify code, 10 genres, privacy and review-only gate
        run: python3 -m unittest discover -s review_cycles/cycle916 -p 'test_offline_policy.py' -v
      - name: Reject private media from source tree
        run: |
          if find review_cycles/cycle916 -type f \( -iname '*.mp4' -o -iname '*.jpg' -o -iname '*.png' -o -iname '*.aac' -o -iname '*.wav' \) | grep -q .; then
            echo "Private media is forbidden" >&2
            exit 1
          fi
