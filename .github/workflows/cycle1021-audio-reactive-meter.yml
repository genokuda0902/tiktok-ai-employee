name: cycle1021-audio-reactive-meter
on:
  pull_request:
    paths:
      - "quality/cycle1021/**"
      - ".github/workflows/cycle1021-audio-reactive-meter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-synthetic-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run 6 local-only tests
        run: python -m unittest discover -s quality/cycle1021/tests -p 'test_*.py' -v
      - name: Synthetic two-second MP4 (not user media)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle1021
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=0x071322:s=1080x1920:r=30:d=2" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=2" \
            -c:v libx264 -preset ultrafast -threads 2 -pix_fmt yuv420p -r 30 \
            -c:a aac -ar 48000 -t 2 /tmp/cycle1021/input.mp4
          python quality/cycle1021/code/voice_meter.py \
            /tmp/cycle1021/input.mp4 /tmp/cycle1021/output.mp4 --genre ai_work
          ffmpeg -hide_banner -loglevel error -xerror -i /tmp/cycle1021/output.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,nb_read_frames \
            -of csv=p=0 /tmp/cycle1021/output.mp4 | grep -Fx '1080,1920,60'
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/cycle1021/output.mp4)" = "aac"
          test "$(ffmpeg -v error -i /tmp/cycle1021/input.mp4 -map 0:a:0 -c copy -f hash -hash sha256 -)" = "$(ffmpeg -v error -i /tmp/cycle1021/output.mp4 -map 0:a:0 -c copy -f hash -hash sha256 -)"
          echo "SYNTHETIC_RENDER_AND_AUDIO_COPY_PASS"
