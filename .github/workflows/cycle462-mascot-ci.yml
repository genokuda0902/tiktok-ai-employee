name: Cycle462 mascot geometry tests
on:
  push:
    branches:
      - quality/cycle462-original-mascot-contract
  pull_request:
    paths:
      - 'quality/cycle462/**'
jobs:
  test-mascot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent geometry tests
        run: |
          python -m pip install pytest
          python -m pytest -q quality/cycle462/test_mascot_contract.py
