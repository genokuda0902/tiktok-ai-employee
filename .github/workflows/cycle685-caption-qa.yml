name: Cycle685 caption and original BGM QA (review only)
on:
  pull_request:
    paths:
      - 'quality/cycle685/**'
      - '.github/workflows/cycle685-caption-qa.yml'
  workflow_dispatch:
jobs:
  caption-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0 numpy==2.3.3
      - run: cd quality/cycle685 && python -m unittest discover -p 'test_*.py' -v
