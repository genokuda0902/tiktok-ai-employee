name: Cycle1446 review gate tests
on:
  pull_request:
    paths:
      - 'quality/cycle1446/**'
      - '.github/workflows/cycle1446-review.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd quality/cycle1446 && python -m unittest -v test_review_gate.py
