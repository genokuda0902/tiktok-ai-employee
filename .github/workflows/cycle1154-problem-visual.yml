name: cycle1154-problem-visual-review
on:
  push:
    branches: [quality/cycle1154-problem-visual]
  pull_request:
    paths:
      - 'quality/cycle1154/**'
      - '.github/workflows/cycle1154-problem-visual.yml'
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source render dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install pillow==11.1.0
      - name: Ten-genre and safety tests
        env:
          PYTHONPATH: quality/cycle1154
        run: python -m unittest discover -s quality/cycle1154/tests -p 'test_*.py' -v
      - name: Synthetic MP4 A/V render and decode
        env:
          PYTHONPATH: quality/cycle1154
        run: python quality/cycle1154/tests/ci_smoke.py
