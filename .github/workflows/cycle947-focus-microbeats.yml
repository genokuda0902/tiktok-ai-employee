name: cycle947 focus microbeats review-only QA
on:
  push:
    branches: ['automation/cycle947-*']
  pull_request:
    paths:
      - 'cycle947/**'
      - '.github/workflows/cycle947-focus-microbeats.yml'
permissions:
  contents: read
jobs:
  microbeat-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest
      - name: Test ten-genre focus logic and protected Japanese subtitles
        run: python -m pytest -q cycle947/tests/test_focus_microbeats.py
      - name: Block private media and posting code
        run: |
          if find cycle947 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.png' -o -iname '*.jpg' \) | grep -q .; then
            echo 'Private media cannot be committed'; exit 1
          fi
          if grep -R -E 'tiktok\.upload|publish_video\(' cycle947/src/; then
            echo 'Automatic posting forbidden'; exit 1
          fi
