name: cycle885-caption-legibility
on:
  pull_request:
    paths:
      - "quality/cycle885/**"
      - ".github/workflows/cycle885-caption-legibility.yml"
  workflow_dispatch:
jobs:
  caption-fit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (no paid APIs, no posting)
        run: python -m unittest discover -s quality/cycle885 -p 'test_*.py' -v
