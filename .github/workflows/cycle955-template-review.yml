name: cycle955 template scene synthetic QA
on:
  push:
    paths:
      - 'cycle955/**'
      - '.github/workflows/cycle955-template-review.yml'
  pull_request:
    paths:
      - 'cycle955/**'
      - '.github/workflows/cycle955-template-review.yml'
permissions:
  contents: read
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy<3' pillow opencv-python-headless pytest
      - name: Install Noto CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Run synthetic scene tests
        run: python -m pytest -q cycle955/test_template_scene.py
      - name: Reject private media in public repository
        run: |
          if git ls-files cycle955 | grep -E '\.(mp4|m4a|wav|png|jpg|jpeg)$|private_manifest'; then
            echo 'Private media in repository: rejected'; exit 1
          fi
          echo 'Source and tests only'
