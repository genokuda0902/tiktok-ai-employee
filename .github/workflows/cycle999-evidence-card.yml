name: cycle999 concrete revision card QA
on:
  pull_request:
    paths:
      - 'tools/quality/cycle999_evidence_card.py'
      - 'tests/test_cycle999_evidence_card.py'
      - '.github/workflows/cycle999-evidence-card.yml'
  workflow_dispatch:
jobs:
  synthetic-media-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install Pillow
      - name: Run 10 deterministic template and safe-area tests
        run: python -m unittest discover -s tests -p 'test_cycle999_evidence_card.py' -v
      - name: Render and decode synthetic one-second vertical H264/AAC
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x112233:s=1080x1920:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/source.mp4
          python -c "from pathlib import Path; from tools.quality.cycle999_evidence_card import render; render(Path('/tmp/source.mp4'),Path('/tmp/output.mp4'),start=.2,end=.8)"
          ffmpeg -hide_banner -loglevel error -xerror -i /tmp/output.mp4 -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/output.mp4)" = '1080,1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 /tmp/output.mp4)" = '30'
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 /tmp/output.mp4)" = 'aac'
          ffmpeg -hide_banner -loglevel error -ss 0.5 -i /tmp/output.mp4 -frames:v 1 /tmp/frame.png
          python -c "from PIL import Image; im=Image.open('/tmp/frame.png'); assert im.size==(1080,1920); assert im.getpixel((500,800)) != (17,34,51)"
