name: cycle1488 delivery QA
on:
  pull_request:
    paths:
      - 'tools/delivery_qa.py'
      - 'tests/test_delivery_qa_cycle1488.py'
      - '.github/workflows/cycle1488-delivery-qa.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_delivery_qa_cycle1488.py' -v
