name: cycle944 original ambient review-only QA
on:
  push:
    branches: ['automation/cycle944-*']
  pull_request:
    paths:
      - 'cycle944/**'
      - '.github/workflows/cycle944-review-qa.yml'
permissions:
  contents: read
jobs:
  ambient-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free QA dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Test original ambient generation and ten genre safety
        run: python -m pytest -q cycle944/tests/test_voice_first_ambience.py
      - name: Block private media and auto-posting
        run: |
          if find cycle944 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.m4a' -o -iname '*.png' -o -iname '*.jpg' \) | grep -q .; then
            echo 'Private media cannot be committed'; exit 1
          fi
          if grep -R -E 'tiktok\.upload|publish_video\(' cycle944/src/; then
            echo 'Posting code forbidden'; exit 1
          fi
