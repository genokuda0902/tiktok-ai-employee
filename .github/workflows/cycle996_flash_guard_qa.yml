name: cycle996 scene flash-guard synthetic QA
on:
  push:
    branches:
      - 'automation/cycle996-*'
    paths:
      - 'cycle996/**'
      - '.github/workflows/cycle996_flash_guard_qa.yml'
  pull_request:
    paths:
      - 'cycle996/**'
      - '.github/workflows/cycle996_flash_guard_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline video QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'numpy>=2,<3' 'opencv-python-headless>=4.10,<5'
      - name: Test ten-genre gate and protected subtitle ROI
        run: python -m unittest discover -s cycle996 -p 'test_*.py' -v
      - name: Generate synthetic-only Japanese-captioned MP4 and verify A/V
        run: python cycle996/ci_synthetic.py
