name: cycle940 finished-example synthetic review QA
on:
  push:
    branches:
      - 'automation/cycle940-*'
  pull_request:
    paths:
      - 'cycle940/**'
      - '.github/workflows/cycle940-finished-example-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CJK fonts and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow pytest
      - name: Test 10 genre configurations, timing and fail-closed policy
        run: python -m pytest -q cycle940/tests/test_finished_example_focus.py
      - name: Prevent accidental private media uploads
        run: |
          if find cycle940 -type f \( -iname '*.mp4' -o -iname '*.aac' -o -iname '*.wav' -o -iname '*.png' -o -iname '*.jpg' \) | grep -q .; then
            echo "Private media must not be committed"; exit 1
          fi
          if grep -R -E 'TikTok.*(upload|publish)|auto.post' cycle940/src/; then
            echo "Unexpected automatic posting path"; exit 1
          fi
