name: cycle1012 review-only synthetic QA

on:
  push:
    branches:
      - 'automation/cycle1012-*'
  pull_request:
    paths:
      - 'cycle1012/**'
      - '.github/workflows/cycle1012_review.yml'

permissions:
  contents: read

jobs:
  synthetic-review-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free FFmpeg, ffprobe and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Install free local Python dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Run ten-genre review-gate unit tests
        run: python -m unittest discover -s cycle1012/tests -p 'test_*.py' -v
      - name: Generate and decode synthetic video with audio
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=360x640:rate=30:duration=2' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=2' \
            -map 0:v -map 1:a -c:v libx264 -pix_fmt yuv420p -r 30 \
            -c:a aac -ar 48000 -metadata:s:a:0 language=jpn \
            -movflags +faststart -shortest /tmp/synthetic.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,sample_rate -of json /tmp/synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/synthetic.mp4 -f null -
      - name: Confirm synthetic-only policy
        run: |
          test ! -f cycle1012/output/cycle1012_SAVE_CTA_JP_REVIEW_ONLY.mp4
          echo 'No private reference, narration, or review MP4 uploaded.'
