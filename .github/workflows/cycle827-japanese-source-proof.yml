name: cycle827 Japanese source-to-output proof review MP4
on:
  push:
    branches:
      - 'quality/cycle827-*'
  pull_request:
    paths:
      - 'quality/cycle827/**'
      - '.github/workflows/cycle827-japanese-source-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline no-cost tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Test ten-genre source-proof component
        run: python -m unittest discover -s quality/cycle827 -p 'test_*.py' -v
      - name: Prepare original fictional AI-work scenes
        run: python quality/cycle823/cycle823_ci.py --root _cycle827_ci --step prepare
      - name: Generate offline Japanese voice and attribution
        run: python quality/cycle819/make_japanese_fixture819.py --root _cycle827_ci
      - name: Render base Japanese voice and subtitles
        run: |
          python quality/cycle823/cycle823_ci.py --root _cycle827_ci --step render
          python quality/cycle823/cycle823_ci.py --root _cycle827_ci --step verify
      - name: Fail closed on script/caption mismatch
        run: python quality/cycle825/audit825.py --root _cycle827_ci --report _cycle827_ci/output/script_caption_audit825.json
      - name: Create review-only asset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_cycle827_ci/review_asset.json')
          p.write_text(json.dumps({'origin':'procedural_original','review_allowed':True,
            'private_data':False,'publication_approved':False,
            'notes':'Fictional scene; public release not approved'}))
          PY
      - name: Build image-led base
        run: |
          python quality/cycle825/image_scene825.py \
            --source _cycle827_ci/output/cycle823_UI_DEMO_JAPANESE_HUMAN_REVIEW.mp4 \
            --image _cycle827_ci/source/scene_03.png \
            --manifest _cycle827_ci/review_asset.json \
            --output _cycle827_ci/output/cycle825_AI_WORK_IMAGE_LED_JAPANESE_REVIEW_ONLY.mp4 \
            --genre ai_work --start 6.47 --duration 2.98
      - name: Build animated Japanese prompt demo
        run: |
          python quality/cycle826/interaction826.py \
            --source _cycle827_ci/output/cycle825_AI_WORK_IMAGE_LED_JAPANESE_REVIEW_ONLY.mp4 \
            --output _cycle827_ci/output/cycle826_AI_WORK_LIVE_PROMPT_JAPANESE_REVIEW_ONLY.mp4 \
            --genre ai_work --report _cycle827_ci/output/qa826.json
      - name: Add source-to-output proof animation
        run: |
          python quality/cycle827/proof827.py \
            --source _cycle827_ci/output/cycle826_AI_WORK_LIVE_PROMPT_JAPANESE_REVIEW_ONLY.mp4 \
            --output _cycle827_ci/output/cycle827_AI_WORK_SOURCE_PROOF_JAPANESE_REVIEW_ONLY.mp4 \
            --genre ai_work --report _cycle827_ci/output/qa827.json
      - name: Assert Japanese captions and full MP4 technical QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_cycle827_ci/output')
          a=json.loads((p/'qa826.json').read_text())
          b=json.loads((p/'qa827.json').read_text())
          c=json.loads((p/'script_caption_audit825.json').read_text())
          assert all(a['checks'].values()) and all(b['checks'].values()),b
          assert b['fictional_math_verified']
          assert c['source_text_parity'] and c['caption_states']==24
          assert not b['publication_approved'] and not b['auto_post']
          print('Technical QA PASS; human review still required')
          PY
      - name: Upload actual Japanese narrated MP4 and evidence
        uses: actions/upload-artifact@v4
        with:
          name: cycle827-SOURCE-PROOF-JAPANESE-REVIEW-ONLY
          path: |
            _cycle827_ci/output/cycle827_AI_WORK_SOURCE_PROOF_JAPANESE_REVIEW_ONLY.mp4
            _cycle827_ci/output/qa827.json
            _cycle827_ci/output/script_caption_audit825.json
            _cycle827_ci/VOICE_LICENSE_ATTRIBUTION.txt
            _cycle827_ci/NOT_FOR_PUBLICATION.txt
          if-no-files-found: error
          retention-days: 7
