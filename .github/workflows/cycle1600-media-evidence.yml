name: cycle1600 media evidence checks
on:
  pull_request:
    paths:
      - 'quality/cycle1600/**'
      - '.github/workflows/cycle1600-media-evidence.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run fail-closed media gate tests
        run: python -m unittest -v quality.cycle1600.test_media_probe
