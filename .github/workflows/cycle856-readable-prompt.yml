name: cycle856 review-only readable prompt CI
on:
  push:
    branches:
      - 'automation/cycle856-*'
  pull_request:
    paths:
      - 'cycle856/**'
      - '.github/workflows/cycle856-readable-prompt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.8,<5' 'Pillow>=10,<13'
      - name: Ten-genre tests and strict safety gates
        run: |
          python -m compileall -q cycle856
          PYTHONPATH=cycle856 python -m unittest discover -s cycle856 -p 'test_*.py' -v
      - name: Synthetic 2s MP4/AAC smoke (NO private Japanese review media)
        run: |
          mkdir -p /tmp/cycle856
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x273c4b:s=1080x1920:r=30 \
            -f lavfi -i sine=frequency=500:sample_rate=48000 -t 2 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle856/source.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          from cycle856.prompt_legibility import POLICY,sha256
          Path('/tmp/cycle856/manifest.json').write_text(json.dumps({**POLICY,'source_sha256':sha256('/tmp/cycle856/source.mp4')}))
          PY
          python cycle856/prompt_legibility.py --source /tmp/cycle856/source.mp4 \
            --output /tmp/cycle856/output.mp4 --manifest /tmp/cycle856/manifest.json \
            --report /tmp/cycle856/qa.json --window 0 60
          ffmpeg -v error -xerror -i /tmp/cycle856/output.mp4 -f null -
