name: Video production v2 integration regression
on:
  push:
    branches: [feature/video-production-v2-e2e]
    paths:
      - '.github/workflows/production-v2-integration-tests.yml'
      - 'video_engine/production_v2/integration.py'
      - 'video_engine/production_v2/creative.py'
      - 'video_engine/production_v2/test_integration.py'
      - 'employee_management/**'
      - 'src/manual_posting_flow.py'
      - 'src/analytics_improvement.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install 'Pillow==11.3.0'
      - name: Exercise isolated synthetic identity and analysis fixture
        run: |
          python -m unittest video_engine.production_v2.test_pipeline video_engine.production_v2.test_integration -v
