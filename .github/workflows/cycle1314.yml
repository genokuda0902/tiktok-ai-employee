name: cycle1314 review renderer tests
on:
  pull_request:
    paths:
      - 'quality/cycle1314/**'
      - '.github/workflows/cycle1314.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s quality/cycle1314 -p 'test_*.py' -v
