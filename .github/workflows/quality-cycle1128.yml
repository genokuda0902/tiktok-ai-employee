name: cycle1128 review-only period consistency QA
on:
  push:
    branches:
      - quality/cycle1128-period-consistency
    paths:
      - 'quality/cycle1128/**'
      - '.github/workflows/quality-cycle1128.yml'
  pull_request:
    paths:
      - 'quality/cycle1128/**'
      - '.github/workflows/quality-cycle1128.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13'
      - name: Run fail-closed policy tests and synthetic video smoke
        run: python -m unittest discover -s quality/cycle1128 -p 'test_*.py' -v
      - name: Prevent private media being committed
        run: |
          test ! -e quality/cycle1128/private_manifest.json
          test ! -e quality/cycle1128/real_private.mp4
          echo 'CI checks synthetic media only; private finished MP4 is not on GitHub.'
