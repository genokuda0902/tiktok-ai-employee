name: cycle1229-speech-cue-review
on:
  push:
    branches: [quality/cycle1229-speech-cue]
  pull_request:
    paths:
      - 'quality/cycle1229/**'
      - '.github/workflows/cycle1229-speech-cue.yml'
  workflow_dispatch:
jobs:
  offline-speech-cue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Unit tests (10 genre palettes)
        run: python -m unittest discover -s quality/cycle1229/tests -p 'test_*.py' -v
      - name: Synthetic 1080x1920 A/V smoke
        run: python quality/cycle1229/tests/ci_smoke.py
