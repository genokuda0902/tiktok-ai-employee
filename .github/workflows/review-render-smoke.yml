name: review-render-smoke
on:
  pull_request:
    paths:
      - 'experiments/cycle1589/**'
      - '.github/workflows/review-render-smoke.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s experiments/cycle1589 -p 'test_*.py' -v
