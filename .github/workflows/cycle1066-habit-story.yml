name: cycle1066 habit storyboard synthetic QA
on:
  push:
    branches:
      - 'quality/cycle1066-habit-story-20261031'
    paths:
      - 'quality/cycle1066/**'
      - '.github/workflows/cycle1066-habit-story.yml'
  pull_request:
    paths:
      - 'quality/cycle1066/**'
      - '.github/workflows/cycle1066-habit-story.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Test ten genres, scene boundaries, SRT parsing
        run: python -m unittest quality.cycle1066.test_habit_story -v
      - name: Synthetic H264 AAC smoke
        run: python -m quality.cycle1066.habit_story --smoke
