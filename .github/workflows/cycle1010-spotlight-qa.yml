name: cycle1010 before-after spotlight (synthetic-only)
on:
  push:
    branches:
      - automation/cycle1010-before-after-spotlight-20261030
    paths:
      - 'cycle1010/**'
      - '.github/workflows/cycle1010-spotlight-qa.yml'
  pull_request:
    paths:
      - 'cycle1010/**'
      - '.github/workflows/cycle1010-spotlight-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-spotlight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open-source test dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run fail-closed and geometry tests
        run: python -m unittest discover -s cycle1010/tests -p 'test_*.py' -v
      - name: Generate synthetic spotlight and decode test
        run: |
          mkdir -p /tmp/c1010/overlay
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('cycle1010/source/spotlight_review.py')
          s=importlib.util.spec_from_file_location('spotlight_review',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          for i in range(m.END_FRAME):
              m.draw_overlay(Path('/tmp/c1010/overlay')/f'overlay_{i:03d}.png',i)
          from PIL import Image
          assert Image.open('/tmp/c1010/overlay/overlay_012.png').mode=='RGBA'
          assert m.OVERLAY_Y+m.OVERLAY_HEIGHT<=m.CAPTION_SAFE_Y
          PY
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x081827:s=1080x1920:r=30:d=2 -f lavfi -i sine=frequency=400:sample_rate=48000:duration=2 -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 34 -pix_fmt yuv420p -c:a aac -metadata:s:a:0 language=jpn -shortest /tmp/c1010/in.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/c1010/in.mp4 -framerate 30 -i /tmp/c1010/overlay/overlay_%03d.png -filter_complex "[0:v][1:v]overlay=0:280:eof_action=pass:format=auto,format=yuv420p[v]" -map "[v]" -map 0:a:0 -c:v libx264 -preset ultrafast -crf 34 -c:a copy /tmp/c1010/out.mp4
          ffmpeg -v error -xerror -i /tmp/c1010/out.mp4 -map 0:v:0 -f null -
          ffmpeg -v error -xerror -i /tmp/c1010/out.mp4 -map 0:a:0 -f null -
          python - <<'PY'
          import json,subprocess
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json','/tmp/c1010/out.mp4']))
          v,a=p['streams']
          assert (v['width'],v['height'],v['r_frame_rate'])==(1080,1920,'30/1')
          assert a['codec_name']=='aac' and a['sample_rate']=='48000'
          print('SYNTHETIC ONLY QA PASS; private Japanese MP4 is NOT on GitHub')
          PY
      - name: Reject private media in repository
        run: |
          test ! -d cycle1010/output
          echo "Source and tests only; no real reference MP4 or personal assets uploaded."
