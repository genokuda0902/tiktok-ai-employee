name: Cycle1129 template-vault QA
on:
  push:
    branches:
      - quality/cycle1129-template-vault-20261031
    paths:
      - 'quality/cycle1129/**'
      - '.github/workflows/cycle1129-template-vault.yml'
  pull_request:
    paths:
      - 'quality/cycle1129/**'
      - '.github/workflows/cycle1129-template-vault.yml'
permissions:
  contents: read
jobs:
  test-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          python -m pip install --disable-pip-version-check pillow
      - name: Ten-genre and animation unit tests
        run: python -m unittest discover -s quality/cycle1129 -p 'test_*.py' -v
      - name: Render one real frame for every genre
        run: |
          PYTHONPATH=quality/cycle1129 python - <<'PY'
          from template_vault import GENRE_DATA,render_art
          for genre in GENRE_DATA:
              frame=render_art(1.9,genre)
              assert frame.size==(951,803)
          print('10/10 original images rendered')
          PY
      - name: Synthetic H264 AAC vertical video smoke test
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x102b42:s=1080x1920:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle1129_synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1129_synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,sample_rate -of compact /tmp/cycle1129_synthetic.mp4
