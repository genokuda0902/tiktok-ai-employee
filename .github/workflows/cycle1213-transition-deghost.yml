name: cycle1213-transition-deghost-review
on:
  push:
    branches: [quality/cycle1213-transition-deghost]
  pull_request:
    paths:
      - 'quality/cycle1213/**'
      - '.github/workflows/cycle1213-transition-deghost.yml'
  workflow_dispatch:
jobs:
  tests-and-synthetic-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-only free dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test deghost and caption protection
        run: python -m unittest discover -s quality/cycle1213/tests -p 'test_*.py' -v
      - name: Synthetic 2s vertical video end-to-end
        run: python quality/cycle1213/tests/ci_smoke.py
