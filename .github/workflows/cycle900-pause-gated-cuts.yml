name: cycle900 pause-gated cut review-only QA
on:
  push:
    paths:
      - 'quality/cycle900/**'
      - '.github/workflows/cycle900-pause-gated-cuts.yml'
  pull_request:
    paths:
      - 'quality/cycle900/**'
      - '.github/workflows/cycle900-pause-gated-cuts.yml'
jobs:
  offline-review-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source test dependency
        run: python -m pip install numpy
      - name: Test ten-genre cut gating and fail-closed policy
        run: python -m unittest discover -s quality/cycle900/tests -p 'test_*.py' -v
      - name: Compile and validate publication policy
        run: |
          python -m compileall -q quality/cycle900/src quality/cycle900/tests
          python - <<'PY'
          import sys
          sys.path.insert(0,'quality/cycle900/src')
          from voice_pause_transitions import GENRES, POLICY, EFFECT_BOTTOM, CAPTION_TOP
          assert len(set(GENRES)) == 10
          assert EFFECT_BOTTOM < CAPTION_TOP
          assert POLICY['publication_approved'] is False
          assert POLICY['automatic_posting'] is False
          assert POLICY['external_upload'] is False
          assert POLICY['paid_service'] is False
          print('No private media in CI; full MP4 must be reviewed locally.')
          PY
