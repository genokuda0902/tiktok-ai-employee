name: Cycle895 native Japanese document
on:
  pull_request:
    paths:
      - 'experiments/cycle895/**'
      - '.github/workflows/cycle895-native-document-proof.yml'
  workflow_dispatch:
jobs:
  renderer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source dependencies
        run: |
          python -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit tests
        run: python -m unittest discover -s experiments/cycle895/tests -v
      - name: Render and verify three states
        run: |
          python experiments/cycle895/src/native_document_reveal.py --output /tmp/cycle895
          python -c "from PIL import Image;from pathlib import Path;p=list(Path('/tmp/cycle895').glob('*.png'));assert len(p)==3 and all(Image.open(x).size==(1080,1920) for x in p)"
