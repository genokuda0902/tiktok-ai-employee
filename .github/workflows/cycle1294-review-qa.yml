name: cycle1294 review QA
on:
  pull_request:
    paths:
      - 'quality/cycle1294/**'
      - '.github/workflows/cycle1294-review-qa.yml'
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install pillow
      - run: python -m unittest discover -s quality/cycle1294 -p 'test_*.py' -v
      - run: python quality/cycle1294/render.py
      - run: ffmpeg -v error -i quality/cycle1294/cycle1294_REVIEW_ONLY.mp4 -f null -
      - run: ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json quality/cycle1294/cycle1294_REVIEW_ONLY.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cycle1294-review-only
          path: |
            quality/cycle1294/cycle1294_REVIEW_ONLY.mp4
            quality/cycle1294/captions.srt
