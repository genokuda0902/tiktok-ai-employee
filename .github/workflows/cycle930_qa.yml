name: cycle930 evidence comparison QA (review only)
on:
  pull_request:
    paths:
      - 'cycle930/**'
      - '.github/workflows/cycle930_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies and Noto Japanese font
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Unit tests (all 10 genre presets)
        run: python -m unittest discover -s cycle930/tests -p 'test_*.py' -v
      - name: Fail closed on private media or posting
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle930/src/scene06_evidence.py
          test ! -e cycle930/output
          test ! -e cycle930/private
