name: cycle1150-proof-first-review
on:
  push:
    branches: [quality/cycle1150-proof-first]
  pull_request:
    paths:
      - 'quality/cycle1150/**'
      - '.github/workflows/cycle1150-proof-first.yml'
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install pillow==11.1.0
      - name: Ten-genre tests
        env:
          PYTHONPATH: quality/cycle1150
        run: python -m unittest discover -s quality/cycle1150/tests -p 'test_*.py' -v
      - name: Synthetic 2s A/V proof
        env:
          PYTHONPATH: quality/cycle1150
        run: python quality/cycle1150/tests/ci_smoke.py
