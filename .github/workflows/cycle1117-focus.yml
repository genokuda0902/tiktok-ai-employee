name: cycle1117 kinetic focus smoke
on:
  pull_request:
    paths:
      - 'quality/cycle1117/**'
      - '.github/workflows/cycle1117-focus.yml'
  workflow_dispatch:
jobs:
  synthetic-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Unit tests
        run: python -m unittest discover -s quality/cycle1117/tests -v
      - name: Render and decode synthetic 2s 1080x1920 H264 AAC
        run: python quality/cycle1117/ci_smoke.py
