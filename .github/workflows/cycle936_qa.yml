name: cycle936 guided prompt typing QA (review only)
on:
  pull_request:
    paths:
      - 'cycle936/**'
      - '.github/workflows/cycle936_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-typing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Japanese fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13'
      - name: Run 10-genre synthetic render tests
        run: python -m unittest discover -s cycle936/tests -p 'test_*.py' -v
      - name: Fail closed for publication and private media
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle936/src/prompt_typing_scene04.py
          test ! -e cycle936/output
          test ! -e cycle936/private
          ! find cycle936 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.xlsx' -o -iname '*.aac' \) | grep .
