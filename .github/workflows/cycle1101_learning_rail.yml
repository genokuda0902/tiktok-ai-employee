name: Cycle1101 Japanese Learning Rail QA
on:
  pull_request:
    paths:
      - "quality/cycle1101/**"
      - "tests/test_cycle1101_learning_rail.py"
      - ".github/workflows/cycle1101_learning_rail.yml"
  push:
    branches:
      - "quality/cycle1101-learning-rail-20261031"
  workflow_dispatch:
jobs:
  synthetic-review-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source FFmpeg and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Test all genre presets and caption safe zone
        run: python3 -m unittest discover -s tests -p 'test_cycle1101_learning_rail.py' -v
      - name: Generate synthetic 2-second source and apply rail
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0x132235:s=1080x1920:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac \
            -shortest /tmp/rail_source.mp4
          python3 quality/cycle1101/step_spotlight.py /tmp/rail_source.mp4 /tmp/rail_test.mp4 --preset ultrafast
          ffmpeg -v error -i /tmp/rail_test.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,sample_rate -of json /tmp/rail_test.mp4
      - name: Explicit publication guard
        run: |
          echo "Synthetic QA only. No private media, upload, posting or approval."
