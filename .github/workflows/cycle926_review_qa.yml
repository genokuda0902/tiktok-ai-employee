name: cycle926 review-only scene02 clarity tests
on:
  pull_request:
    paths:
      - 'cycle926/**'
      - '.github/workflows/cycle926_review_qa.yml'
  workflow_dispatch:
jobs:
  review-only-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free fonts and Pillow
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Standard-library unit tests (no private media)
        run: python -m unittest discover -s cycle926/tests -p 'test_*.py' -v
      - name: Fail-closed review-only policy
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle926/src/scene02_workflow_clarity.py
          test ! -e cycle926/output
