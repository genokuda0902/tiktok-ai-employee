name: cycle926 review-only scene02 clarity tests
on:
  pull_request:
    paths:
      - 'cycle926/**'
      - '.github/workflows/cycle926_review_qa.yml'
  push:
    branches:
      - 'review/cycle926-scene02-task-clarity-20261028'
  workflow_dispatch:
jobs:
  scene02-review-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open-source renderer dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Render and policy unit tests (synthetic art only)
        run: python -m unittest discover -s cycle926/tests -p 'test_*.py' -v
      - name: Fail closed: private output never in public GitHub
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle926/src/scene02_workflow_clarity.py
          test ! -e cycle926/output
