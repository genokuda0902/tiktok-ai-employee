name: Cycle636 quality unit tests
on:
  pull_request:
    paths:
      - 'quality/cycle636/**'
      - '.github/workflows/quality-cycle636.yml'
  workflow_dispatch:
jobs:
  wipe-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install 'Pillow>=9,<12'
      - run: python -m unittest discover -s quality/cycle636 -p 'test_*.py' -v
