name: cycle844-caption-beat-progress
on:
  pull_request:
    paths:
      - 'automation/cycle844/**'
      - '.github/workflows/cycle844-caption-beat-progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-cost unit tests (no media or posting)
        working-directory: automation/cycle844
        run: python -m unittest -v test_caption_pulse.py
