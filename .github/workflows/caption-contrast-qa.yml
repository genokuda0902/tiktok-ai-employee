name: Caption contrast QA
on:
  pull_request:
    paths:
      - 'src/caption_contrast.py'
      - 'tests/test_caption_contrast.py'
      - '.github/workflows/caption-contrast-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_caption_contrast.py' -v
