name: Cycle 1439 narration QA
on:
  pull_request:
    paths:
      - 'src/quality_narration_gate.py'
      - 'tests/test_quality_narration_gate.py'
      - '.github/workflows/cycle1439-narration-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_quality_narration_gate.py -v
