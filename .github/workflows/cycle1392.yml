name: cycle1392 review-only video QA
on:
  pull_request:
    paths:
      - 'experiments/cycle1392/**'
      - '.github/workflows/cycle1392.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install Pillow==11.3.0
      - run: bash experiments/cycle1392/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cycle1392-review-only
          path: experiments/cycle1392/cycle1392_REVIEW_ONLY.mp4
