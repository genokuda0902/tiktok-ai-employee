name: cycle872 cinematic first-3s hook (review only)
on:
  push:
    branches: [automation/cycle872-cinematic-hook-20261027]
    paths:
      - 'cycle872/**'
      - '.github/workflows/cycle872-cinematic-hook.yml'
  pull_request:
    paths:
      - 'cycle872/**'
      - '.github/workflows/cycle872-cinematic-hook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Test genre presets, motion and fail-closed gates
        run: PYTHONPATH=cycle872 python -m unittest discover -s cycle872 -p 'test_*.py' -v
      - name: Synthetic one-second H264 AAC decode (NOT private finished MP4)
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i color=c=0x123456:s=360x640:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/cycle872_synthetic.mp4
          "$FFMPEG" -v error -xerror -i /tmp/cycle872_synthetic.mp4 -f null -
