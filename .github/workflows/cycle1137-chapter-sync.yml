name: cycle1137 chapter-synced sweep synthetic QA
on:
  push:
    branches: ['quality/cycle1137-chapter-sync-20261101']
  pull_request:
    paths:
      - 'quality/cycle1137/**'
      - '.github/workflows/cycle1137-chapter-sync.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free local dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Ten-genre timing regression tests
        run: python -m unittest discover -s quality/cycle1137 -p 'test_*.py' -v
      - name: Synthetic chapter-aligned H264/AAC video and full decode
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x071d2c:s=1080x1920:r=30:d=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/source.mp4
          cat > /tmp/chapters.ffmeta <<'EOF'
          ;FFMETADATA1
          [CHAPTER]
          TIMEBASE=1/1000
          START=0
          END=500
          title=Scene 1
          [CHAPTER]
          TIMEBASE=1/1000
          START=500
          END=1000
          title=Scene 2
          [CHAPTER]
          TIMEBASE=1/1000
          START=1000
          END=2000
          title=Scene 3
          EOF
          ffmpeg -hide_banner -loglevel error -y -i /tmp/source.mp4 -i /tmp/chapters.ffmeta -map_metadata 1 -map_chapters 1 -c copy /tmp/chapters.mp4
          python quality/cycle1137/chapter_sync.py /tmp/chapters.mp4 /tmp/cycle1137_synthetic.mp4
          ffmpeg -v error -i /tmp/cycle1137_synthetic.mp4 -f null -
          python - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_chapters','-of','json','/tmp/cycle1137_synthetic.mp4']))
          v=next(x for x in d['streams'] if x['codec_type']=='video')
          a=next(x for x in d['streams'] if x['codec_type']=='audio')
          assert (v['width'],v['height'],v['avg_frame_rate'])==(1080,1920,'30/1')
          assert a['codec_name']=='aac'
          assert len(d['chapters'])==3
          print('PASS: 1080x1920/30fps, AAC, chapters, full decode')
          PY
      - name: Synthetic-only artifact (no user video)
        uses: actions/upload-artifact@v4
        with:
          name: cycle1137-synthetic-qa
          path: /tmp/cycle1137_synthetic.mp4
          retention-days: 3
