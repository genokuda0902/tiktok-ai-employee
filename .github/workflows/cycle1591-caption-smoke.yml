name: cycle1591-caption-smoke
on:
  pull_request:
    paths:
      - 'src/caption_timeline.py'
      - 'tests/test_caption_timeline.py'
      - '.github/workflows/cycle1591-caption-smoke.yml'
  workflow_dispatch:
jobs:
  caption-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_caption_timeline.py' -v
