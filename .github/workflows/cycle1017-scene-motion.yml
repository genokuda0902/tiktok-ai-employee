name: cycle1017-scene-motion-synthetic-ci
on:
  push:
    branches:
      - quality/cycle1017-scene-safe-pushin-20261030
  pull_request:
jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check numpy pillow pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_cycle1017_scene_motion.py
      - name: Generate synthetic 2-second chaptered test media
        run: |
          cat > /tmp/chapters.ffmeta <<'EOF'
          ;FFMETADATA1
          [CHAPTER]
          TIMEBASE=1/1000
          START=0
          END=1000
          title=01/02
          [CHAPTER]
          TIMEBASE=1/1000
          START=1000
          END=2000
          title=02/02
          EOF
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1080x1920:rate=30:duration=2" \
            -f lavfi -i "sine=frequency=700:sample_rate=48000:duration=2" \
            -f ffmetadata -i /tmp/chapters.ffmeta \
            -map 0:v -map 1:a -map_chapters 2 \
            -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p \
            -c:a aac -metadata:s:a:0 language=jpn -shortest /tmp/cycle1017_input.mp4
      - name: Render scene-safe motion and decode output
        run: |
          python tools/quality/cycle1017_scene_motion.py /tmp/cycle1017_input.mp4 /tmp/cycle1017_output.mp4
          ffmpeg -hide_banner -v error -xerror -i /tmp/cycle1017_output.mp4 -f null -
          python - <<'PY'
          import json, subprocess
          obj=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_chapters','-of','json','/tmp/cycle1017_output.mp4']))
          v=next(x for x in obj['streams'] if x['codec_type']=='video')
          a=next(x for x in obj['streams'] if x['codec_type']=='audio')
          assert (v['width'],v['height'],v['r_frame_rate'])==(1080,1920,'30/1')
          assert int(v['nb_frames'])==60
          assert a['sample_rate']=='48000'
          assert len(obj['chapters'])==2
          print('PASS synthetic 2s full decode, 60 frames, 2 chapters, AAC')
          PY
