name: cycle878 mobile-safe Japanese captions (review only)
on:
  push:
    branches: [automation/cycle878-mobile-captions-20261027]
    paths:
      - 'cycle878/**'
      - 'PROJECT_HANDOFF.md'
      - '.github/workflows/cycle878-mobile-captions.yml'
  pull_request:
    paths:
      - 'cycle878/**'
      - 'PROJECT_HANDOFF.md'
      - '.github/workflows/cycle878-mobile-captions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caption-geometry-and-synthetic-av:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Ten genre safe-area caption tests
        run: PYTHONPATH=. python -m unittest discover -s cycle878 -p 'test_*.py' -v
      - name: Synthetic 1-second Japanese caption render and A/V decode (not finished MP4)
        run: PYTHONPATH=. python -m cycle878.ci_smoke
