name: cycle881 source proof and caption review CI
on:
  push:
    branches:
      - 'automation/cycle881-*'
  pull_request:
    paths:
      - 'cycle881/**'
      - '.github/workflows/cycle881-proof-audit.yml'
  workflow_dispatch:
jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free bundled FFmpeg for synthetic smoke
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Ten-genre unit tests and fail-closed caption review
        run: python -m unittest discover -s cycle881 -p 'test_*.py' -v
      - name: Synthetic A/V encode and decode
        run: python cycle881/ci_smoke.py
