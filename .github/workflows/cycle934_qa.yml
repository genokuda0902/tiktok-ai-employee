name: cycle934 animated Before/After hook QA (review only)
on:
  pull_request:
    paths:
      - 'cycle934/**'
      - '.github/workflows/cycle934_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Japanese fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13'
      - name: Test 10 genre hook presets on synthetic images
        run: python -m unittest discover -s cycle934/tests -p 'test_*.py' -v
      - name: Fail closed for publication and private media
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle934/src/hook_before_after.py
          test ! -e cycle934/output
          test ! -e cycle934/private
          ! find cycle934 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.xlsx' -o -iname '*.aac' \) | grep .
