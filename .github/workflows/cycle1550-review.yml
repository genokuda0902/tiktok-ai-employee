name: cycle1550 review-only CI
on:
  pull_request:
    paths:
      - 'experiments/cycle1550/**'
      - '.github/workflows/cycle1550-review.yml'
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install Pillow
      - name: Test and render
        run: |
          cd experiments/cycle1550
          python -m unittest -v test_render.py
          python render.py
          ffmpeg -v error -i cycle1550_REVIEW_ONLY.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -show_entries format=duration -of json cycle1550_REVIEW_ONLY.mp4 > probe.json
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle1550-review-only
          path: |
            experiments/cycle1550/cycle1550_REVIEW_ONLY.mp4
            experiments/cycle1550/probe.json
          retention-days: 7
