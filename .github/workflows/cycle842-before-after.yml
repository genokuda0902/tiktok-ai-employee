name: cycle842 before-after review-only QA
on:
  push:
    branches:
      - 'automation/cycle842-*'
    paths:
      - 'cycle842/**'
      - '.github/workflows/cycle842-before-after.yml'
  pull_request:
    paths:
      - 'cycle842/**'
      - '.github/workflows/cycle842-before-after.yml'
  workflow_dispatch:
jobs:
  synthetic-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source dependencies
        run: |
          python -m pip install 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Test ten-genre renderer and rights gates
        run: |
          python -m compileall -q cycle842
          PYTHONPATH=. python -m unittest discover -s cycle842 -p 'test_*.py' -v
      - name: Synthetic-only audio and video smoke
        run: |
          ffmpeg -v error -y -f lavfi -i color=c=navy:s=320x568:r=30:d=2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/c842_synth.mp4
          ffmpeg -v error -xerror -i /tmp/c842_synth.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/c842_synth.mp4
