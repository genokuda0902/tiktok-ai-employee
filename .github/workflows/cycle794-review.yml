name: cycle794 visual focus guidance synthetic CI
on:
  push:
    branches: ['quality/cycle794-*']
    paths:
      - 'quality/cycle794/**'
      - '.github/workflows/cycle794-review.yml'
  pull_request:
    paths:
      - 'quality/cycle794/**'
      - '.github/workflows/cycle794-review.yml'
permissions:
  contents: read
jobs:
  focus-guidance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Ensure FFmpeg and Japanese font
        run: |
          if ! command -v ffmpeg >/dev/null || [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg fonts-noto-cjk
          fi
      - name: Test 10 genre contracts and safe area
        run: python -m unittest discover -s quality/cycle794 -p 'test_*.py' -v
      - name: Generate rights-safe synthetic fixture
        run: |
          mkdir -p review_output/cycle794
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x10324b:s=1080x1920:r=30:d=23.843' -f lavfi -i 'sine=frequency=392:sample_rate=48000:duration=23.843' -frames:v 714 -c:v libx264 -preset ultrafast -crf 33 -pix_fmt yuv420p -c:a aac -b:a 64k review_output/cycle794/synthetic_source.mp4
      - name: Render full-duration synthetic technical MP4
        run: |
          python quality/cycle794/focus_guidance.py --config quality/cycle794/config.json --input review_output/cycle794/synthetic_source.mp4 --output review_output/cycle794/cycle794_SYNTHETIC_TONE_REVIEW_ONLY.mp4 --report review_output/cycle794/qa.json
          ffmpeg -v error -i review_output/cycle794/cycle794_SYNTHETIC_TONE_REVIEW_ONLY.mp4 -f null -
      - name: Upload synthetic QA only
        uses: actions/upload-artifact@v4
        with:
          name: cycle794-synthetic-tone-technical-not-user-video
          path: |
            review_output/cycle794/cycle794_SYNTHETIC_TONE_REVIEW_ONLY.mp4
            review_output/cycle794/qa.json
          retention-days: 7
