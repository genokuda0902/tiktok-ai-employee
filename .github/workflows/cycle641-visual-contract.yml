name: cycle641 visual contract QA
on:
  pull_request:
    paths:
      - 'quality/cycle641/**'
      - 'tests/test_cycle641_contract.py'
      - '.github/workflows/cycle641-visual-contract.yml'
  workflow_dispatch:
jobs:
  review-only-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ten genres, proof math and fail-closed approval
        run: python -m unittest discover -s tests -p 'test_cycle641_contract.py' -v
