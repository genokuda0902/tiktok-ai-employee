name: cycle799 dual-proof review CI
on:
  push:
    branches: ['quality/cycle799-*']
    paths:
      - 'quality/cycle799/**'
      - '.github/workflows/cycle799-review.yml'
  pull_request:
    paths:
      - 'quality/cycle799/**'
      - '.github/workflows/cycle799-review.yml'
permissions:
  contents: read
jobs:
  synthetic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free tools only
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.3.3
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg >/dev/null
      - name: Run quality and approval tests
        run: python -m unittest discover -s quality/cycle799 -p 'test_*.py' -v
      - name: Generate original 3.2-second synthetic proof
        run: |
          mkdir -p review_output/cycle799
          python quality/cycle799/verification_story.py --config quality/cycle799/config.json --segment review_output/cycle799/dual_proof_VIDEO_ONLY.mp4
          ffmpeg -hide_banner -loglevel error -y -i review_output/cycle799/dual_proof_VIDEO_ONLY.mp4 -f lavfi -i 'sine=frequency=440:duration=3.2:sample_rate=48000' -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 96k -shortest review_output/cycle799/dual_proof_SYNTHETIC_TONE_NOT_JAPANESE.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -of json review_output/cycle799/dual_proof_SYNTHETIC_TONE_NOT_JAPANESE.mp4
          ffmpeg -v error -i review_output/cycle799/dual_proof_SYNTHETIC_TONE_NOT_JAPANESE.mp4 -f null -
      - name: Upload synthetic-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle799-original-dual-proof-SYNTHETIC-TONE-NOT-JAPANESE
          path: review_output/cycle799/dual_proof_SYNTHETIC_TONE_NOT_JAPANESE.mp4
          retention-days: 7
