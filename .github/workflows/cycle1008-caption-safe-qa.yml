name: cycle1008 single-caption playback (synthetic-only QA)
on:
  push:
    branches:
      - automation/cycle1008-single-caption-safe-20261030
    paths:
      - 'cycle1008/**'
      - '.github/workflows/cycle1008-caption-safe-qa.yml'
  pull_request:
    paths:
      - 'cycle1008/**'
      - '.github/workflows/cycle1008-caption-safe-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-caption-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open-source FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Fail-closed policy and synthetic 1080x1920 MP4 remux tests
        run: python -m unittest discover -s cycle1008/tests -p 'test_*.py' -v
      - name: Verify no private media are needed
        run: |
          test ! -d cycle1008/output
          echo "Synthetic test media only; real 23-second Japanese MP4 is private and never uploaded."
