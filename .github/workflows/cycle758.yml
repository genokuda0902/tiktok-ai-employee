name: cycle758 offline hook image and config
on:
  push:
    branches:
      - 'quality/cycle758-*'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: python -m pip install pillow pytest
      - run: python -m pytest -q quality/cycle758/tests
