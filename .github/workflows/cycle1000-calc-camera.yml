name: cycle1000 guided Calc camera (synthetic only)
on:
  push:
    branches:
      - automation/cycle1000-guided-calc-camera-20261030
  pull_request:
    paths:
      - 'tools/quality/cycle1000_calc_focus_camera.py'
      - 'tests/cycle1000/**'
      - '.github/workflows/cycle1000-calc-camera.yml'
  workflow_dispatch:
jobs:
  synthetic-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Nine safe-area and review-gate tests
        run: |
          PYTHONPATH=tools/quality python -m unittest discover -s tests/cycle1000 -p 'test_*.py' -v
      - name: Synthetic 1-second H264 AAC decode smoke (NOT the private MP4)
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=1080x1920:r=30:d=1 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/cycle1000_synthetic.mp4
          ffmpeg -v error -xerror -i /tmp/cycle1000_synthetic.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/cycle1000_synthetic.mp4
