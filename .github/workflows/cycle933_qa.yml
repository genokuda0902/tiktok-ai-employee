name: cycle933 real GUI evidence lens QA (review only)
on:
  pull_request:
    paths:
      - 'cycle933/**'
      - '.github/workflows/cycle933_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image dependencies and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13'
      - name: Unit tests on synthetic pixels only
        run: python -m unittest discover -s cycle933/tests -p 'test_*.py' -v
      - name: Protect private media and publication gate
        run: |
          grep -q 'PUBLICATION_NOT_APPROVED' cycle933/src/evidence_lens.py
          test ! -e cycle933/output
          test ! -e cycle933/private
          ! find cycle933 -type f \( -iname '*.mp4' -o -iname '*.wav' -o -iname '*.xlsx' \) | grep .
