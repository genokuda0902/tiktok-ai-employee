name: AI Jitan Complete Video v8

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq fonts-noto-cjk python3-pip
          pip3 install --break-system-packages pillow numpy requests
      - name: Prepare AivisSpeech model directory
        run: |
          mkdir -p "$HOME/.local/share/AivisSpeech-Engine/Models"
          curl -L --fail --retry 3 "https://api.aivis-project.com/v1/aivm-models/9107b8b6-1ed1-43f5-bebe-0de4df4d229d/download?model_type=AIVMX" -o "$HOME/.local/share/AivisSpeech-Engine/Models/chu2.aivmx"
          echo "e4fd1c287f65e1ea32a81333b35ebc0db09435d186a97af4aa3d8aeea6351a40  $HOME/.local/share/AivisSpeech-Engine/Models/chu2.aivmx" | sha256sum -c -
          sudo chown -R 1000:1000 "$HOME/.local/share/AivisSpeech-Engine"
      - name: Start AivisSpeech Engine
        run: |
          docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          docker run -d --name aivis -p 10101:10101 -v "$HOME/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev" ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          READY=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:10101/speakers > speakers.json; then READY=1; break; fi
            if ! docker ps --format '{{.Names}}' | grep -qx aivis; then docker logs aivis || true; exit 1; fi
            sleep 5
          done
          test "$READY" = "1"
      - name: Generate narration
        run: python3 src/synthesize.py
      - name: Build v8 asset contract
        run: python3 src/v8_asset_manifest.py
      - name: Generate operation capture
        run: python3 src/v8_capture.py
      - name: Build edit plan
        run: python3 src/v7_storyboard.py
      - name: Verify branded presenter
        run: |
          mkdir -p assets/robot
          test -f assets/robot/presenter.png || { echo 'V8 BLOCKED: branded 3D robot presenter asset is required'; exit 1; }
      - name: Build complete vertical video
        run: python3 src/build_video.py
      - name: Technical QA
        run: python3 src/qa.py
      - name: Creative quality gate
        run: python3 src/quality_gate.py
      - name: Upload finished MP4 and QA
        uses: actions/upload-artifact@v4
        with:
          name: ai-jitan-v8
          path: |
            output/AI時短ラボ_01_完成版.mp4
            output/operation_demo.mp4
            output/v8_asset_manifest.json
            output/v7_storyboard.json
            output/qa_report.json
            output/creative_qa.json
          retention-days: 14
