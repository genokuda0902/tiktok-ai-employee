name: Review-only Actions artifact to private Drive (no publishing)
on:
  workflow_dispatch:
  push:
    branches: [feature/drive-delivery-proof-20260919]
    paths: [.github/workflows/drive-review-artifact-handoff.yml, scripts/drive_review_artifact_handoff.py]
permissions:
  contents: read
  actions: read
jobs:
  drive-review-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: drive-review-only
    env:
      SOURCE_RUN_ID: '35321564044'
      SOURCE_ARTIFACT_NAME: pi5-v9-review-only
      SOURCE_ARTIFACT_ID: '10537910824'
      DESTINATION_FOLDER_ID: 14rtOvwFKmycVO5Irq1X8QJ4-vgO2xUMk
      EXPECTED_SHA256: c5b0bc27be175b9c990cb4ef91d63ef2c35d045ed890c95cb6c02d329c0ae472
      DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_REVIEW_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require private Drive credentials before downloading artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRIVE_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'BLOCKED: DRIVE_REVIEW_SERVICE_ACCOUNT_JSON is not configured in drive-review-only environment/repository secrets.' >&2
            exit 20
          fi
      - name: Install Google Drive client
        run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
      - name: Download original GitHub Actions artifact ZIP (no regeneration)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review_artifact"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT_NAME" --dir "$RUNNER_TEMP/review_artifact"
          test -s "$RUNNER_TEMP/review_artifact/pi5_review_20s.mp4"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/review_artifact/pi5_review_20s.mp4" | sha256sum --check
      - name: Upload MP4 to private Drive, download actual bytes and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python scripts/drive_review_artifact_handoff.py "$RUNNER_TEMP/review_artifact/pi5_review_20s.mp4"
