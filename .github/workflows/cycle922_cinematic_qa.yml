name: cycle922 review-only cinematic slide QA
on:
  pull_request:
    paths:
      - 'cycle922/**'
      - '.github/workflows/cycle922_cinematic_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source dependencies and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Run eight renderer and safety tests
        run: python -m unittest cycle922/test_cinematic_sample.py -v
      - name: Render synthetic frames only
        run: |
          python cycle922/cinematic_sample.py --out /tmp/cycle922_preview --preview-only
          test "$(find /tmp/cycle922_preview -name '*.png' | wc -l)" -eq 3
      - name: Fail closed on private media in this PR
        run: |
          if git ls-files cycle922 | grep -Ei '\.(mp4|mov|wav|aac|mp3|png|jpg|jpeg)$'; then
            echo 'Private media must not be committed'; exit 1
          fi
