name: Cycle646 Cross-Genre QA
on:
  pull_request:
    paths:
      - "quality/cycle646/**"
      - ".github/workflows/cycle646-qa.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run cross-genre QA tests
        run: python -m unittest discover -s quality/cycle646 -p "test_*.py" -v
