name: cycle1636-motion-qa
on:
  pull_request:
    paths:
      - 'experiments/cycle1636/**'
      - '.github/workflows/cycle1636-motion-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: cd experiments/cycle1636 && python -m unittest -v test_render_cycle1636.py
