name: cycle936 depth focus synthetic QA
on:
  pull_request:
    paths:
      - 'cycle936/**'
      - '.github/workflows/cycle936-depth-focus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-depth-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Verify 10 genre profiles and text/caption protection
        run: python -m unittest discover -s cycle936/tests -v
