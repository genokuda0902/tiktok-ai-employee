name: cycle951 deghost quality tests
on:
  pull_request:
    paths:
      - 'quality_cycles/cycle951/**'
      - '.github/workflows/cycle951-deghost.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deghost-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest
      - name: Run 26 deterministic tests
        run: python -m pytest -q quality_cycles/cycle951/tests/test_deghost.py
      - name: Verify publication gate in docs
        run: grep -q 'PUBLICATION_NOT_APPROVED' quality_cycles/cycle951/README.md
