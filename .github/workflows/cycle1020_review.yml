name: cycle1020 review-only caption and audio QA
on:
  push:
    branches:
      - 'automation/cycle1020-caption-review-*'
  pull_request:
    paths:
      - 'cycle1020/**'
      - '.github/workflows/cycle1020_review.yml'
permissions:
  contents: read
jobs:
  synthetic-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install 'Pillow==11.3.0'
      - name: Unit tests
        run: python -m unittest discover -s cycle1020/tests -v
      - name: Generate two-second synthetic A/V (no private media)
        run: |
          mkdir -p cycle1020/tmp
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x07131f:s=1080x1920:r=30:d=2' \
            -f lavfi -i 'sine=frequency=420:sample_rate=48000:duration=2' \
            -map 0:v -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k -metadata:s:a:0 language=jpn -t 2 \
            cycle1020/tmp/synthetic_input.mp4
          cat > cycle1020/tmp/synthetic.srt <<'SRT'
          1
          00:00:00,000 --> 00:00:01,000
          テスト字幕です。
          音声とは未照合。

          2
          00:00:01,000 --> 00:00:02,000
          二つ目の字幕。
          承認前の動画。
          SRT
      - name: Render and verify captioned synthetic MP4
        run: |
          python cycle1020/source/caption_panel.py \
            --source cycle1020/tmp/synthetic_input.mp4 \
            --srt cycle1020/tmp/synthetic.srt \
            --output cycle1020/tmp/synthetic_output.mp4 \
            --report cycle1020/tmp/qa.json --genre travel --review-only --synthetic-ci
          ffmpeg -v error -xerror -i cycle1020/tmp/synthetic_output.mp4 -f null -
          python -c "import json; x=json.load(open('cycle1020/tmp/qa.json')); assert x['frames']==60 and x['audio_payload_unchanged'] and x['publication']=='NOT_APPROVED'"
      - name: Export audio review segments without claiming ASR
        run: |
          python cycle1020/source/audio_review.py \
            --source cycle1020/tmp/synthetic_output.mp4 \
            --srt cycle1020/tmp/synthetic.srt --out cycle1020/tmp/review_audio
          test "$(find cycle1020/tmp/review_audio -name '*.wav' | wc -l)" -eq 2
