name: cycle771 image-first outro QA
on:
  push:
    branches:
      - quality/cycle771-*
  pull_request:
    paths:
      - quality/cycle771/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install free local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --user Pillow==11.3.0
      - name: Test ten genres and publication gate
        env:
          PYTHONPATH: quality/cycle771
        run: python -m unittest discover -s quality/cycle771 -p 'test_*.py' -v
      - name: Syntax and imports
        env:
          PYTHONPATH: quality/cycle771
        run: |
          python -m py_compile quality/cycle771/*.py
          ffmpeg -version | head -n 1
