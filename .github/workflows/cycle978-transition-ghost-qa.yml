name: cycle978 transition ghost QA (synthetic-only)
on:
  push:
    branches:
      - automation/cycle978-transition-ghost-fix-20261030
    paths:
      - 'cycle978/**'
      - '.github/workflows/cycle978-transition-ghost-qa.yml'
  pull_request:
    paths:
      - 'cycle978/**'
      - '.github/workflows/cycle978-transition-ghost-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Unit tests
        run: python -m unittest discover -s cycle978 -p 'test_*.py' -v
      - name: Generate synthetic ghosted source and repair it
        run: |
          mkdir -p /tmp/cycle978
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x062339:s=1080x1920:r=30:d=2' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=2' -vf "drawbox=x=280:y=350:w=500:h=550:color=red:t=fill:enable='between(n,10,18)',drawbox=x=100:y=1480:w=500:h=70:color=cyan:t=fill" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest /tmp/cycle978/source.mp4
          python cycle978/repair_transition.py --source /tmp/cycle978/source.mp4 --output /tmp/cycle978/output.mp4 --work /tmp/cycle978/work --start 10 --end 18 --anchor 20 --synthetic
          python cycle978/qa_transition.py --source /tmp/cycle978/source.mp4 --output /tmp/cycle978/output.mp4 --start 10 --end 18 --anchor 20 --report /tmp/cycle978/qa.json
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of json /tmp/cycle978/output.mp4
