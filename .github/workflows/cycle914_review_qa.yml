name: cycle914 review-only offline QA
on:
  push:
    paths:
      - 'review_cycles/cycle914/**'
      - '.github/workflows/cycle914_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle914/**'
      - '.github/workflows/cycle914_review_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ten genres, review gates, source SHA and caption safe region
        run: python3 -m unittest discover -s review_cycles/cycle914 -p 'test_cycle914.py' -v
      - name: Reject media and private manifests in public source
        shell: bash
        run: |
          if find review_cycles/cycle914 -type f \( -iname '*.mp4' -o -iname '*.jpg' -o -iname '*.png' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.xlsx' -o -iname '*private*' \) | grep -q .; then
            echo "Private media/manifest is forbidden in this PR" >&2
            exit 1
          fi
