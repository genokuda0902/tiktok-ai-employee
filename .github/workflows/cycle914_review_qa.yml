name: cycle914 offline review-only QA
on:
  push:
    paths:
      - 'review_cycles/cycle914/**'
      - '.github/workflows/cycle914_review_qa.yml'
  pull_request:
    paths:
      - 'review_cycles/cycle914/**'
      - '.github/workflows/cycle914_review_qa.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run stdlib source and policy tests
        run: python3 -m unittest discover -s review_cycles/cycle914 -p 'test_policy.py' -v
      - name: Block private media and publishing credentials
        run: |
          if find review_cycles/cycle914 -type f \( -iname '*.mp4' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.xlsx' \) | grep -q .; then
            echo 'Private media must not be committed' >&2
            exit 1
          fi
